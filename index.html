].map(o=>Object.assign({g:2,c:"kin",t:"mc"},o)));
/* 2級・tax */
Q.push(...[
{q:"所得税の計算では、所得の合計から税額控除を引いてから、所得控除を引き、最後に税率をかける。",a:false,ha:true,ng:"順番は「所得の合計 → <b>所得控除</b> → <b>税率</b> → <b>税額控除</b>」です。",fig:"taxFlow",
 exp:`<p>所得税の計算の流れ（ステップ）を、まず頭に入れましょう。</p><p>① 10種類の所得を<b>それぞれ計算</b><br>② 損益通算・損失の繰越控除をして<b>合計</b><br>③ <mark>所得控除</mark>（基礎控除、扶養控除、医療費控除など）を引く → <b>課税所得</b><br>④ <b>税率</b>をかける<br>⑤ <mark>税額控除</mark>（配当控除、住宅ローン控除など）を引く → 納める税額</p><p>「所得控除」は税率をかける<b>前</b>、「税額控除」は<b>後</b>、と区別するのがポイントです。</p>`,
 pt:"所得計算 → 合計 → 所得控除 → 税率 → 税額控除",
 hon:"所得税額は、各種所得の金額を計算して総所得金額等を求め、所得控除を差し引いた課税所得金額に税率を乗じ、税額控除を差し引いて算出する。"},
{q:"個人が事業用に使う建物（1998年4月以後に取得）の減価償却の方法は、定率法に限られる。",a:false,ha:true,ng:"1998年4月以後に取得した建物は<b>定額法</b>だけです。",
 exp:`<p>建物や機械は、長く使ううちに価値が減っていきます。買った代金を、<b>使う年数（耐用年数）に分けて少しずつ経費にする</b>のが<b>減価償却</b>です。</p><p>・<b>定額法</b>：毎年<b>同じ額</b>ずつ経費にする<br>・<b>定率法</b>：最初に<b>多く</b>、だんだん少なく経費にする</p><p>個人の場合、届け出をしなければ<b>定額法</b>（法定償却方法）。さらに、<mark>1998年4月以後に取得した建物</mark>や、2016年4月以後に取得した建物附属設備・構築物は、<mark>定額法だけ</mark>です。</p><p>なお、<b>土地</b>は古くならないので、減価償却しません。</p>`,
 pt:"建物（1998年4月以後取得）は定額法のみ。個人の法定償却方法は定額法。土地は減価償却しない",
 hon:"1998年4月1日以後に取得した建物の減価償却の方法は、定額法に限られる。"},
{q:"取得価額が20万円未満の物は、だれでも、減価償却をしないで使い始めた年に全額を経費にできる。",a:false,ha:true,ng:"全額を経費にできるのは<b>10万円未満</b>（または耐用年数1年未満）。20万円未満の資産は3年で均等に経費にする方法（一括償却資産）などになります。",
 exp:`<p>安い物までいちいち何年にも分けて経費にするのは大変ですよね。</p><p><mark>10万円未満</mark>または<mark>耐用年数1年未満</mark>の物（少額減価償却資産）は、<b>使い始めた年に全額を経費</b>にできます。</p><p>さらに、<b>青色申告をしている中小企業者等</b>（個人事業主も含む）は、<b>30万円未満</b>の物も、年合計<b>300万円</b>まで、一度に経費にできる特例があります。</p>`,
 pt:"10万円未満は全額経費／青色の中小企業者は30万円未満も（年300万円まで）",
 hon:"取得価額が10万円未満の減価償却資産は、その全額を業務の用に供した年分の必要経費に算入する。"},
{q:"アパートの賃貸が「事業的規模」かどうかは、おおむね「5棟10室」以上かどうかが目安である。",a:true,
 exp:`<p>アパートや家の貸し付けは、規模にかかわらず<b>不動産所得</b>です。でも、大きな規模で行っている（<b>事業的規模</b>）かどうかで、扱いが変わります。</p><p>目安は<mark>「5棟10室」</mark>：独立した家なら<b>5棟以上</b>、アパートなどの部屋なら<b>10室以上</b>。</p><p>事業的規模だと：<br>・青色申告特別控除が<b>最高65万円</b>（事業的規模でないと10万円まで）<br>・家族に払う給料を経費にできる（青色事業専従者給与）</p>`,
 pt:"不動産貸付の事業的規模＝5棟10室以上（65万円控除・専従者給与OK）",
 hon:"不動産の貸付けが事業的規模であるか否かは、社会通念上事業と称する程度の規模で行われているかどうかにより判定するが、形式基準として、おおむね5棟10室以上であれば事業的規模とされる。"},
{q:"総合課税の譲渡所得（土地・建物・株式以外の物を売ったもうけ）のうち、5年をこえて持っていた物の分（長期）は、その2分の1をほかの所得と合計する。",a:true,
 exp:`<p>ゴルフ会員権や金（ゴールド）、骨とう品などを売ったもうけは、<b>総合課税の譲渡所得</b>です。</p><p>計算：売った値段 −（取得費＋売る費用）− <b>特別控除50万円</b></p><p>持っていた期間で：<br>・<b>短期</b>（5年以下）：<b>全額</b>をほかの所得と合計<br>・<mark>長期</mark>（5年超）：<mark>2分の1</mark>をほかの所得と合計</p><p>注意：こちらの期間は、土地・建物（売った年の1月1日で判定）とちがい、<b>実際に持っていた期間</b>で数えます。</p><p>また、<b>生活に使う家具や服</b>などを売ったもうけは非課税です（1個30万円をこえる貴金属や書画などは課税）。</p>`,
 pt:"総合課税の譲渡所得：長期（5年超）はその1/2を総所得に算入",
 hon:"総合課税の対象となる譲渡所得のうち、長期譲渡所得の金額は、その2分の1相当額が総所得金額に算入される。"},
{q:"雑損控除は、災害や盗難のほか、詐欺の被害にあった場合も対象になる。",a:false,ha:true,ng:"<b>詐欺</b>や恐喝の被害は雑損控除の<b>対象外</b>です（災害・盗難・横領が対象）。",
 exp:`<p>雑損控除（ざっそんこうじょ）は、<b>災害・盗難・横領</b>で、住宅や家財などに損害を受けたときの所得控除です。</p><p>・<b>詐欺</b>や<b>恐喝</b>による損害は対象外<br>・控除しきれない分は<mark>翌年以後3年間くり越せる</mark>（特定非常災害の場合は5年）</p><p>所得控除の中で、<b>くり越しができるのは雑損控除だけ</b>です。</p>`,
 pt:"雑損控除：災害・盗難・横領が対象（詐欺は不可）。控除しきれない分は3年繰越し",
 hon:"雑損控除の額がその年分の総所得金額等から控除しきれない場合、その控除しきれない金額は、翌年以後3年間にわたり繰り越して控除することができる。"},
{q:"配偶者の合計所得金額が58万円をこえて133万円以下の場合、条件を満たせば「配偶者特別控除」が受けられる。",a:true,fig:"fuyo",
 exp:`<p>配偶者がパートなどで少し多くかせいでいて、配偶者控除の条件（合計所得58万円以下）をこえてしまっても、すぐにゼロにならないよう<b>配偶者特別控除</b>があります。</p><p>・配偶者の合計所得：<mark>58万円超133万円以下</mark>（2025年分から）<br>・本人の合計所得：<b>1,000万円以下</b><br>・控除額：最高<b>38万円</b>から、配偶者の所得が増えるにつれて段階的に減る</p><p>配偶者控除と配偶者特別控除は、<b>どちらか一方</b>しか使えません。また、夫婦がおたがいに配偶者特別控除を受けることもできません。</p>`,
 pt:"配偶者特別控除：配偶者の合計所得58万円超133万円以下・本人1,000万円以下",
 hon:"配偶者特別控除は、納税者本人の合計所得金額が1,000万円以下で、配偶者の合計所得金額が58万円超133万円以下である場合に適用を受けることができる。"},
{q:"「ひとり親控除」の額は27万円である。",a:false,ha:true,ng:"ひとり親控除は<b>35万円</b>。27万円は<b>寡婦控除</b>です。",
 exp:`<p>ひとり親控除は、結婚していない（離婚・死別・未婚）で、<b>子どもを1人で育てている人</b>のための所得控除です。</p><p>・控除額：<mark>35万円</mark><br>・本人の合計所得：<b>500万円以下</b><br>・子の総所得金額等が<b>58万円以下</b>（2025年分から）<br>・事実婚（内縁）の人がいないこと</p><p>子がいない場合などで、夫と離婚・死別した女性が受けられるのは<b>寡婦控除（27万円）</b>です。</p>`,
 pt:"ひとり親控除35万円（合計所得500万円以下）／寡婦控除27万円",
 hon:"ひとり親控除の額は35万円であり、納税者本人の合計所得金額が500万円以下であることが要件の一つとされている。"},
{q:"配当控除は、上場株式の配当を「申告分離課税」で確定申告した場合に受けられる。",a:false,ha:true,ng:"配当控除は「<b>総合課税</b>」を選んだ場合だけ。申告分離や申告不要では受けられません。",
 exp:`<p>会社のもうけには<b>法人税</b>がかかり、その残りから配当が出ます。その配当にまた所得税がかかると、<b>二重に税金</b>がかかることになりますね。</p><p>これを調整するのが<b>配当控除</b>（税額控除）です。</p><p>・<b>総合課税</b>を選んだ場合だけ（申告不要や申告分離課税では受けられない）<br>・課税総所得金額等が<mark>1,000万円以下</mark>の部分：配当所得の<mark>10%</mark><br>・1,000万円をこえる部分：<b>5%</b></p><p>J-REITの分配金や外国株の配当は対象外です。</p>`,
 pt:"配当控除：総合課税を選んだ場合のみ。1,000万円以下の部分は10%",
 hon:"上場株式等の配当所得について総合課税を選択した場合、課税総所得金額等が1,000万円以下であれば、配当所得の金額の10%相当額が配当控除の額となる。"},
{q:"マイホームを売って「居住用財産の3,000万円特別控除」を使った人は、その前後の年に新しい家を買っても、住宅ローン控除を使えない場合がある。",a:true,
 exp:`<p>マイホームの売却と購入の特例には、<b>いっしょに使えない組み合わせ</b>があります。</p><p>新しい家に住んだ年と、<mark>その前2年・後3年</mark>の間に、古い家を売って<b>3,000万円特別控除</b>や<b>軽減税率の特例</b>などを使った場合、<mark>住宅ローン控除は使えません</mark>。</p><p>どちらが有利かを計算して選ぶことになります。</p>`,
 pt:"居住年とその前2年・後3年に3,000万円控除等を使うと、住宅ローン控除は不可",
 hon:"住宅借入金等特別控除は、居住の用に供した年とその前2年・後3年の計6年間に、居住用財産の譲渡所得の3,000万円特別控除等の適用を受けた場合には、適用を受けることができない。"},
{q:"確定申告をしたあと、税金を多く払いすぎていたことに気づいたときは、原則として法定申告期限から5年以内に「更正の請求」をして、取りもどすことができる。",a:true,
 exp:`<p>申告をまちがえたときの手続きは2つです。</p><p>・税金が<b>少なすぎた</b> → <b>修正申告</b>（自分で直す。加算税などがかかることも）<br>・税金が<b>多すぎた</b> → <mark>更正の請求</mark>（税務署に直してもらうよう頼む）</p><p>更正の請求は、<mark>法定申告期限から5年以内</mark>にできます。</p>`,
 pt:"払いすぎ → 更正の請求（5年以内）／少なすぎ → 修正申告",
 hon:"確定申告書を提出した者は、税額が過大であったことが判明した場合、原則として、法定申告期限から5年以内に限り、更正の請求をすることができる。"},
{q:"亡くなった人の所得税の申告（準確定申告）は、相続人が、相続の開始を知った日の翌日から10か月以内に行う。",a:false,ha:true,ng:"準確定申告は<b>4か月以内</b>です。10か月は相続税の申告期限です。",
 exp:`<p>亡くなった人にも、1月1日から亡くなった日までの所得があれば、所得税がかかります。</p><p>その申告を、<b>相続人が代わりに</b>行います。これが<mark>準確定申告</mark>です。</p><p>期限は<mark>知った日の翌日から4か月以内</mark>。</p><p>亡くなった人が払った医療費は、亡くなった人の準確定申告で医療費控除にできます（亡くなった後に相続人が払った分は、相続税の債務控除になります）。</p>`,
 pt:"準確定申告は相続開始を知った日の翌日から4か月以内",
 hon:"年の中途で死亡した者の所得税については、その相続人が、相続の開始があったことを知った日の翌日から4か月以内に準確定申告をしなければならない。"},
{q:"法人税の確定申告は、原則として、事業年度が終わった日の翌日から2か月以内に行う。",a:true,
 exp:`<p>会社（法人）にかかる税金が<b>法人税</b>です。</p><p>・計算の期間：会社が<b>定款（ていかん：会社のルールブック）で決めた事業年度</b>（1年以内）<br>・申告：<mark>事業年度が終わった日の翌日から2か月以内</mark><br>・申告先：会社の<b>本店がある場所</b>の税務署</p><p>新しく会社を作ったときは、<b>設立から2か月以内</b>に「法人設立届出書」を出します。</p>`,
 pt:"法人税の申告：事業年度終了の翌日から2か月以内",
 hon:"法人税の確定申告書は、原則として、各事業年度終了の日の翌日から2か月以内に、納税地の所轄税務署長に提出しなければならない。"},
{q:"資本金1億円以下の中小法人は、法人税の所得のうち年800万円以下の部分について、軽い税率（軽減税率）が使える。",a:true,
 exp:`<p>法人税の税率は、本来<b>23.2%</b>です。</p><p>でも、<b>資本金1億円以下の中小法人</b>は、<mark>所得のうち年800万円以下の部分</mark>について、<b>軽減税率（本来は19%、特例で15%）</b>が使えます。</p><p>800万円をこえる部分は、23.2%です。</p><p>※特例の税率は、期間を区切って延長されてきた措置です。</p>`,
 pt:"中小法人の法人税：年800万円以下の部分は軽減税率（特例15%）、超える部分は23.2%",
 hon:"期末資本金の額が1億円以下の普通法人の所得の金額のうち、年800万円以下の部分については、軽減税率が適用される。"},
{q:"資本金1億円以下の中小法人は、交際費等のうち、年1,000万円までを全額損金にできる。",a:false,ha:true,ng:"中小法人の交際費の定額控除限度額は年<b>800万円</b>です。",
 exp:`<p>会社の<b>交際費</b>（取引先の接待や贈答など）は、原則として経費（損金）にできませんが、中小法人には特例があります。</p><p>・<mark>年800万円まで全額損金</mark>（定額控除限度額）<br>・<mark>接待飲食費の50%</mark>を損金<br>→ どちらか<b>有利なほうを選べる</b></p><p>大きな会社（資本金100億円超）は、交際費を損金にできません。</p><p>また、<b>1人あたり1万円以下</b>（2024年4月から。それまでは5,000円以下）の飲食費は、一定の書類を残せば、そもそも交際費に入れずに全額損金にできます。</p>`,
 pt:"中小法人の交際費：年800万円まで全額損金か、接待飲食費の50%を選択／1人1万円以下の飲食費は交際費から除外",
 hon:"期末資本金の額が1億円以下の法人は、支出した交際費等のうち、年800万円以下の金額を損金算入するか、接待飲食費の額の50%を損金算入するかを選択できる。"},
{q:"役員に払う給与は、毎月同じ額を払う「定期同額給与」であれば、原則として損金にできる。",a:true,
 exp:`<p>会社の役員は、自分の給料を自分で決められます。もうかった月だけ給料を増やして税金を減らす…といったことをふせぐため、<b>損金にできる役員給与</b>が決められています。</p><p>・<mark>定期同額給与</mark>：毎月同じ額<br>・<b>事前確定届出給与</b>：前もって税務署に届け出た金額・時期どおりに払う給与（役員賞与など）<br>・<b>業績連動給与</b>：一定の条件を満たすもの</p><p>これ以外の役員給与や、<b>不相当に高額な部分</b>は損金にできません。</p>`,
 pt:"損金にできる役員給与：定期同額・事前確定届出・業績連動",
 hon:"法人が役員に対して支給する定期同額給与は、不相当に高額な部分を除き、損金の額に算入することができる。"},
{q:"会社が、社長である役員に、会社の土地を時価より安く売った場合、時価との差額は、その役員への給与（役員給与）とされる。",a:true,
 exp:`<p>会社と役員の間の取引は、<b>時価（ふつうの値段）</b>で行われているかがチェックされます。</p><p>会社が役員に<b>安く売る</b>と、その差額は役員がトクをしたことになるので、<mark>役員給与（役員賞与）</mark>として扱われます。</p><p>役員にとっては<b>給与所得</b>として所得税がかかり、会社にとっては、定期同額給与などにあたらないので<b>損金にできない</b>のがふつうです。</p><p>反対に、役員が会社に<b>時価の2分の1未満</b>で売ると、役員は<b>時価で売ったもの</b>とみなされます。</p>`,
 pt:"法人 → 役員へ低額譲渡：差額は役員給与／役員 → 法人へ時価の1/2未満：時価で譲渡したとみなす",
 hon:"法人がその役員に対して資産を時価よりも低い価額で譲渡した場合、時価と譲渡価額との差額は、その役員に対する給与とされる。"},
{q:"消費税で、基準期間（個人は前々年、法人は前々事業年度）の課税売上高が1,000万円以下の事業者は、原則として消費税を納める義務がない（免税事業者）。",a:true,
 exp:`<p>消費税は、お店などの事業者が、お客さんから預かった消費税を国に納めるしくみです。</p><p>小さな事業者の手間を減らすため、<mark>基準期間（2年前）の課税売上高が1,000万円以下</mark>なら、原則として納めなくてよい<b>免税事業者</b>になります。</p><p>ただし、基準期間が1,000万円以下でも、<b>特定期間</b>（前年の1月〜6月）の課税売上高と給与の支払額がどちらも1,000万円をこえると、課税事業者になります。</p><p>また、2023年10月からのインボイス制度で、<b>インボイス（適格請求書）発行事業者</b>になると、売上が1,000万円以下でも消費税を納めます。</p>`,
 pt:"消費税：基準期間（2年前）の課税売上高1,000万円以下は免税事業者（インボイス発行事業者は除く）",
 hon:"消費税において、基準期間における課税売上高が1,000万円以下の事業者は、原則として、消費税の納税義務が免除される。"},
{q:"消費税の「簡易課税制度」は、基準期間の課税売上高が1億円以下の事業者なら選ぶことができる。",a:false,ha:true,ng:"簡易課税は、基準期間の課税売上高<b>5,000万円以下</b>の事業者が選べます。",
 exp:`<p>消費税の納める額は、ふつうは「お客さんから預かった消費税 − 仕入れのときに払った消費税」で計算します（<b>原則課税</b>）。</p><p>でも、仕入れの消費税を一つひとつ計算するのは大変。そこで<mark>簡易課税制度</mark>では、業種ごとの<b>みなし仕入率</b>（卸売業90%、小売業80%など）を使って、かんたんに計算できます。</p><p>・使える事業者：<mark>基準期間の課税売上高5,000万円以下</mark><br>・届け出：原則、<b>使いたい年（事業年度）が始まる前</b>までに「簡易課税制度選択届出書」を出す<br>・一度選ぶと、<b>2年間</b>はやめられない</p>`,
 pt:"簡易課税：基準期間の課税売上高5,000万円以下・事前に届出・2年間継続",
 hon:"簡易課税制度は、基準期間における課税売上高が5,000万円以下の事業者が、原則として、その課税期間の開始の日の前日までに簡易課税制度選択届出書を提出した場合に適用される。"},
{q:"土地の売却だけでなく、事務所や店舗の貸し付けにも、消費税はかからない（非課税取引）。",a:false,ha:true,ng:"土地の売却は非課税ですが、<b>事務所・店舗の貸し付けは課税</b>です（非課税なのは住宅の貸し付け）。",
 exp:`<p>消費税は、ほとんどのモノやサービスにかかりますが、<b>かからない（非課税）</b>取引もあります。</p><p>代表例：<br>・<mark>土地の売却・貸し付け</mark>（1か月未満の貸し付けや駐車場などの施設の貸し付けは課税）<br>・<mark>住宅の貸し付け</mark>（1か月以上）<br>・預金の利息、保険料<br>・健康保険の医療、介護サービス、学校の授業料 など</p><p>一方、<b>建物の売却</b>、<b>事務所や店舗の貸し付け</b>には消費税がかかります。</p>`,
 pt:"消費税の非課税：土地の譲渡・貸付、住宅の貸付（1か月以上）、利息、保険料など／建物の売却・事務所の賃料は課税",
 hon:"土地の譲渡および貸付け（一時的に使用させる場合等を除く）は、消費税の非課税取引である。"},
{q:"法人住民税の「均等割（きんとうわり）」は、会社が赤字で法人税がかからない年でも、納めなければならない。",a:true,
 exp:`<p>会社にかかる住民税（<b>法人住民税</b>）は、2つの部分でできています。</p><p>・<b>法人税割</b>：法人税の額に応じてかかる（赤字なら0円）<br>・<mark>均等割</mark>：会社の規模（資本金や従業員数）に応じて<b>決まった額</b>がかかる</p><p>均等割は、地域のサービスを受けていることへの負担なので、<mark>赤字でもかかります</mark>。</p>`,
 pt:"法人住民税の均等割は赤字でもかかる",
 hon:"法人住民税の均等割は、法人の所得の有無にかかわらず課される。"},
{q:"寄附金控除の額は、「その年に支出した特定寄附金の合計 − 5,000円」である。",a:false,ha:true,ng:"差し引くのは<b>2,000円</b>です（寄附金の合計は総所得金額等の40%が上限）。",
 exp:`<p>国や地方公共団体（ふるさと納税）、認定NPO法人などへの寄附は、<b>寄附金控除</b>（所得控除）の対象になります。</p><p>計算：<mark>寄附金の合計 − 2,000円</mark><br>ただし、寄附金の合計は<b>総所得金額等の40%</b>が上限です。</p><p>ふるさと納税では、住民税からも差し引かれるので、上限額の範囲内なら、<b>実質2,000円の負担</b>で寄附できるしくみになっています。</p><p>なお、政党などへの寄附は、所得控除の代わりに<b>税額控除</b>を選ぶこともできます。</p>`,
 pt:"寄附金控除＝寄附金の合計（総所得金額等の40%が上限）−2,000円",
 hon:"寄附金控除の額は、特定寄附金の額の合計額（総所得金額等の40%相当額が限度）から2,000円を控除した金額である。"},
{q:"青色申告をしている個人事業主が、事業を手伝う家族に払う給与を必要経費にするには、前もって「青色事業専従者給与に関する届出書」を出しておく必要がある。",a:true,
 exp:`<p>家族に払う給料は、ふつうは必要経費になりません（お財布が同じなので）。</p><p>でも、<b>青色申告</b>をしている人なら、<mark>届出書を出して、その金額の範囲内</mark>で、適正な額を必要経費にできます（<b>青色事業専従者給与</b>）。</p><p>条件：<br>・<b>生計を一にする15歳以上</b>の家族<br>・その年に<b>6か月をこえて</b>、事業に<b>専ら</b>（主として）従事している</p><p>白色申告の場合は、<b>事業専従者控除</b>（配偶者86万円、それ以外50万円が上限）になります。</p><p>なお、専従者になった家族は、配偶者控除・扶養控除の対象にはなりません。</p>`,
 pt:"青色事業専従者給与：届出の範囲内で全額経費に。専従者は配偶者控除・扶養控除の対象外",
 hon:"青色事業専従者給与の必要経費算入の適用を受けるためには、原則として、その年の3月15日までに青色事業専従者給与に関する届出書を提出しなければならない。"}
].map(o=>Object.assign({g:2,c:"tax"},o)));

 pt:"退職・山林は分離課税（山林は5分5乗）。公的年金は公的年金等控除"}

{q:"相続で不動産を取得した相続人は、2024年4月から、取得を知った日から1年以内に相続登記を申請することが義務になった。",a:false,ha:true,ng:"相続登記は、知った日から<b>3年以内</b>です。",fig:"toki",
 exp:`<p>持ち主がわからない土地（所有者不明土地）が増えて問題になったため、<b>相続登記の義務化</b>が始まりました。</p><p>・相続で不動産をもらったことを<mark>知った日から3年以内</mark>に登記を申請する<br>・正当な理由なく申請しないと、<b>10万円以下の過料</b><br>・2024年4月より<b>前</b>の相続も対象（2027年3月末までに申請）</p><p>また、建物を新しく建てたときの<b>表題登記</b>（どんな建物かの登記）も、<b>1か月以内</b>に申請する義務があります。</p>`,
 pt:"相続登記の義務化：知った日から3年以内（2024年4月〜）。建物の表題登記は1か月以内",
 hon:"相続により不動産の所有権を取得した相続人は、自己のために相続の開始があったことを知り、かつ、その所有権を取得したことを知った日から3年以内に、所有権の移転の登記を申請しなければならない。"},
{q:"仮登記（かりとうき）をしておけば、本登記と同じように、第三者に対抗することができる。",a:false,ha:true,ng:"仮登記には<b>対抗力はありません</b>。あるのは、本登記の順位を守る力（順位保全効）です。",fig:"toki",
 exp:`<p>書類がそろわないなどで本当の登記（本登記）ができないとき、<b>とりあえず順番だけとっておく</b>のが仮登記です。</p><p>・<mark>対抗力はない</mark>（仮登記のままでは、「自分の物だ」と主張できない）<br>・<mark>順位保全の効力がある</mark>（あとで本登記すれば、仮登記をした時の順位になる）</p><p>病院の整理券のようなもの、とイメージしましょう。</p>`,
 pt:"仮登記：対抗力なし・順位保全効あり",
 hon:"仮登記に基づいて本登記をした場合、その本登記の順位は仮登記の順位による。"},
{q:"不動産の鑑定評価の方法のうち、「収益還元法」は、今その建物を建て直したらいくらかかるかをもとに価格を求める方法である。",a:false,ha:true,ng:"それは「<b>原価法</b>」。収益還元法は、将来生み出す<b>収益</b>をもとに価格を求めます。",
 exp:`<p>不動産鑑定士が値段を決める方法は、主に3つです。</p><p>・<b>原価法</b>：今<b>建て直したらいくらか</b>から、古くなった分を引く（積算価格）<br>・<b>取引事例比較法</b>：近くの<b>似た物件の取引価格</b>とくらべる（比準価格）<br>・<mark>収益還元法</mark>：<b>将来どれだけもうかるか</b>から計算する（収益価格）</p><p>収益還元法には、1年分の純収益を利回りで割る<b>直接還元法</b>と、将来の収益と売却価格を今の価値に割り引いて合計する<b>DCF法</b>があります。</p>`,
 pt:"原価法（再調達原価）／取引事例比較法（事例）／収益還元法（直接還元法・DCF法）",
 hon:"収益還元法は、対象不動産が将来生み出すであろうと期待される純収益の現在価値の総和を求めることにより、対象不動産の試算価格を求める手法である。"},
{q:"売主が宅建業者で、買主が宅建業者ではない土地の売買では、売主は代金の3割まで手付金を受け取ることができる。",a:false,ha:true,ng:"手付金は代金の<b>2割</b>までです。",
 exp:`<p>プロ（宅建業者）が売主で、買主がふつうの人の場合、買主を守るためのルールがあります。</p><p>・<mark>手付金は代金の2割まで</mark><br>・手付金は、何と書いてあっても<b>解約手付</b>とされる（買主に不利な特約は無効）<br>・損害賠償の予定額や違約金は、<b>合わせて代金の2割まで</b></p><p>買主も宅建業者（プロどうし）の取引には、これらの制限はありません。</p>`,
 pt:"宅建業者が売主（買主は一般人）：手付金は代金の2割まで・必ず解約手付",
 hon:"宅地建物取引業者が自ら売主となる宅地または建物の売買契約において、宅地建物取引業者でない買主から、代金の額の10分の2を超える額の手付を受領することはできない。"},
{q:"買った建物に、契約の内容に合わない欠陥（雨もりなど）があった場合、買主がそれを知った時から1年以内に売主へ通知しないと、原則として売主の責任を追及できなくなる。",a:true,
 exp:`<p>買った物が、約束（契約）の内容と合わない場合、売主は<b>契約不適合責任</b>を負います。</p><p>買主ができること：<br>・<b>直して</b>もらう（追完請求）<br>・<b>代金を減らして</b>もらう（代金減額請求）<br>・<b>損害賠償</b>の請求<br>・<b>契約の解除</b></p><p>ただし、種類や品質が合わない場合、買主は<mark>知った時から1年以内に売主へ通知</mark>する必要があります（売主が知っていた場合などを除く）。</p>`,
 pt:"契約不適合責任：品質等の不適合は、知った時から1年以内に通知が必要",
 hon:"売主が種類または品質に関して契約の内容に適合しない目的物を買主に引き渡した場合、買主がその不適合を知った時から1年以内にその旨を売主に通知しないときは、買主は、原則として、契約不適合を理由とする請求等をすることができない。"},
{q:"建物の売買契約をしたあと、引き渡し前に、売主・買主どちらのせいでもない地震でその建物がこわれた場合、買主は代金の支払いを拒むことができる。",a:true,
 exp:`<p>契約後・引き渡し前に、<b>だれのせいでもない理由</b>（地震や隣からのもらい火など）で建物がなくなった場合、損を誰がかぶるかを<b>危険負担</b>といいます。</p><p>今の民法では、<mark>買主は代金の支払いを拒める</mark>（さらに契約の解除もできる）とされています。</p><p>つまり、建物を受け取れないのに代金だけ払う、ということにはなりません。</p>`,
 pt:"危険負担：引渡し前に双方の責任なく滅失 → 買主は代金の支払いを拒める",
 hon:"建物の売買契約締結後、引渡し前に、当事者双方の責めに帰することができない事由によって建物が滅失した場合、買主は代金の支払いを拒むことができる。"},
{q:"定期借家契約を結ぶとき、大家さんは、前もって借りる人に「更新がなく、期間満了で終わること」を書面を渡して説明しなければならない。",a:true,
 exp:`<p>定期借家契約は、<b>期間が来たら更新なしで終わる</b>借家契約です。借りる人にとって大事なことなので、ルールがきびしくなっています。</p><p>・契約は<b>書面（電磁的記録も可）</b>で<br>・契約の前に、<mark>「更新がなく期間満了で終わる」ことを書いた書面を渡して説明</mark>する（説明がないと普通借家になる）<br>・期間が1年以上なら、終わる<b>1年前〜6か月前</b>に、終わることを通知する</p><p>また、<b>床面積200㎡未満の住まい</b>で、転勤・療養などやむを得ない事情があれば、借りる人から<b>途中解約</b>できます。</p>`,
 pt:"定期借家：書面で契約＋事前に書面で説明（ないと普通借家）。200㎡未満の居住用は中途解約可",
 hon:"定期建物賃貸借をしようとするときは、建物の賃貸人は、あらかじめ、建物の賃借人に対し、契約の更新がなく期間の満了により終了することについて、その旨を記載した書面を交付（または電磁的方法により提供）して説明しなければならない。"},
{q:"普通借家契約で、「一定の期間、家賃を減額しない」という特約は有効である。",a:false,ha:true,ng:"普通借家では、「減額しない」特約は借りる人に不利なので<b>無効</b>。「増額しない」特約なら有効です。",
 exp:`<p>普通借家契約では、家賃が周りとくらべて高すぎたり安すぎたりすると、大家さんも借りる人も、<b>家賃の増額・減額を請求</b>できます。</p><p>特約（とくべつな約束）の扱いは：<br>・<mark>「増額しない」特約 → 有効</mark>（借りる人に有利なので）<br>・<b>「減額しない」特約 → 無効</b>（借りる人に不利なので）</p><p>ただし、<b>定期借家契約</b>では、家賃の改定についての特約があれば、「減額しない」特約も有効です。</p>`,
 pt:"普通借家：増額しない特約は有効・減額しない特約は無効（定期借家は特約に従う）",
 hon:"普通建物賃貸借契約において、一定期間建物の賃料を増額しない旨の特約がある場合は、その定めに従う。"},
{q:"市街化調整区域内で、1,000㎡未満の開発行為をする場合は、都道府県知事の許可はいらない。",a:false,ha:true,ng:"市街化調整区域は、<b>規模にかかわらず</b>原則として許可が必要です（農林漁業用の建物などを除く）。",
 exp:`<p>土地を宅地にするために<b>造成</b>（区画や形を変える）することを<b>開発行為</b>といいます。一定の規模以上なら、<b>都道府県知事等の許可</b>が必要です。</p><p>・<mark>市街化区域：1,000㎡以上</mark><br>・<b>市街化調整区域：規模にかかわらず許可が必要</b>（農林漁業用の建物などを除く）<br>・非線引き区域・準都市計画区域：3,000㎡以上</p>`,
 pt:"開発許可：市街化区域1,000㎡以上／市街化調整区域は規模にかかわらず",
 hon:"市街化区域内において行う開発行為で、その規模が1,000㎡以上であるものは、原則として都道府県知事等の許可を受けなければならない。"},
{q:"工業専用地域では、住宅を建てることができない。",a:true,
 exp:`<p>用途地域は、その場所に<b>どんな種類の建物を建ててよいか</b>を決めたものです（13種類）。</p><p><mark>工業専用地域</mark>は、工場のための地域なので、<mark>住宅は建てられません</mark>。</p><p>ほかにもよく出るもの：<br>・<b>診療所・神社・寺・教会・保育所・巡査派出所</b>：<b>すべての用途地域</b>で建てられる<br>・<b>病院</b>：第一種・第二種低層住居専用地域、田園住居地域、工業地域、工業専用地域では建てられない<br>・<b>大学</b>：低層住居専用地域、工業地域、工業専用地域では建てられない</p>`,
 pt:"工業専用地域には住宅は建てられない。診療所・保育所・神社などは全用途地域OK",
 hon:"工業専用地域内においては、住宅を建築することができない。"},
{q:"前面道路の幅が12m未満の場合、住居系の用途地域では、容積率は「前面道路の幅（m）× 10分の4」と「指定容積率」のうち小さいほうになる。",a:true,fig:"youseki",
 exp:`<p>容積率（延べ面積の上限）は、都市計画で決められた<b>指定容積率</b>のほかに、<b>前面道路の幅</b>でも制限されます。せまい道路に大きな建物がたくさん建つと困るからです。</p><p>前面道路の幅が<mark>12m未満</mark>のとき：<br>・<b>住居系</b>の用途地域：道路の幅 × <mark>4/10</mark><br>・<b>それ以外</b>（商業系・工業系）：道路の幅 × <b>6/10</b><br>→ これと指定容積率の<b>小さいほう</b>が上限</p><p>例：住居系、道路幅6m、指定容積率300% → 6×4/10＝240%。小さいほうの<b>240%</b>が上限です。</p><p>前面道路が2つ以上あるときは、<b>広いほう</b>の道路の幅を使います。</p>`,
 pt:"前面道路12m未満：住居系は幅×4/10、その他は幅×6/10と指定容積率の小さいほう",
 hon:"前面道路の幅員が12m未満である場合、住居系用途地域における容積率は、前面道路の幅員に10分の4を乗じたものと指定容積率のいずれか低いほうとなる。"},
{q:"建物の敷地が2つの用途地域にまたがる場合、建蔽率は、敷地の過半がある用途地域の建蔽率が敷地全体に適用される。",a:false,ha:true,ng:"建蔽率・容積率は、それぞれの面積の割合で<b>加重平均</b>します。過半の地域のルールを使うのは<b>用途制限</b>です。",fig:"youseki",
 exp:`<p>敷地が2つの地域にまたがるときのルールは、項目によってちがいます。</p><p>・<mark>用途制限</mark>（何を建てていいか）：敷地の<mark>過半</mark>がある地域のルールを敷地全体に使う<br>・<b>建蔽率・容積率</b>：それぞれの地域の面積の割合で<b>加重平均</b>する<br>・<b>防火地域・準防火地域</b>：建物が防火地域にかかれば、原則として<b>厳しいほう</b>（防火地域）のルール</p>`,
 pt:"2つの用途地域にまたがる：用途制限＝過半の地域／建蔽率・容積率＝加重平均／防火＝厳しいほう",
 hon:"建築物の敷地が異なる2つの用途地域にわたる場合、その敷地の全部について、敷地の過半の属する用途地域の建築物の用途に関する規定が適用される。"},
{q:"第一種・第二種低層住居専用地域と田園住居地域では、建物の高さは原則として10mまたは12mのうち、都市計画で決めた高さまでに制限される。",a:true,
 exp:`<p>低い家が建ちならぶ静かな住宅地を守るため、<b>低層住居専用地域</b>（第一種・第二種）と<b>田園住居地域</b>には、<mark>絶対高さ制限</mark>があります。</p><p>高さは<mark>10mまたは12m</mark>のうち、都市計画で決めた数字までです。</p><p>そのほか、日当たりを守るための<b>日影規制</b>や、道路の明るさを守る<b>道路斜線制限</b>などもあります。</p>`,
 pt:"低層住居専用地域・田園住居地域：絶対高さ制限10mまたは12m",
 hon:"第一種低層住居専用地域、第二種低層住居専用地域および田園住居地域内においては、建築物の高さは、原則として10mまたは12mのうち都市計画で定められた限度を超えてはならない。"},
{q:"市街化区域内の農地を、宅地にするために売る場合（転用目的の権利移動）は、あらかじめ農業委員会に届け出れば、都道府県知事の許可はいらない。",a:true,
 exp:`<p>農地を守るための法律が<b>農地法</b>です。</p><p>・<b>3条</b>：農地を<b>農地のまま</b>売る・貸す → <b>農業委員会</b>の許可<br>・<b>4条</b>：自分の農地を<b>宅地などに変える（転用）</b> → <b>都道府県知事等</b>の許可<br>・<b>5条</b>：<b>転用するために</b>売る・貸す → <b>都道府県知事等</b>の許可</p><p>ただし、<mark>市街化区域内</mark>の農地なら、4条・5条は<mark>農業委員会への届出だけ</mark>でOK（もともと街にする区域だから）。</p>`,
 pt:"農地法：3条＝農業委員会の許可／4条・5条＝知事の許可（市街化区域内は農業委員会への届出でOK）",
 hon:"市街化区域内にある農地を転用する目的で権利を移転する場合、あらかじめ農業委員会に届け出れば、農地法第5条の許可を受ける必要はない。"},
{q:"不動産の売買契約書に印紙を貼らなかった場合、その契約は無効になる。",a:false,
 exp:`<p>契約書などには、<b>印紙税</b>として収入印紙を貼ります。</p><p>でも、印紙を貼らなくても<mark>契約そのものは有効</mark>です。契約は、当事者の合意で成立するからです。</p><p>ただし、貼らなかった場合は、ペナルティとして<b>過怠税（かたいぜい）</b>がかかります（原則、本来の印紙税の3倍）。</p><p>また、契約書を<b>電子データ</b>で作った場合は、印紙税はかかりません。</p>`,
 pt:"印紙を貼らなくても契約は有効（過怠税がかかる）。電子契約は印紙税なし",
 hon:"印紙税の課税文書に印紙を貼付しなかった場合でも、その契約の効力には影響がない。"},
{q:"新築住宅の固定資産税は、一定の条件を満たすと、新築後3年間（一般の住宅の場合）、床面積120㎡までの部分の税額が2分の1になる。",a:true,fig:"fudoTax",

{q:"マイホームを売った年の1月1日時点で5年をこえて持っていれば、6,000万円以下の部分に14.21%の軽減税率が使える。",a:false,ha:true,ng:"軽減税率は、所有期間<b>10年超</b>が条件です。",fig:"jotoFudo",
 exp:`<p>長く住んだマイホームを売ったときは、さらに税率が下がる特例があります（<b>軽減税率の特例</b>）。</p><p>条件：売った年の1月1日時点で<mark>所有期間10年超</mark></p><p>税率：<br>・<mark>6,000万円以下の部分：14.21%</mark>（所得税10.21%・住民税4%）<br>・6,000万円をこえる部分：20.315%（ふつうの長期の税率）</p><p>この特例は、<b>3,000万円特別控除と一緒に使えます</b>（控除のあとの金額にかける）。</p>`,
 pt:"居住用財産の軽減税率：所有10年超・6,000万円以下の部分14.21%（3,000万円控除と併用可）",

{q:"「特定居住用財産の買換え特例」を使うには、売る家の売却代金が1億円以下で、売った年の1月1日時点で10年をこえて持ち、住んでいた期間も10年以上あることなどが必要である。",a:true,fig:"jotoFudo",
 exp:`<p>マイホームを売って新しい家に買い換えるとき、<b>もうけに税金をかけるのを先送り（繰延べ）</b>できるのが<b>買換え特例</b>です。</p><p>主な条件：<br>・売った家の代金が<mark>1億円以下</mark><br>・売った年の1月1日時点で<mark>所有期間10年超</mark>、かつ<mark>居住期間10年以上</mark><br>・買う家の<b>床面積50㎡以上</b>、土地は<b>500㎡以下</b></p><p>この特例は、<b>3,000万円特別控除や軽減税率の特例とは一緒に使えません</b>（どちらかを選ぶ）。</p>`,

 hon:"特定の居住用財産の買換えの場合の長期譲渡所得の課税の特例の適用を受けるためには、譲渡資産の譲渡対価の額が1億円以下であることが要件の一つである。"},
{q:"親から相続した空き家の3,000万円特別控除は、マンションなどの区分所有建物でも使える。",a:false,ha:true,ng:"空き家特例は、1981年5月31日以前に建てられた家で、<b>マンションなどの区分所有建物は対象外</b>です。",
 exp:`<p>空き家が増えるのをふせぐための特例が<b>相続した空き家の3,000万円特別控除</b>（空き家特例）です。</p><p>主な条件：<br>・<mark>1981年5月31日以前に建てられた</mark>家（マンションなどは除く）<br>・亡くなる直前まで、親が<b>1人で住んでいた</b><br>・耐震リフォームをする、または家を取りこわして<b>更地で売る</b>（売った翌年2月15日までに買主が行ってもOK）<br>・売却代金が<b>1億円以下</b><br>・相続から<b>3年後の12月31日まで</b>に売る</p><p>家を相続した人が<b>3人以上</b>のときは、1人あたり<b>2,000万円</b>になります（2024年から）。</p>`,
 pt:"空き家特例：1981年5月31日以前の家・売却1億円以下・最高3,000万円（相続人3人以上は2,000万円）",
 hon:"被相続人の居住用財産（空き家）に係る譲渡所得の特別控除の特例は、1981年5月31日以前に建築された家屋であることなどが要件であり、相続人が3人以上の場合の控除額は1人当たり2,000万円となる。"},
{q:"土地や建物を同じ種類の資産と交換した場合、一定の条件を満たせば、譲渡がなかったものとして税金がかからない特例がある。この場合、交換する物の価値の差は、高いほうの価値の20%以内でなければならない。",a:true,
 exp:`<p><b>固定資産の交換の特例</b>：土地と土地、建物と建物など、<b>同じ種類</b>の物を交換すると、売ったことにならず、税金がかからない（課税の繰延べ）特例です。</p><p>主な条件：<br>・<b>同じ種類</b>の資産どうし（土地と建物の交換はダメ）<br>・どちらも<b>1年以上</b>持っていた<br>・交換前と同じ<b>使い道</b>で使う<br>・価値の差が<mark>高いほうの20%以内</mark></p><p>差額をお金（交換差金）で受け取った場合、その分には税金がかかります。</p>`,
 pt:"固定資産の交換特例：同種資産・1年以上所有・同一用途・差額は高いほうの20%以内",
 hon:"固定資産の交換の特例の適用を受けるためには、交換譲渡資産の時価と交換取得資産の時価との差額が、いずれか高いほうの価額の20%以内であることが必要である。"},
{q:"土地の有効活用の方法のうち「等価交換方式」は、土地の持ち主が土地を出し、デベロッパー（開発業者）が建設費を出して建物を建て、それぞれが出した割合に応じて土地と建物を持ち合う方法である。",a:true,
 exp:`<p>土地を持っていても、建物を建てるお金がない…というとき、いろいろな活用方法があります。</p><p>・<mark>等価交換方式</mark>：持ち主は土地、業者は建設費を出し、出した割合で土地・建物を分け合う。<b>持ち主は自分でお金を出さずに済む</b><br>・<b>事業受託方式</b>：業者に企画から管理まで任せる。建設費は持ち主が出す<br>・<b>定期借地権方式</b>：土地を定期借地で貸して<b>地代</b>を受け取る。期間が終われば土地が返ってくる<br>・<b>建設協力金方式</b>：お店を出したい会社（テナント）から建設費を借りて建物を建て、貸す</p>`,
 pt:"等価交換方式：土地と建設資金を出し合い、出資割合で土地・建物を共有（持ち主の資金負担なし）",
 hon:"等価交換方式では、土地所有者は土地を拠出し、デベロッパーが建設資金を負担してマンション等を建設し、それぞれの出資割合に応じて土地・建物に係る権利を取得する。"},
{q:"年間の家賃収入が1,000万円、年間の経費（管理費・税金など）が300万円、購入価格が1億円の物件のNOI利回り（純利回り）は10%である。",a:false,ha:true,ng:"NOI利回りは経費を引いて（1,000万−300万）÷1億＝<b>7%</b>。10%は表面利回りです。",
 exp:`<p>不動産投資の利回りを計算してみましょう。</p><p>・<b>表面利回り</b> ＝ 1,000万 ÷ 1億 × 100 ＝ <b>10%</b><br>・<mark>NOI利回り</mark> ＝（1,000万 − 300万）÷ 1億 × 100 ＝ <mark>7%</mark></p><p>NOIは「純収益」のこと。経費を引いた分だけで考えるので、実際に近い数字がわかります。</p><p>また、借入金を使って投資する場合、物件の利回りが借入金の金利より<b>高い</b>と、自分のお金の利回りが上がります（<b>レバレッジ効果</b>）。</p>`,
 pt:"NOI利回り＝（年間収入−諸経費）÷投資額×100",
 hon:"年間賃料収入1,000万円、年間費用300万円、投資額1億円の賃貸物件のNOI利回りは7%である。"},
{q:"新築住宅を取得した場合、不動産取得税の計算では、床面積が50㎡以上240㎡以下などの条件を満たせば、課税標準から1,200万円を差し引ける。",a:true,fig:"fudoTax",

{q:"10年を超えて所有・居住したマイホームを譲渡し、譲渡所得の金額（特別控除前）が4,000万円となった。3,000万円特別控除と軽減税率の特例を適用した場合の税額（所得税・復興特別所得税・住民税の合計）として正しいものはどれか。",calc:true,

{q:"不動産の税金に関する次の記述のうち、最も適切なものはどれか。",

 pt:"新築住宅の固定資産税：3年間（中高層耐火5年）120㎡まで1/2",fig:"fudoTax"},
{q:"土地の有効活用に関する次の記述のうち、最も適切なものはどれか。",
 ch:["等価交換方式では、土地所有者が建設資金の全額を負担する。","事業受託方式では、事業の企画から建物の管理・運営までをデベロッパーに任せるが、建設資金は土地所有者が負担する。","定期借地権方式では、土地所有者が建物を建設して賃貸する。","建設協力金方式では、建物の所有者は建設協力金を出したテナントとなる。"],a:1,
 why:["等価交換は土地を出し、建設資金はデベロッパーが負担。","正しい。","定期借地権方式は土地を貸して地代を受け取る。建物は借地人が建てる。","建設協力金方式の建物の所有者は<b>土地所有者</b>。"],

 pt:"レバレッジ効果：物件の利回り＞借入金利なら自己資金の利回りが上がる"}

{q:"「負担付贈与」とは、もらう人に一定の義務（例：借金の一部を肩代わりする）を負わせる贈与で、あげる人は、その負担の限度で売主と同じような責任を負う。",a:true,
 exp:`<p>贈与にはいくつか種類があります。</p><p>・<mark>負担付贈与</mark>：「家をあげるかわりに、残りのローンを払ってね」のように、<b>もらう人に義務</b>がつく贈与。あげる人は、負担の限度で<b>売主と同じような責任</b>（契約不適合責任など）を負う<br>・<b>定期贈与</b>：「毎年100万円ずつあげる」のように<b>定期的に</b>あげる贈与。どちらかが亡くなると終わる<br>・<b>死因贈与</b>：「私が死んだらあげる」という贈与。<b>相続税</b>の対象になる</p><p>負担付贈与で土地や建物をもらった場合は、相続税評価額ではなく<b>通常の取引価額（時価）</b>から負担額を引いた額に贈与税がかかります。</p>`,
 pt:"負担付贈与：贈与者は負担の限度で売主と同様の責任。死因贈与は相続税の対象",
 hon:"負担付贈与では、贈与者は、その負担の限度において、売主と同じく担保の責任を負う。"},
{q:"贈与税の計算で、20歳以上の人が父母や祖父母（直系尊属）から財産をもらった場合にだけ、「特例税率」を使う。",a:false,ha:true,ng:"特例税率は<b>18歳以上</b>（その年の1月1日時点）です。",fig:"zoyo",
 exp:`<p>暦年課税の贈与税の税率には2種類あります。</p><p>・<mark>特例税率</mark>：<b>18歳以上</b>の人が<b>父母・祖父母など（直系尊属）</b>からもらった財産<br>・<b>一般税率</b>：それ以外（夫婦間、兄弟間、未成年の子への贈与など）</p><p>特例税率のほうが<b>税金が安く</b>なっています。若い世代への財産の移転を進めるためです。</p><p>年齢は<b>贈与を受けた年の1月1日</b>時点で判断します。</p>`,
 pt:"特例税率＝18歳以上が直系尊属から受けた贈与／一般税率＝それ以外",
 hon:"その年1月1日において18歳以上の者が直系尊属から贈与により取得した財産に係る贈与税額の計算には、特例税率が適用される。"},
{q:"2024年1月1日以後の贈与について、亡くなった人から相続などで財産をもらった人が、亡くなる前の一定期間にもらった贈与財産を相続財産に加える期間は、段階的に7年に延びている。",a:true,fig:"zoyo",
 exp:`<p>亡くなる直前の駆けこみ贈与で相続税を減らすのをふせぐため、<b>亡くなる前の一定期間の贈与</b>は、相続財産に足して相続税を計算します（<b>生前贈与加算</b>）。</p><p>この期間は、以前は<b>3年</b>でしたが、<mark>2024年1月1日以後の贈与から7年</mark>に延びました（2027年以後の相続から段階的に延び、2031年以後の相続で完全に7年）。</p><p>延びた4年間にもらった分は、合計<b>100万円</b>を差し引いてから加えます。</p><p>対象になるのは、相続や遺贈で<b>財産をもらった人</b>だけ。財産をもらわなかった孫などへの贈与は加算されません。</p>`,
 pt:"生前贈与加算：3年 → 7年（2024年以後の贈与から段階的に）。延長4年分は100万円控除",
 hon:"相続または遺贈により財産を取得した者が、相続開始前7年以内（経過措置あり）に被相続人から暦年課税による贈与により取得した財産の価額は、相続税の課税価格に加算される。"},
{q:"相続時精算課税制度で、毎年110万円の基礎控除の範囲内でもらった財産も、贈与した人が亡くなったら、すべて相続財産に加えなければならない。",a:false,ha:true,ng:"年110万円の基礎控除以下の部分は、相続財産に<b>加えなくてよい</b>です（2024年1月以後の贈与）。",fig:"zoyo",
 exp:`<p>相続時精算課税は、2024年から使いやすくなりました。</p><p>・<mark>毎年110万円の基礎控除</mark>ができた（暦年課税の110万円とは別枠）<br>・110万円以下なら<b>申告もいらない</b><br>・この110万円の部分は、亡くなったときに<b>相続財産に足さなくてよい</b>（7年以内でも）</p><p>そのうえで、110万円をこえた分は、累計<b>2,500万円</b>の特別控除から引いていきます。</p><p>ただし、一度選ぶと、<b>その人からの贈与は暦年課税にもどれない</b>のは今までどおりです。</p>`,
 pt:"相続時精算課税：年110万円の基礎控除（2024年〜）＋累計2,500万円。110万円部分は相続時に加算しない",
 hon:"相続時精算課税制度の適用を受けた贈与財産については、2024年1月1日以後、特別控除額とは別に年間110万円の基礎控除額が設けられ、基礎控除額以下の部分は相続税の課税価格に加算されない。"},
{q:"父母や祖父母から、家を建てたり買ったりするためのお金をもらった場合、省エネなどの基準を満たす住宅なら、最高1,000万円まで贈与税がかからない特例がある。",a:true,
 exp:`<p><b>住宅取得等資金の贈与税の非課税</b>は、若い世代のマイホームを応援する特例です。</p><p>・あげる人：<b>父母・祖父母など（直系尊属）</b><br>・もらう人：<b>18歳以上</b>で、合計所得金額<b>2,000万円以下</b><br>・非課税の上限：<mark>省エネ等住宅1,000万円</mark>、それ以外の住宅<b>500万円</b><br>・床面積：原則<b>50㎡以上240㎡以下</b></p><p>暦年課税の110万円や、相続時精算課税と<b>あわせて使えます</b>。非課税になっても<b>申告は必要</b>です。</p>`,
 pt:"住宅取得等資金の非課税：直系尊属から・省エネ等住宅1,000万円／その他500万円（申告必要）",
 hon:"直系尊属から住宅取得等資金の贈与を受けた場合の贈与税の非課税制度における非課税限度額は、省エネ等住宅の場合は1,000万円、それ以外の住宅の場合は500万円である。"},
{q:"養子は、法定相続人として、実の子と同じだけの相続分がある。",a:true,fig:"souzokunin",
 exp:`<p>民法では、<mark>養子も実子も同じ「子」</mark>なので、相続分も同じです。何人養子にしても、全員が相続人になります。</p><p>ただし、<b>相続税の計算</b>（基礎控除や生命保険の非課税などに使う「法定相続人の数」）では、数えられる養子の数に制限があります。</p><p>・<b>実子がいる</b>場合：養子は<b>1人まで</b><br>・<b>実子がいない</b>場合：養子は<b>2人まで</b></p><p>（配偶者の連れ子を養子にした場合などは、実子として数えます。）</p>`,
 pt:"民法上は養子も実子と同じ。相続税の法定相続人の数に入る養子は、実子ありなら1人・なしなら2人まで",
 hon:"相続税の計算において、法定相続人の数に含める養子の数は、被相続人に実子がいる場合は1人、実子がいない場合は2人までに制限される。"},
{q:"特別養子縁組で養子になった子は、実の親（実方の父母）との親族関係がなくなるため、実の親の相続人にはならない。",a:true,
 exp:`<p>養子縁組には2種類あります。</p><p>・<b>普通養子</b>：実の親との関係も<b>続く</b> → <b>実の親と養親の両方</b>の相続人になれる<br>・<mark>特別養子</mark>：原則<b>15歳未満</b>の子が対象。実の親との関係が<mark>なくなる</mark> → <b>養親だけ</b>の相続人</p>`,
 pt:"普通養子＝実親と養親の両方を相続／特別養子＝養親のみ（実親との関係は終了）",
 hon:"特別養子縁組が成立すると、養子と実方の父母との親族関係は終了するため、養子は実方の父母の相続人とならない。"},
{q:"半血兄弟姉妹（父母の一方だけが同じ兄弟姉妹）の法定相続分は、全血兄弟姉妹（父母の両方が同じ）と同じである。",a:false,ha:true,ng:"半血兄弟姉妹の相続分は、全血の<b>2分の1</b>です。",fig:"souzokubun",
 exp:`<p>兄弟姉妹が相続人になるとき、<b>父母の両方が同じか、片方だけ同じか</b>で相続分が変わります。</p><p>・<b>全血兄弟姉妹</b>（父も母も同じ）：1<br>・<mark>半血兄弟姉妹</mark>（父か母の片方だけ同じ）：<mark>全血の2分の1</mark></p><p>例：配偶者と、全血の兄と半血の弟が相続人のとき、兄弟姉妹全体の相続分1/4を「兄2：弟1」で分けます。兄は1/4×2/3＝1/6、弟は1/4×1/3＝<b>1/12</b>。</p><p>なお、子の場合は、<b>嫡出子（結婚している夫婦の子）でも非嫡出子でも相続分は同じ</b>です。</p>`,
 pt:"半血兄弟姉妹の相続分は全血の1/2（子は嫡出・非嫡出で差はない）",
 hon:"父母の一方のみを同じくする兄弟姉妹の相続分は、父母の双方を同じくする兄弟姉妹の相続分の2分の1である。"},
{q:"遺留分を侵害された相続人は、相続の開始などを知った時から5年以内であれば、遺留分侵害額請求ができる。",a:false,ha:true,ng:"知った時から<b>1年</b>（または相続開始から10年）で時効です。",
 exp:`<p>遺言などで遺留分（最低限の取り分）より少なくされた相続人は、多くもらった人に対して、<b>遺留分侵害額請求</b>ができます。</p><p>今の民法では、<mark>お金で</mark>請求します（昔のように「物を返して」ではない）。</p><p>期限：<br>・相続の開始と、侵害する贈与・遺贈があったことを<b>知った時から1年</b><br>・または、相続の開始から<b>10年</b></p><p>また、遺留分は、<b>家庭裁判所の許可</b>を受ければ、<b>相続が始まる前に放棄</b>することもできます（相続放棄は相続が始まる前にはできません）。</p>`,
 pt:"遺留分侵害額請求：金銭で請求・知った時から1年／相続開始から10年。遺留分の放棄は生前でも可（家裁の許可）",
 hon:"遺留分侵害額請求権は、遺留分権利者が、相続の開始および遺留分を侵害する贈与または遺贈があったことを知った時から1年間行使しないときは、時効によって消滅する。"},
{q:"「配偶者居住権」を相続した配偶者は、その権利をほかの人に売ることができる。",a:false,ha:true,ng:"配偶者居住権は<b>譲渡（売ること）ができません</b>。",
 exp:`<p>家の価値が大きいと、配偶者が家を相続すると、生活費になる預金などをあまりもらえないことがあります。</p><p>そこで、家を<b>「住む権利（配偶者居住権）」と「持ち主の権利（所有権）」に分けて</b>相続できるようになりました。</p><p>・配偶者は<mark>配偶者居住権</mark>を相続 → <b>原則亡くなるまで無償</b>で住める<br>・子などは<b>所有権</b>を相続</p><p>配偶者居住権は、<b>登記</b>することで第三者に対抗できます。また、<b>売ったり、ほかの人に譲ったりはできません</b>。</p><p>配偶者居住権は、配偶者が亡くなると消えるので、その時に<b>相続税はかかりません</b>。</p>`,
 pt:"配偶者居住権：原則終身・無償で住める。登記が必要・譲渡不可",
 hon:"配偶者居住権の存続期間は、原則として配偶者の終身の間であり、配偶者居住権は譲渡することができない。"},
{q:"遺言は、18歳（成年）にならなければ、つくることができない。",a:false,ha:true,ng:"遺言は<b>15歳以上</b>なら、親の同意なしでつくれます。",fig:"igon",
 exp:`<p>遺言は、その人の<b>最後の意思</b>なので、ふつうの契約より条件がゆるくなっています。</p><p>・<mark>15歳以上</mark>なら、<b>親（法定代理人）の同意なしで</b>作れる<br>・いつでも、<b>新しい遺言</b>で前の遺言を取り消せる（撤回）<br>・内容が食いちがう遺言が複数あるときは、<b>日付が新しいほう</b>が優先<br>・<b>2人以上が同じ紙で</b>する遺言（共同遺言）は無効</p>`,
 pt:"遺言は15歳以上・同意不要。新しい遺言が優先・いつでも撤回可・共同遺言は無効",
 hon:"15歳に達した者は、法定代理人の同意を得ることなく、遺言をすることができる。"},
{q:"相続時精算課税の適用を受けた贈与財産は、相続税の計算では、亡くなったときの価額で相続財産に加える。",a:false,ha:true,ng:"加えるのは「<b>贈与したときの価額</b>」です。",fig:"zoyo",
 exp:`<p>相続時精算課税で受けた贈与財産は、亡くなったときに相続財産に足して相続税を計算します（年110万円の基礎控除の部分は除く）。</p><p>このとき足す金額は、<mark>贈与したときの価額</mark>です（亡くなったときの価額ではありません）。</p><p>だから、<b>将来値上がりしそうな財産</b>（成長しそうな会社の株など）を早めに贈与すると、相続税対策になります。</p><p>すでに払った贈与税は、相続税から差し引きます。相続税より多ければ、<b>差額が戻ってきます（還付）</b>。</p>`,
 pt:"相続時精算課税の財産は「贈与時の価額」で加算。払った贈与税は相続税から控除（還付あり）",
 hon:"相続時精算課税の適用を受けた贈与財産は、贈与時の価額により相続税の課税価格に加算される。"},
{q:"相続税の計算で、「相続人が受け取った死亡退職金」で非課税になるのは、亡くなってから3年以内に支給が確定したものである。",a:true,
 exp:`<p>会社から遺族に支払われる<b>死亡退職金</b>は、<b>みなし相続財産</b>です。</p><p>相続財産になるのは、<mark>亡くなってから3年以内に支給が確定したもの</mark>。相続人が受け取った場合は、<b>500万円×法定相続人の数</b>までが非課税です。</p><p>一方、会社から遺族への<b>弔慰金（ちょういきん）</b>は、一定額までは非課税です。<br>・業務上の死亡：給与の<b>3年分</b>まで<br>・業務外の死亡：給与の<b>半年分</b>まで</p><p>なお、3年をこえて確定した退職金は、遺族の一時所得になります。</p>`,
 pt:"死亡退職金：3年以内に支給確定 → 相続税（500万円×法定相続人の数が非課税）。弔慰金は業務上3年分・業務外半年分まで非課税",
 hon:"被相続人の死亡後3年以内に支給が確定した退職手当金等は、相続税の課税対象となり、相続人が取得したものについては、500万円に法定相続人の数を乗じた金額まで非課税となる。"},
{q:"相続税の申告で、配偶者の税額軽減や小規模宅地等の特例を使うと相続税がゼロになる場合は、相続税の申告書を出す必要はない。",a:false,
 exp:`<p>特例を使うと税金がゼロになる場合でも、<mark>申告をしないと特例は使えません</mark>。だから、<b>申告は必要</b>です。</p><p>申告が必要な特例の例：<br>・<mark>配偶者の税額軽減</mark><br>・<mark>小規模宅地等の特例</mark></p><p>反対に、そもそも課税価格の合計が<b>基礎控除額以下</b>なら、申告はいりません。</p>`,
 pt:"配偶者の税額軽減・小規模宅地等の特例は、税額ゼロでも申告が必要",
 hon:"配偶者に対する相続税額の軽減や小規模宅地等についての相続税の課税価格の計算の特例の適用を受けることにより納付すべき相続税額が算出されない場合であっても、相続税の申告書を提出しなければならない。"},
{q:"相続税は原則として現金で一度に払うが、それが難しい場合は「延納」が、延納でも難しい場合は「物納」が認められることがある。",a:true,
 exp:`<p>相続税は、<b>申告期限（10か月以内）までに、現金で一度に払う</b>のが原則です。</p><p>払うのが難しい場合：<br>・<b>延納</b>：分割で払う（10万円をこえ、担保を出すなどの条件あり）<br>・<mark>物納</mark>：延納でも払えない場合に、<b>物（不動産や国債、上場株式など）で払う</b></p><p>物納できる財産には順位があり、<b>第1順位は不動産・船舶・国債・地方債・上場株式など</b>です。</p><p>なお、<b>贈与税</b>は延納はできますが、<b>物納はできません</b>。</p>`,
 pt:"相続税：現金一括が原則 → 延納 → 物納（贈与税は物納不可）",
 hon:"相続税を延納によっても金銭で納付することが困難な場合には、一定の要件のもと、物納が認められる。"},
{q:"小規模宅地等の特例で、亡くなった人が人に貸していたアパートの敷地（貸付事業用宅地等）は、330㎡までの部分の評価額が80%減額される。",a:false,ha:true,ng:"貸付事業用宅地等は<b>200㎡まで50%</b>減額。330㎡・80%は特定居住用（自宅）です。",fig:"shokibo",
 exp:`<p>小規模宅地等の特例の3つの区分を、数字とセットで覚えましょう。</p><p>・<b>特定居住用</b>（自宅）：<b>330㎡まで80%減</b><br>・<b>特定事業用</b>（お店・工場）：<b>400㎡まで80%減</b><br>・<mark>貸付事業用</mark>（アパート・貸駐車場）：<mark>200㎡まで50%減</mark></p><p>特定居住用と特定事業用は、<b>あわせて730㎡まで</b>使えます（330＋400）。貸付事業用を組み合わせる場合は、面積の調整計算が必要です。</p>`,
 pt:"貸付事業用宅地等：200㎡まで50%減（居住用330㎡・事業用400㎡は80%減、両方で730㎡まで）",
 hon:"貸付事業用宅地等に該当する宅地等については、200㎡を限度として評価額の50%を減額することができる。"},
{q:"小規模宅地等の特例で、亡くなった人と同居していた子が自宅の土地を相続した場合、相続税の申告期限まで住み続け、かつ持ち続けることが条件である。",a:true,fig:"shokibo",
 exp:`<p>自宅の土地（特定居住用宅地等）の特例を使える人と条件は、誰が相続するかで変わります。</p><p>・<b>配偶者</b>：<b>条件なし</b>（すぐ売ってもOK）<br>・<mark>同居していた親族</mark>：<mark>申告期限（10か月）まで住み続け、持ち続ける</mark><br>・<b>同居していない親族</b>（いわゆる「家なき子」）：配偶者や同居の相続人がいない、相続前3年以内に自分や配偶者などの持ち家に住んだことがない、などの厳しい条件あり</p>`,
 pt:"特定居住用の特例：配偶者は無条件／同居親族は申告期限まで居住・保有継続",
 hon:"被相続人と同居していた親族が特定居住用宅地等を相続した場合、相続開始時から相続税の申告期限まで引き続き当該宅地等に居住し、かつ所有していることが小規模宅地等の特例の要件である。"},
{q:"家屋の相続税評価額は、固定資産税評価額 × 1.0 で計算し、人に貸している家屋（貸家）は、そこから借家権割合（30%）× 賃貸割合 を差し引いて評価する。",a:true,fig:"hyoka",
 exp:`<p>建物の評価はシンプルです。</p><p>・<b>自分で使う家屋</b>（自用家屋）：<mark>固定資産税評価額 × 1.0</mark><br>・<mark>貸家</mark>：固定資産税評価額 ×（1 − <b>借家権割合（全国一律30%）</b> × 賃貸割合）</p><p>例：評価額2,000万円のアパートが満室なら、2,000万×（1−0.3×1.0）＝<b>1,400万円</b>。</p><p>建てている途中の家（建築中の家屋）は、<b>費用現価×70%</b>で評価します。</p>`,
 pt:"家屋＝固定資産税評価額×1.0／貸家＝×（1−30%×賃貸割合）",
 hon:"貸家の価額は、その家屋の固定資産税評価額×（1−借家権割合×賃貸割合）により評価し、借家権割合は30%である。"},
{q:"借地権割合60%の地域で、自用地としての評価額が1億円の土地を人に貸し、借りた人が自分の家を建てている場合、その土地（貸宅地）の評価額は6,000万円である。",a:false,ha:true,ng:"貸宅地は1億×（1−0.6）＝<b>4,000万円</b>。6,000万円は借地権の評価額です。",fig:"hyoka",
 exp:`<p>土地を人に貸して、その人が家を建てていると、貸している人はその土地を自由に使えません。</p><p>・<b>借りている人の権利（借地権）</b>：自用地評価額 × 借地権割合 ＝ 1億 × 60% ＝ <b>6,000万円</b><br>・<mark>貸している人の土地（貸宅地）</mark>：自用地評価額 ×（1 − 借地権割合）＝ 1億 × 40% ＝ <mark>4,000万円</mark></p><p>借地権と貸宅地を足すと、ちょうど自用地の1億円になります。</p>`,
 pt:"貸宅地（底地）＝自用地評価額×（1−借地権割合）／借地権＝自用地評価額×借地権割合",
 hon:"借地権割合60%、自用地評価額1億円の貸宅地の相続税評価額は、1億円×（1−0.6）＝4,000万円である。"},
{q:"同族株主が、取引相場のない株式（上場していない会社の株）を相続した場合、原則として「類似業種比準方式」や「純資産価額方式」などの原則的評価方式で評価する。",a:true,
 exp:`<p>上場していない会社の株は、市場の値段がないので、特別な方法で評価します。</p><p>・<mark>原則的評価方式</mark>（会社の経営に影響力のある<b>同族株主など</b>）<br>　- <b>類似業種比準方式</b>：同じような業種の上場会社の株価をもとに、配当・利益・純資産をくらべて評価<br>　- <b>純資産価額方式</b>：会社の財産から借金を引いた純資産をもとに評価<br>　（会社の大きさによって、どちらか・または組み合わせ）<br>・<b>特例的評価方式</b>（同族株主<b>以外</b>の少数株主）：<br>　- <b>配当還元方式</b>：もらえる配当をもとに評価（ふつう、かなり安くなる）</p>`,
 pt:"取引相場のない株式：同族株主＝原則的評価（類似業種比準・純資産価額）／同族株主以外＝配当還元方式",
 hon:"同族株主が取得した取引相場のない株式は、会社規模に応じて、類似業種比準方式、純資産価額方式、またはこれらの併用方式により評価する。"},
{q:"「非上場株式等についての贈与税・相続税の納税猶予（事業承継税制）」の特例措置では、後継者が受け継いだ株式に対応する贈与税・相続税の全額が、一定の条件のもと納税を猶予される。",a:true,
 exp:`<p>中小企業の社長が、後継者（子どもなど）に会社の株を渡すとき、<b>高い相続税・贈与税</b>がネックになることがあります。</p><p>そこで<b>事業承継税制</b>では、後継者が株を受け継いでも、一定の条件のもと<b>税金の支払いを先送り（猶予）</b>できます。</p><p>・<mark>特例措置</mark>：対象の株式数の上限なし、<mark>税額の100%</mark>を猶予（前もって「特例承継計画」を都道府県に出す必要があり、その提出期限は2026年3月31日まで）<br>・<b>一般措置</b>：発行済株式の3分の2まで、相続税は80%を猶予</p><p>後継者が亡くなるなど一定の場合には、猶予された税金が<b>免除</b>されます。</p>`,
 pt:"事業承継税制：特例措置は全株式・税額100%猶予（特例承継計画の提出が必要）／一般措置は2/3・相続税80%",
 hon:"非上場株式等についての相続税の納税猶予の特例措置では、後継者が取得した対象株式に係る相続税の全額について、その納税が猶予される。"},
{q:"会社が、亡くなった社長の遺族に死亡退職金を払う資金を準備するため、会社が契約者・受取人、社長が被保険者の生命保険に入るのは、事業承継対策の一つである。",a:true,
 exp:`<p>社長が急に亡くなると、会社には<b>死亡退職金や借金の返済</b>など、大きなお金が必要になります。</p><p>そこで、<mark>会社が契約者・受取人、社長が被保険者</mark>の生命保険に入っておき、受け取った保険金を<b>遺族への死亡退職金</b>にあてる方法がよく使われます。</p><p>遺族が受け取る死亡退職金は、<b>500万円×法定相続人の数まで非課税</b>。さらに、遺族はそのお金で相続税を払ったり、ほかの相続人に代償金を払ったりできます。</p><p>また、遺族が会社に<b>株を買い取ってもらう</b>資金にも使えます（自社株の買取り）。</p>`,
 pt:"法人契約の生命保険で死亡退職金・自社株買取りの資金を準備（遺族の相続税の納税資金にも）",
 hon:"法人が契約者および死亡保険金受取人、役員が被保険者である生命保険は、役員死亡時の死亡退職金の支払原資や事業承継対策として活用される。"},
{q:"相続税の計算で、亡くなった人がもらう予定だった老齢年金のうち、亡くなった後に遺族が受け取った「未支給年金」は、相続税の対象になる。",a:false,
 exp:`<p>年金は後払いなので、亡くなった月の分などが<b>まだ支払われていない（未支給）</b>ことがあります。それを遺族が受け取るのが<b>未支給年金</b>です。</p><p>未支給年金は、法律で<b>遺族自身の権利</b>として受け取るものとされているので、<mark>相続税の対象ではなく、受け取った遺族の一時所得</mark>になります。</p><p>ちなみに、遺族が受け取る<b>遺族年金</b>は、相続税も所得税も<b>かかりません</b>（非課税）。</p>`,
 pt:"未支給年金＝受け取った遺族の一時所得（相続税ではない）。遺族年金は非課税",
 hon:"相続人が受け取った被相続人の未支給年金は、相続税の課税対象とはならず、受け取った遺族の一時所得として所得税の課税対象となる。"},
{q:"相続税の「相次相続控除（そうじそうぞくこうじょ）」は、10年以内に2回以上相続があった場合に、前の相続でかかった相続税の一部を、後の相続税から差し引ける制度である。",a:true,
 exp:`<p>たとえば、祖父が亡くなって父が相続し、その数年後に父も亡くなった…という場合、同じ財産に短い期間で<b>2回も相続税</b>がかかってしまいます。</p><p>そこで、<mark>10年以内に続けて相続があった</mark>場合、前の相続税の一部を、後の相続税から差し引けます。これが<b>相次相続控除</b>です。</p><p>期間が短いほど、差し引ける額は大きくなります。</p>`,
 pt:"相次相続控除：10年以内に続けて相続があったとき、前回の相続税の一部を控除",
 hon:"相次相続控除は、今回の相続開始前10年以内に被相続人が相続により財産を取得し相続税が課されていた場合に適用される。"},
{q:"遺言で財産をもらう人（受遺者）が、遺言者より先に亡くなっていた場合、その遺贈は、受遺者の子が代わりに受け取る（代襲する）。",a:false,
 exp:`<p>遺言で財産をあげること（<b>遺贈</b>）は、<b>その人に</b>あげるという意思です。</p><p>だから、もらう人（受遺者）が遺言者より先に亡くなっていたら、<mark>その遺贈は効力がなくなります</mark>。受遺者の子が代わりにもらう（代襲する）ことはありません。</p><p>相続の「代襲相続」とは、ここがちがうので注意しましょう。</p><p>遺言に「受遺者が先に亡くなったら、その子にあげる」と書いておけば（予備的遺言）、その子がもらえます。</p>`,
 pt:"受遺者が遺言者より先に死亡 → 遺贈は無効（代襲しない）",
 hon:"遺贈は、遺言者の死亡以前に受遺者が死亡したときは、その効力を生じない。"}
].map(o=>Object.assign({g:2,c:"sozo"},o)));

{q:"20歳の子が父から現金500万円の贈与を受けた（その年にほかの贈与はない）。暦年課税の贈与税額として正しいものはどれか。なお、特例税率の速算表は「200万円以下10%、400万円以下15%・控除額10万円、600万円以下20%・控除額30万円」とする。",calc:true,
 ch:["48万5,000円","58万5,000円","70万円","75万円"],a:0,
 exp:`<p>① 基礎控除後：500万 − 110万 ＝ <b>390万円</b><br>② 18歳以上の子が父（直系尊属）からもらったので<b>特例税率</b><br>③ 390万は「400万円以下」の段：390万 × 15% − 10万 ＝ <mark>48万5,000円</mark></p>`,
 why:["正しい。","控除額10万円を引き忘れた数字。","500万円にそのまま20%をかけて30万円を引いた数字（基礎控除を忘れた）。","計算のまちがい。"],
 pt:"贈与税（暦年）＝（贈与額−110万円）×税率−控除額。18歳以上が直系尊属から→特例税率",fig:"zoyo"},
{q:"2025年に、65歳の父から30歳の子へ現金3,000万円を贈与し、子が初めて相続時精算課税を選択した（ほかに贈与はない）。この年の贈与税額として正しいものはどれか。",calc:true,
 ch:["0円","78万円","100万円","580万円"],a:1,
 exp:`<p>① 基礎控除（2024年から）：3,000万 − 110万 ＝ 2,890万円<br>② 特別控除：2,890万 − 2,500万 ＝ <b>390万円</b><br>③ 税率は一律20%：390万 × 20% ＝ <mark>78万円</mark></p>`,
 why:["2,500万円を超えているので税金がかかります。","正しい。","110万円の基礎控除を引き忘れた数字（500万×20%）。","計算のまちがい。"],
 pt:"相続時精算課税：（贈与額−110万円−累計2,500万円）×20%",fig:"zoyo"},
{q:"相続人が配偶者と子2人（うち1人は相続を放棄）で、各人が受け取った死亡保険金が配偶者2,000万円、子（承認）500万円、子（放棄）500万円の場合、相続税の課税価格に算入される死亡保険金の合計として正しいものはどれか。",calc:true,
 ch:["1,000万円","1,500万円","2,000万円","3,000万円"],a:1,
 exp:`<p>① 非課税限度額：500万 × 法定相続人3人（放棄した人も数える）＝ <b>1,500万円</b><br>② 非課税を使えるのは<b>相続人</b>が受け取った分だけ。放棄した子は相続人ではないので使えません。<br>③ 相続人の受取額2,500万円（2,000万＋500万）− 1,500万 ＝ <b>1,000万円</b>が課税<br>④ 放棄した子の500万円は<b>全額</b>課税<br>⑤ 合計：1,000万 ＋ 500万 ＝ <mark>1,500万円</mark></p>`,
 why:["放棄した子の500万円を入れ忘れた数字。","正しい。","法定相続人を2人（放棄した子を除く）として非課税1,000万円で計算した数字（3,000万−1,000万）。","非課税を使わない数字。"],
 pt:"死亡保険金の非課税：500万円×法定相続人の数（放棄者も数える）。使えるのは相続人の受取分だけ",fig:"sozokuzei"},
{q:"相続税の課税財産に関する次の記述のうち、最も適切なものはどれか。",
 ch:["被相続人の死亡後3年を経過してから支給が確定した死亡退職金は、相続税の課税対象となる。","業務外の事由で死亡した場合の弔慰金は、死亡当時の普通給与の3年分まで非課税である。","相続人が受け取った被相続人の未支給年金は、相続税の課税対象とならず、受け取った遺族の一時所得となる。","墓地や仏壇の購入のための未払金は、債務控除の対象となる。"],a:2,
 why:["3年経過後に確定したものは遺族の一時所得。","業務外は<b>半年分</b>まで（3年分は業務上の死亡）。","正しい。","お墓や仏壇は非課税財産なので、その未払金も債務控除できません。"],
 pt:"弔慰金：業務上3年分・業務外半年分まで非課税／未支給年金は一時所得"},
{q:"相続税の申告・納付に関する次の記述のうち、最も不適切なものはどれか。",
 ch:["相続税の申告書は、相続の開始があったことを知った日の翌日から10か月以内に提出する。","配偶者の税額軽減の適用により納付税額がゼロとなる場合でも、申告書の提出が必要である。","相続税は、一定の要件を満たせば、延納や物納が認められる。","被相続人の孫（代襲相続人ではない）が遺贈により財産を取得した場合でも、相続税額の2割加算の対象とならない。"],a:3,
 why:["適切。","適切。","適切。","代襲相続人でない孫は<b>2割加算の対象</b>。不適切。"],
 pt:"2割加算：配偶者・子・父母（と代襲相続人の孫）以外"},
{q:"被相続人の自宅の敷地（400㎡、自用地評価額8,000万円）を、同居していた長男が相続し、申告期限まで居住・所有を続けた。小規模宅地等の特例を適用した後の評価額として正しいものはどれか。",calc:true,
 ch:["1,600万円","2,720万円","3,600万円","6,400万円"],a:1,
 exp:`<p>① 1㎡あたり：8,000万 ÷ 400㎡ ＝ 20万円<br>② 特定居住用宅地等は<b>330㎡まで80%減額</b>：20万 × 330㎡ × 80% ＝ 5,280万円の減額<br>③ 8,000万 − 5,280万 ＝ <mark>2,720万円</mark></p>`,
 why:["400㎡すべてを80%減額した数字（限度は330㎡）。","正しい。","50%で計算した、まちがった数字。","減額額を答えてしまったような、計算のまちがい。"],
 pt:"小規模宅地等：減額＝1㎡単価×限度面積×減額割合",fig:"shokibo"},
{q:"宅地・家屋の相続税評価に関する次の記述のうち、最も適切なものはどれか。",
 ch:["自用家屋の評価額は、固定資産税評価額に1.1を乗じた額である。","貸家の評価額は、自用家屋の評価額×（1−借家権割合×賃貸割合）であり、借家権割合は全国一律30%である。","貸宅地の評価額は、自用地評価額×借地権割合である。","路線価の「300C」は、1㎡あたり300万円・借地権割合70%を表す。"],a:1,
 why:["自用家屋は<b>×1.0</b>。","正しい。","貸宅地は自用地評価額×（<b>1−</b>借地権割合）。","路線価は千円単位なので「300」は1㎡あたり<b>30万円</b>。Cは借地権割合70%で合っています。"],
 pt:"家屋＝固定資産税評価額×1.0／貸家＝×（1−30%×賃貸割合）／路線価は千円単位",fig:"hyoka"},
{q:"取引相場のない株式の評価に関する次の記述のうち、最も適切なものはどれか。",
 ch:["同族株主が取得した株式は、原則として配当還元方式で評価する。","同族株主以外の株主が取得した株式は、原則として配当還元方式（特例的評価方式）で評価できる。","類似業種比準方式は、評価会社の純資産を時価で評価し直して評価する方式である。","会社の規模にかかわらず、すべて純資産価額方式で評価する。"],a:1,
 why:["同族株主は<b>原則的評価方式</b>。","正しい。","それは純資産価額方式。類似業種比準方式は、似た業種の上場会社の株価と配当・利益・純資産を比べる方式。","会社の規模（大・中・小）で評価方式が変わります。"],
 pt:"同族株主＝原則的評価（類似業種比準・純資産価額）／同族株主以外＝配当還元方式"},
{q:"民法上の遺言・相続に関する次の記述のうち、最も適切なものはどれか。",
 ch:["遺言は、満18歳にならなければすることができない。","複数の遺言の内容が抵触する場合、日付の古い遺言が優先される。","遺留分の放棄は、家庭裁判所の許可を受ければ、相続開始前でもすることができる。","相続の放棄は、家庭裁判所の許可を受ければ、相続開始前でもすることができる。"],a:2,
 why:["遺言は<b>15歳</b>以上でできる。","<b>新しい</b>遺言が優先。","正しい。","相続の放棄は相続開始前にはできません。"],
 pt:"遺留分の放棄は生前も可（家裁の許可）。相続放棄は生前は不可"},
{q:"配偶者居住権に関する次の記述のうち、最も不適切なものはどれか。",
 ch:["配偶者居住権の存続期間は、原則として配偶者の終身の間である。","配偶者居住権は、登記をすることで第三者に対抗できる。","配偶者居住権は、第三者に譲渡することができる。","配偶者居住権は、遺産分割や遺言（遺贈）によって取得できる。"],a:2,
 why:["適切。","適切。","配偶者居住権は<b>譲渡できません</b>。不適切。","適切。"],
 pt:"配偶者居住権：原則終身・登記で対抗・譲渡不可"},
{q:"贈与税の非課税・特例に関する次の記述のうち、最も適切なものはどれか。",
 ch:["贈与税の配偶者控除は、婚姻期間が10年以上の配偶者からの居住用不動産等の贈与が対象である。","贈与税の配偶者控除の控除額は、基礎控除とは別に最高2,000万円である。","直系尊属から住宅取得等資金の贈与を受けた場合の非課税限度額は、省エネ等住宅で3,000万円である。","暦年課税の生前贈与加算の対象となる期間は、相続開始前3年以内で変わっていない。"],a:1,
 why:["婚姻期間<b>20年以上</b>。","正しい。","省エネ等住宅は<b>1,000万円</b>（その他は500万円）。","2024年以後の贈与から段階的に<b>7年</b>に延びています。"],
 pt:"配偶者控除：婚姻20年以上・2,000万円＋110万円／住宅取得資金：省エネ1,000万円・その他500万円",fig:"zoyo"},
{q:"事業承継対策に関する次の記述のうち、最も適切なものはどれか。",
 ch:["相続時精算課税で贈与した財産は、相続税の計算上、相続開始時の価額で加算される。","値上がりが見込まれる自社株は、早めに相続時精算課税で贈与すると、相続税の負担を抑えられる可能性がある。","法人が受取人の役員の生命保険金は、遺族への死亡退職金の財源にすることはできない。","非上場株式等の相続税の納税猶予の特例措置では、猶予される税額は相続税額の80%までである。"],a:1,
 why:["加算するのは<b>贈与時</b>の価額。","正しい（贈与時の価額で固定されるため）。","法人が受け取った保険金を死亡退職金の財源にするのは、よく使われる方法。","特例措置は<b>100%</b>猶予（80%は一般措置）。"],
 pt:"相続時精算課税は贈与時の価額で加算 → 値上がりする財産を早めに贈与すると有利"}
].map(o=>Object.assign({g:2,c:"sozo",t:"mc"},o)));

{c:"life",t:"住宅ローンの返済と見直し",

  why:["適切。期間短縮型は、利息がつく期間そのものを短くするので、効果が大きくなります。","不適切。それは期間短縮型の説明。返済額軽減型は、期間は変わらず毎回の返済額が減ります。","不適切。残高が多い<b>早い時期</b>ほど効果が大きくなります。","不適切。繰上げ返済したお金は、すべて<b>元金</b>の返済に充てられます。"],
  pt:"繰上げ返済は早いほど・期間短縮型ほど利息が減る"},
 {q:"元利均等返済と元金均等返済に関する次の記述のうち、最も不適切なものはどれか。",
  ch:["元利均等返済は、元金均等返済より、総返済額が少ない。","元利均等返済は、毎回の返済額（元金＋利息）が一定である。","元金均等返済は、返済の初めの頃の返済額が多く、だんだん減っていく。","元利均等返済は、返済の初めの頃ほど、返済額のうち利息の割合が大きい。"],a:0,

{c:"kin",t:"ポートフォリオの期待収益率とリスク",

 qs:[

 {q:"シャープ・レシオで、投資信託XとYの運用効率を比べたとき、正しいものはどれか。",calc:true,
  ch:["Xは0.7、Yは1.0で、Yの方が効率がよい。","Xは0.8、Yは1.2で、Yの方が効率がよい。","Xは0.7、Yは1.0で、Xの方が効率がよい。","XとYは同じ効率である。"],a:0,

  pt:"シャープ・レシオ＝（収益率−無リスク利子率）÷標準偏差。大きいほど効率がよい"},
 {q:"ポートフォリオのリスクに関する次の記述のうち、最も適切なものはどれか。",
  ch:["組み合わせる2つの資産の相関係数が−1のとき、リスクを減らす効果が最も大きい。","相関係数が＋1のとき、リスクを減らす効果が最も大きい。","相関係数が0のとき、リスクを減らす効果はまったくない。","ポートフォリオのリスクは、各資産の標準偏差を組入比率で加重平均した値より、常に大きい。"],a:0,

  pt:"相関係数−1でリスク低減効果が最大、＋1で効果なし"}
 ]},

function mockList(g){let ids=[];Object.keys(FIELDS).forEach(c=>{

/* 実技：事例ごとのまとまり（ck）と、本番と同じ問題数の模擬試験 */

function jmockList(g){const cs=shuffle(jCases(g));const pick=[];let n=0;
  /* 6分野がなるべくそろうように、分野ごとに1事例ずつ順に取る */
  const by={};cs.forEach(c=>{(by[c.c]=by[c.c]||[]).push(c)});const order=Object.keys(FIELDS);
  while(n<JN[g]&&order.some(f=>by[f]&&by[f].length)){for(const f of order){if(n>=JN[g])break;const c=by[f]&&by[f].shift();if(c){pick.push(c);n+=c.ids.length}}}
  pick.sort((a,b)=>order.indexOf(a.c)-order.indexOf(b.c));
  return pick.flatMap(c=>c.ids).slice(0,JN[g])}

  </section>

    <div class="sets">${cs.map(c=>{const ss=stat(c.ids.map(id=>Q.find(q=>q.id===id)));const sk=g+":jt:"+c.ck;return `<button class="setbtn" style="--fc:${FIELDS[c.c].color}" data-act="jcase" data-k="${c.ck}"><span class="nm">${FIELDS[c.c].short}｜${c.t}<small>${c.ids.length}問</small></span><span class="sc">${validSes(sk)?`<b class="cont">続きは${nextNo(store.ses[sk])}問目から</b>`:ss.ok===ss.n?'<b class="cont">クリア</b>':ss.done?`${ss.ok}/${ss.n}`:"まだ"}</span></button>`}).join("")}</div>
    <button class="btn" data-act="jmock">${validSes(g+":jmock")?"実技の模擬試験の続きから":"実技の模擬試験（"+JN[g]+"問）をはじめる"}</button>
  </section>`})()}
  <div class="row">
    <button class="btn sub" data-act="all">${GRADES[g].name}の全${s.n}問をシャッフル</button>
    <button class="btn sub" data-act="yet" ${y||validSes(g+":yet")?"":"disabled"}>まだの問題（${y}問）</button>
    <button class="btn sub" data-act="wrong" ${w||validSes(g+":wrong")?"":"disabled"}>まちがえた問題だけ（${w}問）</button>

    <p>分野の順番は、身近な <b>ライフプラン → リスク管理（保険）→ 金融 → 税金 → 不動産 → 相続</b> がおすすめ。税金の知識はほかの分野にも出てくるので、つまずいたら税金の分野を見直すと理解が進みます。</p>

}

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function start(ids,label,key,mode){S={view:"quiz",list:ids,i:0,picked:null,picks:[],results:[],label,key:key||null,mode:mode||null};saveSes();render();window.scrollTo(0,0)}
/* k問目で選んだ答え（古い記録で答えが残っていないときは、正誤から復元する） */
function pickOf(k){if(S.picks&&S.picks[k]!==undefined&&S.picks[k]!==null)return S.picks[k];const r=S.results[k];if(!r)return null;const q=Q.find(x=>x.id===S.list[k]);if(!q)return null;
  return r.ok?q.a:(isMC(q)?(q.a+1)%q.ch.length:!q.a)}
/* k問目へ移動（解答ずみなら答えと解説を表示、まだなら解ける状態） */
function go(k){S.i=k;S.picked=k<S.results.length?pickOf(k):null;saveSes();render();window.scrollTo(0,0)}
function prev(){if(S.view==="quiz"&&S.i>0)go(S.i-1)}
/* 保存があれば続きから、なければ最初から */
function resumeOr(key,make,label,mode){
  if(validSes(key)){const v=store.ses[key];
    S={view:"quiz",list:v.list,i:0,picked:null,picks:(v.picks||[]).slice(),results:(v.results||[]).slice(),label:v.label,key,mode:v.mode||null};
    if(v.picked!==null&&v.i>=S.results.length){S.picks[v.i]=v.picked}
    /* まだ解いていない最初の問題から（全部解いてあれば最後の問題） */
    go(Math.min(doneNo(v),v.list.length-1))}
  else{const ids=make();if(ids.length)start(ids,label,key,mode)}
}
const keyColor=k=>{const c=k.split(":")[1];return FIELDS[c]?FIELDS[c].color:"var(--acc)"};

const abHtml=q=>{const ab=q.abbr.map(k=>ABBR.find(a=>a[0]===k));return ab.length?`<div><h4>略語メモ</h4><dl class="words">${ab.map(a=>`<div><dt>${a[0]}</dt><dd>${a[1]}（${a[2]}）</dd></div>`).join("")}</dl></div>`:""};
const wHtml=q=>q.w?`<div><h4>ことばメモ</h4><dl class="words">${q.w.map(w=>`<div><dt><ruby>${w[0]}<rt>${w[1]}</rt></ruby></dt><dd>${w[2]}</dd></div>`).join("")}</dl></div>`:"";
const figHtml=q=>{const fig=q.fig&&FIGS[q.fig];return fig?`<figure class="fig" style="margin:0">${fig.html()}<figcaption class="cap">${fig.cap}</figcaption></figure>`:""};

const prevBtn=()=>S.i>0?`<div class="qnav"><button class="btn sub" data-act="prev">← 前の問題を見る</button></div>`:"";
function quiz(){
  const q=Q.find(x=>x.id===S.list[S.i]);const f=FIELDS[q.c];const answered=S.picked!==null;
  const ok=answered&&(S.picked===q.a);const mc=isMC(q);const jt=q.t==="jt";
  let out=header()+`<div class="qhead" style="--fc:${f.color}"><span class="gb">${GRADES[q.g].name}</span><span class="fl">${f.short}</span><span>${S.label}</span>${S.i<S.results.length&&S.i+1<S.results.length?'<span class="rv">見直し中</span>':""}<span class="n">${S.i+1} / ${S.list.length}</span></div>
  <div class="meter" aria-hidden="true"><i style="width:${(S.i+(answered?1:0))/S.list.length*100}%;background:${f.color}"></i></div>
  <article class="qcard" style="--fc:${f.color}">
    <div class="qno">${GRADES[q.g].name} ${jt?"実技・"+f.short+(q.calc?"・計算":""):f.short+" "+(mc?MCN[q.g]+(q.calc?"・計算":"")+" Q."+q.n:"Q."+q.n+"　○か×か？")}</div>
    ${jt?`<details class="case" ${answered?"":"open"}><summary>【事例】${q.ct}</summary><div class="csbody">${q.cs}</div></details>`:""}
    <div class="qtext">${q.q}</div>`;
  if(mc){
    out+=`<div class="mcs">${q.ch.map((c,i)=>{const cls=answered?(i===q.a?"right":i===S.picked?"wrongp":"dim"):"";return `<button class="mc ${cls}" data-act="pickc" data-v="${i}" ${answered?"disabled":""}><span class="no">${MK[i]}</span><span class="tx">${c}</span>${answered&&i===q.a?'<span class="tag ok">正解</span>':answered&&i===S.picked?'<span class="tag ng">あなた</span>':""}</button>`}).join("")}</div>`;
    if(!answered){out+=`<div class="kbd">キーボードなら 1〜${q.ch.length} で答えられます</div>${prevBtn()}${MyNote.slot(q.id)}</article>`;app.innerHTML=out;return}
    out+=`<div class="verdict ${ok?"ok":"ng"}" role="status"><span class="big">${ok?"○":"×"}</span><div><h3>${ok?"正解！":"ざんねん"}</h3><p>正解は「<b>${MK[q.a]}</b>」です</p></div></div>
    <div class="exp">
      ${q.exp?`<div><h4>${q.calc?"計算のしかた":"かんたん解説"}</h4><div class="body">${q.exp}</div></div>`:""}
      <div><h4>選択肢ごとの解説</h4><ol class="whys">${q.why.map((w,i)=>`<li class="${i===q.a?"r":""}"><span class="no">${MK[i]}</span><span>${w}</span></li>`).join("")}</ol></div>
      ${figHtml(q)}
      <div class="point">${q.pt}</div>
      ${wHtml(q)}${abHtml(q)}
      ${MyNote.slot(q.id)}
    </div>`;
  }else{
    out+=`<div class="choices">
      <button class="choice o ${answered?(S.picked===true?"picked":"dim"):""}" data-act="pick" data-v="1" ${answered?"disabled":""}><span class="mk">○</span><span class="lb">正しい</span></button>
      <button class="choice x ${answered?(S.picked===false?"picked":"dim"):""}" data-act="pick" data-v="0" ${answered?"disabled":""}><span class="mk">×</span><span class="lb">まちがい</span></button>
    </div>`;
    if(!answered){out+=`<div class="kbd">キーボードなら O / X で答えられます</div>${prevBtn()}${MyNote.slot(q.id)}</article>`;app.innerHTML=out;return}
    out+=`<div class="verdict ${ok?"ok":"ng"}" role="status"><span class="big">${ok?"○":"×"}</span><div><h3>${ok?"正解！":"ざんねん"}</h3><p>この文は「<b>${q.a?"○ 正しい":"× まちがい"}</b>」です</p></div></div>
    <div class="exp">
      ${q.ng?`<div class="ngbox"><span class="lbl">どこがちがう？</span>${q.ng}</div>`:""}
      <div><h4>かんたん解説</h4><div class="body">${q.exp}</div></div>
      ${figHtml(q)}
      <div class="point">${q.pt}</div>
      <div class="hon"><span class="lbl">本番の試験では、こんな書き方で出ます</span>「${q.hon}」<br><b>→ ${(q.ha!==undefined?q.ha:q.a)?"正しい（適切）":"誤り（不適切）"}</b></div>
      ${wHtml(q)}${abHtml(q)}
      ${MyNote.slot(q.id)}
    </div>`;
  }
  out+=`${answered?selfMarkHtml(q.id):""}<div class="qnav">${S.i>0?'<button class="btn sub" data-act="prev">← 前の問題</button>':""}<button class="btn" data-act="next" id="nextBtn">${S.i+1<S.list.length?(S.i+1<S.results.length?"次の問題へ（見直し）":"次の問題へ →"):"結果を見る"}</button></div>
  </article>`;
  app.innerHTML=out;
}

function end(){
  const n=S.results.length,ok=S.results.filter(r=>r.ok).length;
  const miss=S.results.filter(r=>!r.ok);
  const plain=t=>t.replace(/<[^>]+>/g,"");
  let body="";
  if(S.mode==="mock"){
    const pass=ok>=36;
    const by=Object.keys(FIELDS).map(c=>{const rs=S.results.filter(r=>Q.find(q=>q.id===r.id).c===c);return{c,n:rs.length,ok:rs.filter(r=>r.ok).length}});
    body=`<div class="pass ${pass?"ok":"ng"}">${pass?"合格ライン到達！":"あと"+(36-ok)+"点で合格ライン"}<small>合格ラインは60点中36点</small></div>
    <table class="ft"><thead><tr><th class="l">分野</th><th>点数</th><th>6割</th></tr></thead><tbody>${by.map(b=>`<tr><th class="l">${FIELDS[b.c].name}</th><td>${b.ok} / ${b.n}</td><td>${b.ok>=b.n*.6?'<span class="y">○</span>':'<span class="n">×</span>'}</td></tr>`).join("")}</tbody></table>
    <p class="mini" style="margin:0">×の分野は、その分野の「○×で覚える」と「${MCN[G()]}・計算」をもう一度。36点以上を3回続けてとれるまで、模擬試験をくり返しましょう。</p>`;
  }
  if(S.mode==="jmock"){
    const pt=Math.round(ok/n*100);const pass=pt>=60;
    const by=Object.keys(FIELDS).map(c=>{const rs=S.results.filter(r=>Q.find(q=>q.id===r.id).c===c);return{c,n:rs.length,ok:rs.filter(r=>r.ok).length}}).filter(b=>b.n);
    body=`<div class="pass ${pass?"ok":"ng"}">${pass?"実技 合格ライン到達！":"あと"+(60-pt)+"点で合格ライン"}<small>100点満点に換算：${pt}点（合格ラインは60点）</small></div>
    <table class="ft"><thead><tr><th class="l">分野</th><th>正解</th><th>6割</th></tr></thead><tbody>${by.map(b=>`<tr><th class="l">${FIELDS[b.c].name}</th><td>${b.ok} / ${b.n}</td><td>${b.ok>=b.n*.6?'<span class="y">○</span>':'<span class="n">×</span>'}</td></tr>`).join("")}</tbody></table>
    <p class="mini" style="margin:0">×の分野は、その分野の事例を解き直し、学科の「${MCN[G()]}・計算」も見直しましょう。60点以上を3回続けてとれるまで、くり返します。</p>`;
  }
  const msg=ok===n?"全問正解！ この調子で次へ。":ok/n>=.6?"合格ラインの6割をこえています。まちがえた所だけ、もう一度見ておきましょう。":"だいじょうぶ。解説を読んで、もう一度チャレンジすれば必ず覚えられます。";
  app.innerHTML=header()+`<section class="end">
    <span class="qhead">${S.label} の結果</span>
    <div class="score">${S.mode==="jmock"?Math.round(ok/n*100):ok}<small> / ${S.mode==="jmock"?"100点":n+(S.mode==="mock"?"点":"問")}</small></div>
    ${body||`<p style="margin:0">${msg}</p>`}
    ${miss.length?`<div class="miss"><b style="font-size:14px">まちがえた問題</b>${miss.map(r=>{const q=Q.find(x=>x.id===r.id);return `<button data-act="one" data-id="${q.id}"><b>×</b>${plain(q.q)}</button>`}).join("")}</div>`:""}
    <div class="row">${miss.length?`<button class="btn" data-act="retry">まちがえた${miss.length}問をやり直す</button>`:""}<button class="btn sub" data-act="home">ホームへ</button></div>
  </section>`;
}

function render(){S.view==="home"?home():S.view==="quiz"?quiz():end()}

function pick(v){
  if(S.picked!==null||S.i<S.results.length)return;
  const q=Q.find(x=>x.id===S.list[S.i]);
  if(isMC(q)?typeof v!=="number"||v<0||v>=q.ch.length:typeof v!=="boolean")return;
  S.picked=v;if(!S.picks)S.picks=[];S.picks[S.i]=v;
  const ok=v===q.a;const r=store.res[q.id]||{n:0};
  store.res[q.id]={ok,n:r.n+1};S.results.push({id:q.id,ok});SRS.set(q.id,ok?"ok":"ng");saveSes();save();
  render();
  const v2=document.querySelector(".verdict");if(v2&&v2.scrollIntoView)v2.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"});
}
function next(){if(S.picked===null)return;if(S.i+1<S.list.length){go(S.i+1)}
  else{if(S.mode==="mock"){const g=Q.find(q=>q.id===S.list[0]).g;const ok=S.results.filter(r=>r.ok).length;const pv=store.mock[g];store.mock[g]={ok,best:Math.max(ok,pv?pv.best:0),ts:Date.now()};save()}
    if(S.mode==="jmock"){const g=Q.find(q=>q.id===S.list[0]).g;const pt=Math.round(S.results.filter(r=>r.ok).length/S.results.length*100);const pv=store.jmock[g];store.jmock[g]={pt,best:Math.max(pt,pv?pv.best:0),ts:Date.now()};save()}
    dropSes(S.key);S.view="end";render();window.scrollTo(0,0)}}

app.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act;const g=G();
  if(a==="home"){S.view="home";render();window.scrollTo(0,0)}
  else if(a==="grade"){store.grade=+b.dataset.g;save();render()}
  else if(a==="set"){const c=b.dataset.c,t=b.dataset.t;resumeOr(g+":"+c+":"+t,()=>qsOf(g,c,t).map(q=>q.id),GRADES[g].name+"・"+FIELDS[c].short+"・"+(t==="ox"?"○×":MCN[g]+"・計算"))}
  else if(a==="mock"){resumeOr(g+":mock",()=>mockList(g),GRADES[g].name+"・模擬試験","mock")}
  else if(a==="jmock"){resumeOr(g+":jmock",()=>jmockList(g),GRADES[g].name+"・実技の模擬試験","jmock")}
  else if(a==="jcase"){const c=jCases(g).find(x=>x.ck===b.dataset.k);if(c)resumeOr(g+":jt:"+c.ck,()=>c.ids,GRADES[g].name+"・実技・"+c.t)}
  else if(a==="review"){resumeOr(todayKey(g),()=>SRS.dueIds(qsOf(g).map(q=>q.id)),GRADES[g].name+"・今日の復習")}
  else if(a==="smark"){rate(S.list[S.i],b.dataset.g);render()}
  else if(a==="memo"){const ids=memoIds(g);if(ids.length)start(shuffle(ids),GRADES[g].name+"・メモした問題")}
  else if(a==="all"){resumeOr(g+":all",()=>shuffle(qsOf(g).map(q=>q.id)),GRADES[g].name+"・全問シャッフル")}
  else if(a==="yet"){resumeOr(g+":yet",()=>yetIds(g),GRADES[g].name+"・まだの問題")}
  else if(a==="wrong"){resumeOr(g+":wrong",()=>shuffle(wrongIds(g)),GRADES[g].name+"・まちがえた問題")}
  else if(a==="resume"){const k=b.dataset.k;if(validSes(k))resumeOr(k,()=>[],"")}
  else if(a==="drop"){dropSes(b.dataset.k);render()}
  else if(a==="retry"){start(S.results.filter(r=>!r.ok).map(r=>r.id),"やり直し")}
  else if(a==="one"){start([b.dataset.id],"1問だけ")}
  else if(a==="pick"){pick(b.dataset.v==="1")}
  else if(a==="pickc"){pick(+b.dataset.v)}
  else if(a==="next"){next()}
  else if(a==="prev"){prev()}
  else if(a==="reset"){
    if(b.dataset.sure){store={res:{},ses:{},mock:{},jmock:{},grade:g};save();SRS.clear();render()}
    else{b.dataset.sure="1";b.textContent="本当に消す？（もう一度押す）"}
  }
});
document.addEventListener("keydown",e=>{
  if(S.view!=="quiz"||e.metaKey||e.ctrlKey||e.altKey)return;
  if(e.target&&/^(TEXTAREA|INPUT)$/.test(e.target.tagName))return;
  const k=e.key.toLowerCase();const q=Q.find(x=>x.id===S.list[S.i]);
  if(k==="arrowleft"){e.preventDefault();prev();return}
  if(S.picked===null){
    if(q&&isMC(q)){if(/^[1-4]$/.test(k)&&+k<=q.ch.length)pick(+k-1)}
    else if(k==="o"||k==="1")pick(true);else if(k==="x"||k==="2")pick(false)}
  else if(k==="arrowright"){e.preventDefault();next()}
  else if(k==="enter"||k==="n"||k===" "){if(document.activeElement&&document.activeElement.id!=="nextBtn"){e.preventDefault();next()}}
});
render();

</script>
