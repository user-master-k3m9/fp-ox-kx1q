<style>
/* Layout: 家計簿の方眼ノートの上に、1枚ずつめくる問題カード。採点は赤ペンの○ */
:root{
  --paper:#f5f4ee; --grid:rgba(31,107,92,.07); --card:#ffffff; --ink:#1f2a2a; --muted:#5b6866; --line:#d9ddd6;
  --acc:#1f6b5c; --acc-soft:#e1efeb; --maru:#cf3b2a; --maru-soft:#fbe7e3; --batsu:#46566a; --batsu-soft:#e8ecf1;
  --hl:#ffe9a0; --hl-ink:#1f2a2a; --hl-fill:#fff7d6;
  --c1:#1f6b5c; --c2:#2c5d8a; --c3:#a5661a; --c4:#7a4f8f; --c5:#8a5a3c; --c6:#b0405a;
  --display:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121716; --grid:rgba(120,200,180,.06); --card:#1a2221; --ink:#e4ecea; --muted:#9aa9a6; --line:#2e3a38;
  --acc:#7cc7b3; --acc-soft:#1b332e; --maru:#ff7b67; --maru-soft:#3a201c; --batsu:#a9b8cc; --batsu-soft:#253039;
  --hl:#5c4e10; --hl-ink:#fff6cf; --hl-fill:#332c12;
  --c1:#7cc7b3; --c2:#82b2df; --c3:#e3a75c; --c4:#c59ed8; --c5:#d9a27e; --c6:#ec8ea3; color-scheme:dark}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--body); font-size:16px; line-height:1.8;
  padding-inline:16px; padding-block:12px 48px;
}
.wrap{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
mark{background:linear-gradient(transparent 45%,var(--hl) 45%);color:inherit;padding:0 2px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:4px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand .seal{width:40px;height:40px;border-radius:50%;border:3px solid var(--maru);color:var(--maru);display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;line-height:1;transform:rotate(-8deg);flex:none}
.brand b{font-family:var(--display);font-size:20px;font-weight:900;letter-spacing:.02em}
.brand small{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em}
.ghost{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:14px}

/* home */
.hero{display:flex;flex-direction:column;gap:10px;padding-block:8px}
.hero h1{font-size:clamp(26px,6vw,34px);font-weight:900}
.hero h1 .ox{color:var(--maru)}
.hero p{margin:0;color:var(--muted);max-width:34em}
.total{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;font-size:14px;color:var(--muted)}
.total strong{font-family:var(--display);font-size:28px;color:var(--ink);font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--maru);border-radius:99px;transition:width .4s}

.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:520px){.fields{grid-template-columns:1fr}}
.field{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;border-top:5px solid var(--fc)}
.field:hover{border-color:var(--fc)}
.field .tag{font-size:12px;letter-spacing:.08em;color:var(--fc);font-weight:700}
.field h3{font-size:19px}
.field p{margin:0;font-size:13px;color:var(--muted);line-height:1.6}
.field .stat{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.field .meter i{background:var(--fc)}
.field .go{margin-top:2px;font-family:var(--display);font-weight:700;color:var(--fc);font-size:15px}

.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{border:0;border-radius:12px;padding:12px 18px;font-family:var(--display);font-weight:700;font-size:16px;background:var(--acc);color:var(--card)}
.btn.sub{background:var(--card);color:var(--ink);border:1px solid var(--line)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel summary{font-family:var(--display);font-weight:700;font-size:17px;cursor:pointer}
.panel[open] summary{margin-bottom:10px}
.panel p{margin:.4em 0}
.stack{display:flex;height:34px;border-radius:8px;overflow:hidden;margin:10px 0 6px}
.stack span{display:grid;place-items:center;color:var(--card);font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;font-size:13px}
.legend div{display:flex;gap:6px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}

/* quiz */
.qhead{display:flex;align-items:center;gap:12px;font-size:14px;color:var(--muted)}
.qhead .fl{color:var(--fc);font-weight:700}
.qhead .n{margin-left:auto;font-variant-numeric:tabular-nums}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:18px;position:relative}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice{border:2px solid var(--line);background:var(--paper);border-radius:16px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;transition:transform .08s}
.choice:active{transform:scale(.97)}
.choice .mk{font-family:var(--display);font-size:46px;font-weight:900;line-height:1}
.choice .lb{font-size:13px;color:var(--muted)}
.choice.o .mk{color:var(--maru)}
.choice.x .mk{color:var(--batsu)}
.choice:hover{border-color:var(--acc)}
.choice.picked{border-color:var(--ink)}
.choice[disabled]{cursor:default}
.choice.dim{opacity:.4}

.verdict{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:14px}
.verdict.ok{background:var(--maru-soft)}
.verdict.ng{background:var(--batsu-soft)}
.verdict .big{font-family:var(--display);font-weight:900;font-size:52px;line-height:1;flex:none;width:58px;text-align:center}
.verdict.ok .big{color:var(--maru)}
.verdict.ng .big{color:var(--batsu)}
.verdict h3{font-size:20px}
.verdict p{margin:0;font-size:14px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.verdict .big{animation:stamp .35s ease-out}}
@keyframes stamp{from{transform:scale(1.8) rotate(-15deg);opacity:0}to{transform:none;opacity:1}}

.exp{display:flex;flex-direction:column;gap:14px}
.exp h4{font-family:var(--display);font-size:15px;margin:0;color:var(--acc);letter-spacing:.04em}
.exp .body p{margin:0 0 .6em}
.point{border:2px dashed var(--maru);border-radius:12px;padding:10px 14px;font-weight:700;display:flex;gap:10px;align-items:flex-start}
.point::before{content:"覚える";flex:none;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:2px 6px;margin-top:4px;letter-spacing:.06em}
.hon{background:var(--paper);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.75}
.hon .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em;margin-bottom:2px}
.words{display:flex;flex-direction:column;gap:6px;font-size:14px}
.words div{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}
.words dt{font-weight:700;margin:0}
.words dt rt{font-size:10px;color:var(--muted);font-weight:400}
.words dd{margin:0;color:var(--muted)}
.fig{border:1px solid var(--line);border-radius:12px;padding:14px 10px;background:var(--paper);overflow-x:auto}
.fig .cap{font-size:12px;color:var(--muted);text-align:center;margin-top:6px}
.qnav{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.qnav .btn{flex:1 1 auto}
.kbd{font-size:12px;color:var(--muted);text-align:center}

/* figures */
.fig-svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.fig-svg text{fill:var(--ink);font-size:13px;font-family:var(--body)}
.fig-svg text.sm{font-size:11px;fill:var(--muted)}
.fig-svg text.b{font-weight:700}
.fig-svg text.red{fill:var(--maru);font-weight:700}
.fig-svg text.acc{fill:var(--acc);font-weight:700}
.fig-svg .bx{fill:var(--card);stroke:var(--ink);stroke-width:1.4}
.fig-svg .ax{fill:var(--acc-soft);stroke:var(--acc);stroke-width:1.4}
.fig-svg .hx{fill:var(--hl-fill);stroke:var(--maru);stroke-width:1.6}
.fig-svg .gx{fill:var(--line);stroke:none}
.fig-svg .ln{stroke:var(--ink);stroke-width:1.4;fill:none}
.fig-svg .ln.d{stroke-dasharray:5 4}
.fig-svg .ln.red{stroke:var(--maru);stroke-width:2}
.fig-svg .ln.thick{stroke-width:5}
.fig-svg .ah{fill:var(--ink)}
.fig-svg .ah.red{fill:var(--maru)}
.fig-svg .dot{fill:var(--maru)}
.fig-svg .tree{fill:var(--c2)}
.ft{width:100%;border-collapse:collapse;font-size:14px;min-width:300px;background:var(--card)}
.ft th,.ft td{border:1px solid var(--line);padding:7px 8px;text-align:center;vertical-align:middle;line-height:1.5}
.ft th{background:var(--acc-soft);font-weight:700}
.ft td.l,.ft th.l{text-align:left}
.ft .y{color:var(--maru);font-weight:700;font-size:17px}
.ft .n{color:var(--batsu);font-weight:700;font-size:17px}
.ft .hit{background:var(--hl-fill)}

/* end */
.end{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.score{font-family:var(--display);font-weight:900;font-size:56px;line-height:1;color:var(--maru);font-variant-numeric:tabular-nums}
.score small{font-size:22px;color:var(--muted)}
.miss{display:flex;flex-direction:column;gap:8px;width:100%}
.miss button{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
.miss button b{color:var(--batsu);margin-right:6px}
.foot{font-size:12px;color:var(--muted);line-height:1.7}

/* levels */
.lvls{display:flex;flex-direction:column;gap:6px;margin-top:2px}
.lvbtn{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;line-height:1.3}
.lvbtn:hover{border-color:var(--fc)}
.lvbtn .nm{font-weight:700}
.lvbtn .nm small{font-weight:400;color:var(--muted);margin-left:6px;font-size:12px}
.lvbtn .sc{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lvbtn .done{color:var(--maru)}
.lvdot{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:900;font-size:13px;color:var(--card);flex:none}
.lvdot.l1,.chip.l1{background:var(--c2)}
.lvdot.l2,.chip.l2{background:var(--c3)}
.lvdot.l3,.chip.l3{background:var(--maru)}
.chip{color:var(--card);font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px}
.lvsum{font-size:13px}
.steps{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.step{display:flex;align-items:center;gap:8px;min-width:0}
.step b{display:block;font-family:var(--display);font-size:15px;line-height:1.2}
.step small{display:block;font-size:11px;color:var(--muted);line-height:1.3}
.steps .arrow{color:var(--muted)}
.goro8{font-family:var(--display);font-size:clamp(16px,4.2vw,19px);line-height:1.7;text-align:center;padding:10px 8px 14px}
.goro8 b{color:var(--maru)}
.goro{border-radius:12px;padding:10px 14px;background:var(--hl-fill);font-size:14px;line-height:1.75}
.goro .lbl{display:block;font-size:12px;color:var(--muted);letter-spacing:.06em}
.goro .g{font-family:var(--display);font-size:16px}
.goro .g b{color:var(--maru)}
.resume{display:flex;flex-direction:column;gap:8px}
.resume h2{font-size:16px}
.resitem{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--fc);border-radius:12px;padding:10px 12px}
.resitem .t{font-weight:700;font-size:15px;line-height:1.4;min-width:0}
.resitem .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.resitem .btn{padding:8px 14px;font-size:14px}
.resitem .ghost{font-size:12px}
.qtools{display:flex;justify-content:flex-end;gap:8px;margin-top:-10px}
.qtools .ghost{font-size:12px;padding:4px 12px}

.flead{margin:0 4px 10px;font-weight:700;font-size:15px;line-height:1.6}
.fnote{margin:8px 4px 0;font-size:13px;color:var(--muted);line-height:1.6}
.point::before{content:none}
.point{flex-direction:column;gap:2px}
.plbl{display:inline-block;font-size:11px;background:var(--maru);color:var(--card);border-radius:6px;padding:1px 8px;margin-bottom:4px;letter-spacing:.06em}
.point > span{display:flex;flex-direction:column;align-items:flex-start}
.ft td{text-align:left}
.ft td:has(.y:only-child),.ft td:has(.n:only-child){text-align:center}
.ft{font-size:13.5px}
.ft th:not(:first-child),.ft td{min-width:5.2em}
.ft tbody th.l{min-width:7em;max-width:14em}

.brand .seal{font-size:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tab{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:0;text-align:left}
.tab b{font-family:var(--display);font-size:22px;line-height:1.2}
.tab small{font-size:12px;color:var(--muted)}
.tab.on{border-color:var(--acc);background:var(--acc-soft)}
.tab.on b{color:var(--acc)}
.fields{grid-template-columns:repeat(2,minmax(0,1fr))}
.qhead .gb{background:var(--acc);color:var(--card);border-radius:6px;padding:0 8px;font-weight:700;font-size:12px}
.qhead{flex-wrap:wrap}
.ab{color:var(--muted);font-weight:400;font-size:.88em}
.en{font-family:var(--body);letter-spacing:0}
.mini{font-size:12px;color:var(--muted)}
.btn[disabled]{opacity:.45;cursor:default}
.panel .words dd{color:var(--ink)}
.flow{margin:0;padding-left:1.4em;font-size:14px;line-height:1.8;text-align:left}
.flow li{margin:2px 0}
.fig .ft{margin-bottom:8px}
.fig .ft:last-child{margin-bottom:0}
.ft.hk td:last-child{font-weight:700}
.ngbox{background:var(--batsu-soft);border-left:5px solid var(--batsu);border-radius:10px;padding:10px 14px;font-size:15px;line-height:1.75}
.ngbox .lbl{display:block;font-size:12px;font-weight:700;color:var(--batsu);letter-spacing:.06em}
.resitem small b{color:var(--acc)}
.field .stat b.cont{color:var(--acc)}
.field .stat{flex-wrap:wrap;gap:0 10px}
.field .stat>span{white-space:nowrap}
.tower{display:flex;flex-direction:column;gap:4px;font-size:13px;text-align:center;min-width:300px}
.tower small{display:block;font-size:11px;color:var(--muted);font-weight:400;line-height:1.4}
.tower .fl2{display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px}
.tower .cell{border-radius:8px;padding:8px 4px;line-height:1.4}
.tower .cell.up{background:var(--acc-soft);border:2px solid var(--acc);font-weight:700}
.tower .cell.em{border:1px dashed var(--line);color:var(--muted)}
.tower .fl1{background:var(--hl-fill);border:2px solid var(--maru);border-radius:8px;padding:8px;font-weight:700}

.tower .fl0 span{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 4px;font-weight:700}
</style>

<script>
/* ---------- 図のための小さな道具 ---------- */
const svg=(w,h,label,body)=>`<svg class="fig-svg" viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${body}</svg>`;
const T=(x,y,s,c="",a="middle")=>`<text x="${x}" y="${y}" text-anchor="${a}" class="${c}">${s}</text>`;
const R=(x,y,w,h,c="bx",r=8)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" class="${c}"/>`;
const L=(x1,y1,x2,y2,c="ln")=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}"/>`;
function Ar(x1,y1,x2,y2,c=""){
  const a=Math.atan2(y2-y1,x2-x1),h=9,w=5;
  const bx=x2-h*Math.cos(a),by=y2-h*Math.sin(a);
  const p1=[bx+w*Math.sin(a),by-w*Math.cos(a)],p2=[bx-w*Math.sin(a),by+w*Math.cos(a)];
  return L(x1,y1,bx,by,"ln "+c)+`<polygon points="${x2},${y2} ${p1[0].toFixed(1)},${p1[1].toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}" class="ah ${c}"/>`;
}

/* ---------- 図・表 ---------- */
const tb=(head,rows,cls="")=>`<table class="ft ${cls}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th class="l">${c}</th>`:`<td>${c}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
const Y=`<span class="y">○</span>`,N=`<span class="n">×</span>`;

];
const isAl=c=>!!c&&/[A-Za-z\-]/.test(c);
function expandAbbr(text,seen,found){
  for(const [ab,jp,en] of ABBR){
    let from=0;
    while(true){
      const i=text.indexOf(ab,from);if(i<0)break;
      const pre=text[i-1],post=text[i+ab.length];
      if(isAl(pre)||isAl(post)||(ab!=="J-REIT"&&pre==="-")){from=i+ab.length;continue}
      if(!found.includes(ab))found.push(ab);
      if(seen.has(ab))break;
      seen.add(ab);
      const rest=text.slice(i+ab.length);
      if(rest.startsWith("（"+jp+"）")){text=text.slice(0,i+ab.length)+"（"+jp+"：<span class=\"en\">"+en+"</span>）"+rest.slice(jp.length+2)}
      else if(rest.startsWith("（")){/* すでに説明あり */}
      else{text=text.slice(0,i+ab.length)+"<span class=\"ab\">（"+jp+"：<span class=\"en\">"+en+"</span>）</span>"+rest}
      break;
    }
  }
  return text;
}

 hon:"住宅ローンの一部繰上げ返済では、返済期間短縮型のほうが返済額軽減型よりも利息軽減効果が大きい（他の条件は同一とする）。"},
{q:"フラット35は、借りたときから返し終わるまで金利が変わらない「全期間固定金利」の住宅ローンである。",a:true,
 exp:`<p>フラット35は、民間の銀行などと<b>住宅金融支援機構（じゅうたくきんゆうしえんきこう）</b>が協力して出している住宅ローンです。</p><p>特ちょうは<mark>ずっと金利が同じ（全期間固定金利）</mark>こと。返済期間は<b>最長35年</b>です。</p><p>金利は、借りた日ではなく<b>お金を受け取る日（融資実行日）</b>の金利が使われます。</p>`,
 pt:"フラット35＝全期間固定金利・最長35年・融資実行時の金利",
 hon:"フラット35の借入金利は全期間固定金利であり、融資実行時点の金利が適用される。",
 w:[["融資","ゆうし","お金を貸すこと"]]},
{q:"日本政策金融公庫の「国の教育ローン」は、学生1人あたり原則500万円まで借りられる。",a:false,ha:true,ng:"原則<b>350万円</b>まで（海外留学など一定の場合は450万円）です。",
 exp:`<p>子どもの入学金や授業料のために、<b>親が借りる</b>のが国の教育ローン（教育一般貸付）です。</p><p>借りられる額は<mark>学生1人あたり原則350万円まで</mark>（海外留学など一定の場合は450万円まで）。</p><p>使い道は授業料だけでなく、<b>受験料や通学の定期代、アパート代</b>などにも使えます。</p>`,
 pt:"国の教育ローン＝日本政策金融公庫・1人350万円まで（親が借りる）",
 hon:"日本政策金融公庫の教育一般貸付（国の教育ローン）の融資限度額は、所定の海外留学資金等を除き、学生・生徒1人につき350万円である。"},
{q:"日本学生支援機構の奨学金で、「第一種奨学金」は利息がつかない（無利息の）貸与型の奨学金である。",a:true,
 exp:`<p>日本学生支援機構の奨学金は、<b>学生本人が借りて、卒業後に返す</b>ものが中心です。</p><p>・<b>第一種</b>：<mark>利息なし</mark>（そのぶん成績や家計の基準がきびしい）<br>・<b>第二種</b>：<b>利息あり</b>（在学中は利息がかからない）</p><p>返さなくてよい<b>給付型</b>もあります。国の教育ローン（親が借りる）とあわせて使うこともできます。</p>`,
 pt:"奨学金：第一種＝無利息／第二種＝利息あり（学生本人が借りる）",
 hon:"日本学生支援機構の貸与型奨学金には、無利息の第一種奨学金と利息付き（在学中は無利息）の第二種奨学金がある。"},
{q:"会社員の健康保険で、病院の窓口で払う自己負担の割合は、小学校入学後から70歳になるまでの人は原則2割である。",a:false,ha:true,ng:"70歳未満（小学校入学後）は原則<b>3割</b>。2割なのは小学校入学前と、70〜74歳（現役並み所得者を除く）です。",
 exp:`<p>病院の代金は、全部を自分で払うわけではありません。残りは健康保険が払ってくれます。</p><p>自分で払う割合（自己負担）は、<br>・<b>小学校に入る前</b>：2割<br>・<mark>小学校入学後〜70歳未満：3割</mark><br>・70歳〜74歳：2割（現役なみに収入がある人は3割）</p><p>75歳からは<b>後期高齢者医療制度</b>という別のしくみに入ります。</p>`,
 pt:"自己負担：就学前2割／70歳未満3割／70〜74歳2割（現役並み3割）",
 hon:"健康保険の被保険者が保険医療機関で療養の給付を受けた場合の一部負担金の割合は、原則として、70歳未満の者（義務教育就学前の者を除く）は3割である。"},
{q:"健康保険の「傷病手当金（しょうびょうてあてきん）」は、病気やけがで会社を休んだ1日目から支給される。",a:false,
 exp:`<p>傷病手当金は、会社員が病気やけがで<b>働けず、給料が出ないとき</b>の生活を助けるお金です。</p><p>もらえるのは、<mark>連続して3日休んだあと（待期期間）、4日目から</mark>。1日目からではありません。</p><p>金額は、だいたい<b>給料の日額の3分の2</b>。もらえる期間は<b>通算1年6か月</b>までです。</p><p>なお、自営業の人の国民健康保険には、ふつうこの手当はありません。</p>`,
 pt:"傷病手当金：連続3日休んだ後の4日目から・日額の2/3・通算1年6か月",
 hon:"傷病手当金は、業務外の事由による療養のため労務に服することができなくなった日から起算して3日を経過した日から支給される。",
 w:[["待期","たいき","手当が出るまでに待つ期間"]]},
{q:"会社をやめたあと、それまでの健康保険を「任意継続（にんいけいぞく）」で続ける場合、保険料は今までどおり会社が半分払ってくれる。",a:false,
 exp:`<p>会社をやめても、条件を満たせば、今までの健康保険に<b>最長2年</b>入り続けられます。これが任意継続です。</p><p>でも会社員のときは会社が半分払ってくれていた保険料を、<mark>やめたあとは全額自分で払います</mark>。</p><p>手続きは<b>やめた日の翌日から20日以内</b>。入れるのは、やめる前に<b>2か月以上</b>入っていた人です。</p>`,
 pt:"任意継続：退職後20日以内に手続き・最長2年・保険料は全額自己負担",
 hon:"任意継続被保険者の保険料は、全額が被保険者の負担となる。"},
{q:"国民年金には、日本に住んでいる20歳以上60歳未満の人は全員加入しなければならない。",a:true,fig:"nenkin",
 exp:`<p>日本の年金は<b>2階建ての家</b>のようなしくみです。</p><p>1階が<mark>国民年金（みんなが入る）</mark>、2階が<b>厚生年金（会社員や公務員がプラスで入る）</b>です。</p><p>国民年金に入る人は3つのグループに分かれます。<br>・<b>第1号</b>：自営業・学生など<br>・<b>第2号</b>：会社員・公務員<br>・<b>第3号</b>：第2号に養ってもらっている配偶者（専業主婦など）</p>`,
 pt:"国民年金＝20歳以上60歳未満の全員が加入（第1号・第2号・第3号）",
 hon:"日本国内に住所を有する20歳以上60歳未満の者は、原則として国民年金の被保険者となる。",
 w:[["被保険者","ひほけんしゃ","保険に入っていて、守られる人"]]},
{q:"国民年金の第3号被保険者（会社員の妻・夫で養ってもらっている人）は、自分で保険料を払う必要がない。",a:true,fig:"nenkin",
 exp:`<p>第3号被保険者は、会社員・公務員（第2号）に<b>養ってもらっている20歳以上60歳未満の配偶者</b>です。</p><p>保険料は、<mark>自分で払わなくてよい</mark>しくみになっています（配偶者が入っている厚生年金の制度全体で負担しています）。</p><p>反対に、自営業や学生などの<b>第1号は、自分で毎月の保険料を払います</b>。</p>`,
 pt:"第3号は保険料の自己負担なし／第1号は自分で払う",
 hon:"国民年金の第3号被保険者は、国民年金の保険料を自ら納付する必要はない。"},
{q:"老齢基礎年金（国民年金から老後にもらう年金）を受け取るには、保険料を納めた期間などが25年以上必要である。",a:false,
 exp:`<p>昔は25年必要でしたが、今は<mark>10年以上</mark>あればもらえます（受給資格期間）。</p><p>この10年には、保険料を払った期間のほか、<b>免除された期間</b>や<b>学生の納付特例の期間</b>なども数えられます。</p><p>ただし、もらえる金額は、<b>40年（480か月）きちんと払うと満額</b>。払った月が少ないと、そのぶん減ります。</p>`,
 pt:"老齢基礎年金の受給資格期間は10年以上。満額は40年（480か月）納付",
 hon:"老齢基礎年金の受給資格期間は、保険料納付済期間、保険料免除期間および合算対象期間を合計して10年以上である。"},
{q:"老齢基礎年金は原則65歳からもらうが、受け取りを遅らせる（繰下げ）と、1か月あたり0.4%ずつ年金が増える。",a:false,ha:true,ng:"繰下げは1か月<b>0.7%増</b>。0.4%は、繰上げ（早くもらう）で<b>減る</b>割合です。",fig:"kuriage",
 exp:`<p>年金は原則<b>65歳</b>から。でも、もらい始める時期を選べます。</p><p>・<b>繰上げ（早くもらう）</b>：60歳からOK。<mark>1か月早めるごとに0.4%減る</mark>（一生そのまま）。<br>・<b>繰下げ（遅くもらう）</b>：75歳まで遅らせられる。<mark>1か月遅らせるごとに0.7%増える</mark>。</p><p>75歳まで10年（120か月）遅らせると、0.7%×120＝<b>84%も増え</b>ます。</p>`,
 pt:"繰上げ：1か月0.4%減（最大24%減）／繰下げ：1か月0.7%増（最大84%増）",
 hon:"老齢基礎年金の繰下げ支給の増額率は、繰り下げた月数1か月当たり0.7%である。"},
{q:"国民年金の第1号被保険者が「付加年金（ふかねんきん）」に入ると、毎月200円を上乗せして払い、将来「400円×払った月数」が毎年の年金に上乗せされる。",a:false,ha:true,ng:"逆です。払うのが<b>月400円</b>、ふえるのが「<b>200円×払った月数</b>」です。",
 exp:`<p>付加年金は、自営業など<b>第1号被保険者だけ</b>が入れる、年金のおまけです。</p><p>毎月<mark>400円</mark>多く払うと、将来の年金が毎年<mark>200円×払った月数</mark>ふえます。</p><p>たとえば10年（120か月）払うと、払うのは 400×120＝4.8万円。もらえるのは毎年 200×120＝2.4万円。<b>2年もらえば元がとれる</b>おトクな制度です。</p><p>なお、国民年金基金に入っている人は付加年金には入れません。</p>`,
 pt:"付加年金：月400円払う → 年金が「200円×月数」ふえる（2年で元がとれる）",
 hon:"付加年金を受給できる者が受け取る付加年金の額は、200円に付加保険料納付済期間の月数を乗じて得た額である。"},
{q:"国民年金の「遺族基礎年金」は、子どもがいない妻でも受け取ることができる。",a:false,fig:"nenkin",
 exp:`<p>遺族基礎年金は、国民年金に入っていた人が亡くなったとき、<b>残された家族</b>がもらう年金です。</p><p>もらえるのは、<mark>「子のある配偶者」または「子」</mark>だけ。子どもがいない妻（夫）はもらえません。</p><p>ここでの「子」とは、<b>18歳になった年度の3月31日まで</b>の子（障害がある子は20歳未満）のことです。</p><p>会社員だった人の場合は、2階の<b>遺族厚生年金</b>なら子がいない配偶者ももらえます。</p>`,
 pt:"遺族基礎年金は「子のある配偶者」か「子」だけ",
 hon:"遺族基礎年金を受給することができる遺族は、国民年金の被保険者等の死亡の当時その者によって生計を維持されていた「子のある配偶者」または「子」である。"},
{q:"雇用保険の基本手当（失業手当）を受け取るには、原則として、やめる前の1年間に雇用保険に入っていた期間が通算6か月以上あればよい。",a:false,ha:true,ng:"原則は「やめる前の<b>2年間に12か月以上</b>」。「1年間に6か月以上」でよいのは、倒産・解雇など会社の都合でやめた人の場合です。",
 exp:`<p>会社をやめて次の仕事を探している間にもらえるのが<b>基本手当</b>です。</p><p>条件は原則、<mark>やめる前の2年間に、雇用保険に入っていた期間が12か月以上</mark>あること。</p><p>会社の倒産や解雇など<b>自分のせいでなくやめた場合</b>は、やめる前の1年間に6か月以上でOKです。</p><p>自分の都合でやめた場合は、すぐにはもらえず、<b>7日の待期のあと原則1か月</b>（2025年4月から）待ちます。</p>`,
 pt:"基本手当：原則「離職前2年間に被保険者期間12か月以上」",
 hon:"雇用保険の基本手当を受給するためには、原則として、離職の日以前2年間に被保険者期間が通算して12か月以上あることが必要である。"},
{q:"労災保険（労働者災害補償保険）の保険料は、会社と働く人が半分ずつ負担する。",a:false,
 exp:`<p>労災保険は、<b>仕事中や通勤中のけが・病気</b>を守る保険です。</p><p>保険料は<mark>会社（事業主）が全額</mark>払います。働く人の負担はゼロです。</p><p>また、正社員だけでなく、<b>パート・アルバイトも含めてすべての労働者</b>が対象です。</p><p>なお、労災の病院代は自己負担なし。健康保険は使いません。</p>`,
 pt:"労災保険料は事業主が全額負担。パート・アルバイトも対象",
 hon:"労働者災害補償保険の保険料は、その全額を事業主が負担する。"},
{q:"介護保険で、40歳以上65歳未満の人（第2号被保険者）が介護サービスを受けられるのは、老化が原因の特定の病気（特定疾病）で介護が必要になった場合に限られる。",a:true,
 exp:`<p>介護保険には<b>40歳から</b>入ります。</p><p>・<b>第1号</b>：65歳以上 → 原因を問わず、介護が必要と認められればサービスを受けられる<br>・<b>第2号</b>：40〜64歳 → <mark>がん（末期）や脳卒中など、老化が原因の特定の病気（特定疾病）のときだけ</mark></p><p>たとえば第2号の人が<b>交通事故</b>で介護が必要になっても、介護保険は使えません。</p><p>サービスを使うときの自己負担は原則1割です（所得が多い人は2割・3割）。</p>`,
 pt:"介護保険：第1号＝65歳以上／第2号＝40〜64歳（特定疾病のみ）",
 hon:"介護保険の第2号被保険者は、特定疾病が原因で要介護状態または要支援状態となった場合に限り、保険給付を受けることができる。"},
{q:"1か月の病院代の自己負担が高額になり、決められた上限額をこえた場合、こえた分があとで戻ってくる制度を「高額療養費制度」という。",a:true,
 exp:`<p>大きな病気で入院すると、3割負担でも何十万円にもなることがあります。</p><p>そこで、<mark>1か月（1日〜末日）の自己負担に上限</mark>が決められていて、こえた分は戻ってきます。これが高額療養費です。</p><p>上限額は、<b>年齢と収入</b>によって変わります。</p><p>注意：入院中の<b>食事代</b>や<b>差額ベッド代</b>（個室代など）は、計算に入りません。</p>`,
 pt:"高額療養費＝1か月の自己負担の上限をこえた分が戻る（食事代・差額ベッド代は対象外）",
 hon:"高額療養費の計算上、入院時の食事療養に係る標準負担額や差額ベッド代は、自己負担額に含まれない。"},
{q:"iDeCo（イデコ）で積み立てた掛金は、全額が所得控除の対象になり、所得税や住民税が安くなる。",a:true,
 exp:`<p>iDeCoは、<b>自分で掛金を出して、自分で運用し、老後に受け取る</b>年金です。</p><p>いちばんのメリットは税金。<mark>掛金が全額「小規模企業共済等掛金控除」になる</mark>ので、そのぶん所得税・住民税が安くなります。</p><p>さらに、運用でふえた利益にも税金がかかりません。</p><p>ただし、原則<b>60歳まで引き出せない</b>ので注意しましょう。</p>`,
 pt:"iDeCoの掛金は全額が所得控除（小規模企業共済等掛金控除）。原則60歳まで引き出せない",
 hon:"確定拠出年金の個人型年金の掛金は、その全額が小規模企業共済等掛金控除の対象となる。",
 w:[["所得控除","しょとくこうじょ","税金を計算する前のもうけから差し引ける金額。多いほど税金が安くなる"]]},
{q:"小規模企業共済は、個人事業主や小さな会社の社長が、やめるときのための「退職金」を自分で準備する制度である。",a:true,
 exp:`<p>会社員には会社から退職金が出ることがありますが、<b>個人事業主には退職金がありません</b>。</p><p>そこで、<mark>自分で積み立てて自分の退職金を作る</mark>のが小規模企業共済です。</p><p>掛金は<b>月1,000円〜7万円</b>で、iDeCoと同じく<b>全額が所得控除</b>になります。</p>`,
 pt:"小規模企業共済＝個人事業主などの退職金づくり。掛金は月1,000円〜7万円・全額所得控除",
 hon:"小規模企業共済の掛金は、月額1,000円から7万円までの範囲内で、500円単位で選択することができる。"}
].map(o=>Object.assign({g:3,c:"life"},o)));
/* 3級・risk */
Q.push(...[
{q:"保険は、みんなで少しずつお金（保険料）を出し合い、困ったことが起きた人にまとめて渡す「助け合い」のしくみである。",a:true,
 exp:`<p>保険のもとの考え方は<b>助け合い</b>です。</p><p>たくさんの人が少しずつ<mark>保険料</mark>を出し合い、病気・事故・死亡などで困った人に<mark>保険金</mark>を渡します。</p><p>保険の世界には、似た言葉がたくさん出てきます。下の「ことばメモ」で、まず登場人物を覚えましょう。</p>`,
 pt:"保険＝保険料を出し合い、困った人に保険金を払う助け合い",
 hon:"保険は、多数の者が保険料を拠出し、偶然の事故により損害を被った者に保険金を支払う相互扶助の仕組みである。",
 w:[["契約者","けいやくしゃ","保険会社と契約して、保険料を払う人"],["被保険者","ひほけんしゃ","その人に何かあったら保険金が出る、という対象の人"],["受取人","うけとりにん","保険金を受け取る人"]]},
{q:"生命保険会社が倒産したとき、生命保険契約者保護機構によって、原則として「責任準備金の80%」までが守られる。",a:false,ha:true,ng:"生命保険は、責任準備金の<b>90%</b>まで守られます。",
 exp:`<p>保険会社がつぶれても、お客さんの契約がすべてなくなるわけではありません。</p><p>生命保険の場合、<mark>責任準備金（保険会社が将来の支払いのために積み立てているお金）の90%</mark>までが守られます。</p><p>つまり、保険金が全額もらえるとは限らないということ。銀行の預金（1,000万円まで）とは守られ方がちがいます。</p>`,
 pt:"生命保険会社の破綻：責任準備金の90%まで補償",
 hon:"生命保険契約者保護機構による補償の対象となる保険契約は、原則として、破綻時点の責任準備金等の90%まで補償される。",
 w:[["責任準備金","せきにんじゅんびきん","保険会社が将来の保険金の支払いにそなえて積み立てているお金"]]},
{q:"生命保険の「定期保険」は、決められた期間内に亡くなると保険金が出る保険で、満期まで生きていれば、死亡保険金と同じ額の満期保険金が出る。",a:false,ha:true,ng:"定期保険には<b>満期保険金はありません</b>（掛け捨て）。死亡保険金と同じ額の満期保険金が出るのは「<b>養老保険</b>」です。",fig:"seiho",
 exp:`<p>生命保険の基本の形は3つです。</p><p>・<b>定期保険</b>：<mark>決まった期間だけ</mark>の保障。満期保険金なし。保険料が安い（いわゆる「掛け捨て」）<br>・<b>終身保険</b>：<b>一生涯</b>の保障。解約すると解約返戻金（かいやくへんれいきん）が戻る<br>・<b>養老保険</b>：期間内に亡くなれば死亡保険金、満期まで生きていれば<b>同じ額の満期保険金</b></p>`,
 pt:"定期＝一定期間・掛け捨て／終身＝一生涯／養老＝死亡保険金と満期保険金が同額",
 hon:"定期保険は、保険期間中に被保険者が死亡または高度障害状態になった場合に保険金が支払われ、満期保険金はない。"},
{q:"養老保険（ようろうほけん）は、期間中に亡くなった場合の死亡保険金と、満期まで生きていた場合の満期保険金が同じ金額である。",a:true,fig:"seiho",
 exp:`<p>養老保険は「<b>死んでも生きてもお金が出る</b>」保険です。</p><p>期間中に亡くなれば死亡保険金、満期まで生きていれば満期保険金。<mark>どちらも同じ金額</mark>です。</p><p>そのぶん、保険料は定期保険よりずっと高くなります。貯金のような性格があります。</p>`,
 pt:"養老保険：死亡保険金＝満期保険金（同額）",
 hon:"養老保険は、被保険者が保険期間中に死亡した場合には死亡保険金が支払われ、満期まで生存した場合には死亡保険金と同額の満期保険金が支払われる。"},
{q:"収入保障保険の死亡保険金を一括（一度にまとめて）で受け取ると、年金形式（分けて）受け取る場合よりも、受け取る合計額は多くなる。",a:false,ha:true,ng:"一括で受け取ると、受取総額は年金形式より<b>少なく</b>なります。",fig:"seiho",
 exp:`<p>収入保障保険は、お父さん・お母さんが亡くなったとき、<b>毎月のお給料の代わり</b>に保険金を受け取る保険です。</p><p>期間が進むほど「残りの受取期間」が短くなるので、<mark>受け取れる合計額はだんだん減って</mark>いきます。そのぶん保険料は安めです。</p><p>一括（まとめて）受け取ることもできますが、その場合は<b>分けて受け取るより合計額が少なく</b>なります。</p>`,
 pt:"収入保障保険：年金形式で受け取る。一括受取にすると総額は少なくなる",
 hon:"収入保障保険の死亡保険金を一時金で受け取る場合の受取額は、一般に、年金形式で受け取る場合の受取総額よりも少なくなる。"},
{q:"生命保険の契約をやめたいとき、契約した日から20日以内なら「クーリング・オフ」で、申し込みを取り消せる。",a:false,ha:true,ng:"生命保険のクーリング・オフは<b>8日以内</b>（申込日か書面を受け取った日の遅いほうから）です。",
 exp:`<p>クーリング・オフは、<b>頭を冷やして考え直す</b>ための制度です。</p><p>生命保険の場合、<mark>申し込んだ日または書面を受け取った日の、遅いほうから8日以内</mark>なら取り消せます。</p><p>方法は<b>書面</b>か<b>電磁的方法（メールやWebなど）</b>。電話だけではダメです。</p><p>ただし、保険期間が1年以内の契約や、医師の診査が終わった後などはできません。</p>`,
 pt:"保険のクーリング・オフ：8日以内・書面または電磁的方法",
 hon:"生命保険契約の申込者は、契約の申込日または契約申込みの撤回等に関する事項を記載した書面の交付日のいずれか遅い日を含めて8日以内であれば、書面または電磁的方法により申込みの撤回等をすることができる。"},
{q:"保険料を払わずに払込猶予期間（はらいこみゆうよきかん）が過ぎると契約は「失効」するが、一定期間内なら手続きをして元にもどす「復活」ができる場合がある。",a:true,
 exp:`<p>保険料を払い忘れても、すぐに契約がなくなるわけではありません。<b>払込猶予期間</b>という待ってもらえる期間があります。</p><p>それも過ぎると契約は<mark>失効（しっこう）</mark>＝効力がなくなります。</p><p>でも、失効から一定期間（多くは3年）内なら、たまっている保険料を払い、もう一度健康状態を告知すれば<mark>復活</mark>できます。保険料は<b>失効前と同じ</b>です。</p>`,
 pt:"失効しても一定期間内なら「復活」できる（保険料は元のまま。告知・診査が必要）",
 hon:"失効した生命保険契約を復活させる場合、延滞保険料を払い込む必要があり、保険料率は失効前の保険料率が適用される。"},
{q:"保険料の払込みをやめて、そのときの解約返戻金で、保険金額はそのままに保険期間を短くする方法を「払済保険（はらいずみほけん）」という。",a:false,ha:true,ng:"保険金額はそのまま・期間が短くなるのは「<b>延長保険</b>」。払済保険は、期間はそのまま・<b>保険金額が小さく</b>なります。",
 exp:`<p>保険料を払うのをやめても、保障を残す方法が2つあります。</p><p>・<b>払済保険</b>：<mark>保険期間はそのまま、保険金額が小さく</mark>なる<br>・<b>延長保険</b>：<b>保険金額はそのまま、保険期間が短く</b>なる（定期保険に変わる）</p><p>どちらも、それまでについていた<b>特約（おまけの保障）はなくなる</b>のがふつうです。</p>`,
 pt:"払済＝期間そのまま・金額が小さく／延長＝金額そのまま・期間が短く",
 hon:"払済保険とは、保険料の払込みを中止して、その時点の解約返戻金をもとに、元の契約の保険期間を変えずに保障額の少ない保険に変更するものである。"},
{q:"生命保険料控除（2012年以後の契約）は、一般・介護医療・個人年金の3つで、所得税ではそれぞれ最高5万円、合計で最高15万円である。",a:false,ha:true,ng:"2012年以後の契約は、所得税で<b>各4万円・合計12万円</b>まで。「各5万円・合計10万円」は2011年以前の古い契約のルールです。",
 exp:`<p>生命保険料を払うと、そのぶん税金が安くなる<b>生命保険料控除</b>があります。</p><p>2012年以後の新しい契約では3つの枠があり、<mark>所得税はそれぞれ最高4万円・合計12万円</mark>まで差し引けます。</p><p>住民税は、それぞれ最高2.8万円・合計<b>7万円</b>です。</p>`,
 pt:"生命保険料控除：所得税 各4万円・合計12万円／住民税 各2.8万円・合計7万円",
 hon:"2012年1月1日以後に締結した保険契約に係る生命保険料控除の控除限度額は、所得税では、一般・介護医療・個人年金の各4万円、合計12万円である。"},
{q:"契約者（保険料を払う人）と被保険者が夫、死亡保険金の受取人が妻の場合、夫が亡くなって妻が受け取る死亡保険金には「相続税」がかかる。",a:true,fig:"hokenTax",
 exp:`<p>死亡保険金にどの税金がかかるかは、<b>「誰がお金（保険料）を出して、誰がもらったか」</b>で決まります。</p><p>・契約者＝被保険者（夫が自分に保険をかけて亡くなった）→ <mark>相続税</mark><br>・契約者＝受取人（自分で払って自分がもらう）→ <b>所得税・住民税</b>（一時所得）<br>・3人とも別の人 → <b>贈与税</b></p><p>夫のお金で夫の命に保険をかけた → 夫の財産が残された家族に移る → 相続税、と考えます。</p>`,
 pt:"契約者＝被保険者 → 相続税／契約者＝受取人 → 所得税／三者別 → 贈与税",
 hon:"契約者（＝保険料負担者）および被保険者が夫、死亡保険金受取人が妻である生命保険契約において、妻が受け取った死亡保険金は相続税の課税対象となる。"},
{q:"病気で入院したときに受け取る入院給付金は、所得税がかからない（非課税）。",a:true,fig:"hokenTax",
 exp:`<p>病気やけがのときに受け取る<b>入院給付金・手術給付金・通院給付金</b>には、<mark>税金がかかりません（非課税）</mark>。</p><p>体の治療のためのお金にまで税金をかけるのはかわいそう、という考え方です。</p><p>がんと診断されたときの<b>診断給付金</b>や、高度障害保険金、リビング・ニーズ特約の保険金なども非課税です。</p>`,
 pt:"入院・手術・通院給付金、診断給付金、高度障害保険金などは非課税",
 hon:"被保険者が受け取る入院給付金や手術給付金は、非課税である。"},
{q:"リビング・ニーズ特約は、余命1年以内と診断されたとき、死亡保険金の一部または全部を生きているうちに受け取れる特約である。",a:false,ha:true,ng:"リビング・ニーズ特約は「余命<b>6か月</b>以内」と判断されたときに受け取れます。",
 exp:`<p>重い病気で<mark>余命6か月以内</mark>と言われたとき、死亡保険金を<b>前もって受け取れる</b>のがリビング・ニーズ特約です。</p><p>受け取ったお金で、治療や家族との時間に使えます。</p><p>この特約は<b>保険料が無料</b>でつけられるのがふつう。受け取ったお金は<b>非課税</b>です。</p>`,
 pt:"リビング・ニーズ特約：余命6か月以内で死亡保険金を前払い。特約保険料は不要・非課税",
 hon:"リビング・ニーズ特約は、被保険者の余命が6か月以内と判断された場合に、所定の範囲内で死亡保険金の全部または一部を受け取ることができる特約であり、特約保険料は不要である。"},
{q:"先進医療特約では、先進医療を受けたときの「技術料」が保障されるが、その先進医療は「契約したときに」先進医療とされていた治療に限られる。",a:false,
 exp:`<p>先進医療とは、国が認めた新しい治療のことです。健康保険がきかないので、<b>技術料は全額自己負担</b>になります（数百万円になることも）。</p><p>先進医療特約は、その技術料を保障してくれます。</p><p>対象になるのは、<mark>治療を受けた「時点」で先進医療とされているもの</mark>。契約したときではありません。先進医療のリストは入れ替わるからです。</p>`,
 pt:"先進医療特約の対象は「療養を受けた時点」で先進医療とされているもの",
 hon:"先進医療特約で保障の対象となる先進医療は、療養を受けた時点において厚生労働大臣が承認しているものである。"},
{q:"「失火責任法（しっかせきにんほう）」により、うっかり（軽い過失で）自分の家から火事を出して隣の家を燃やしても、原則として隣の家に損害賠償をしなくてよい。",a:true,
 exp:`<p>日本は木造の家が多く、もらい火で大きな被害になることがあります。そこで昔から、<mark>軽いうっかり（軽過失）の火事なら、隣の家への賠償責任はない</mark>というルールがあります。</p><p>ただし、<b>重大な過失</b>（寝たばこ、天ぷら油を火にかけたまま外出など）や、わざとの場合は賠償しなければなりません。</p><p>だから、<b>自分の家は自分の火災保険で守る</b>のが大切です。</p><p>また、<b>借りている部屋</b>を燃やした場合は、大家さんには返す約束（契約）を守れないので賠償責任があります。</p>`,
 pt:"軽過失の失火 → 隣家への賠償責任なし（重過失は責任あり）。借家の大家さんへは責任あり",
 hon:"失火責任法によれば、軽過失により隣家を焼失させた場合、隣家に対して損害賠償責任を負わない。"},
{q:"地震保険は、火災保険とは別に、地震保険だけで単独で入ることができる。",a:false,ha:true,ng:"地震保険は<b>単独では入れません</b>。必ず<b>火災保険とセット</b>で入ります（保険金額は火災保険の30〜50%）。",
 exp:`<p>火災保険だけでは、<b>地震・噴火・津波が原因の火事や倒壊</b>は補償されません。そのための保険が<b>地震保険</b>です。</p><p>・<mark>火災保険とセットで入る</mark>（単独では入れない）<br>・保険金額：<mark>火災保険の30〜50%</mark><br>・上限：<b>建物5,000万円、家財1,000万円</b></p><p>地震保険は、国と保険会社が共同で運営しているので、どの保険会社で入っても<b>保険料は同じ</b>です。</p>`,
 pt:"地震保険：火災保険に付帯・30〜50%・建物5,000万円/家財1,000万円まで",
 hon:"地震保険の保険金額は、主契約である火災保険の保険金額の30%から50%の範囲内で設定し、建物は5,000万円、家財は1,000万円が上限となる。"},
{q:"自動車損害賠償責任保険（自賠責保険）では、事故で相手の車をこわしたときの修理代（物の損害）も補償される。",a:false,
 exp:`<p>自賠責保険は、車やバイクを持つ人が<b>必ず入らなければならない</b>保険（強制保険）です。</p><p>補償されるのは<mark>人の死亡やけが（対人賠償）だけ</mark>。相手の車の修理代（対物）や、自分のけがは対象外です。</p><p>上限は、死亡<b>3,000万円</b>、後遺障害<b>4,000万円</b>（常に介護が必要な場合）、けが<b>120万円</b>（被害者1人あたり）。</p><p>足りない分や物の損害は、<b>任意の自動車保険</b>でカバーします。</p>`,
 pt:"自賠責保険は対人賠償のみ（死亡3,000万円・後遺障害最高4,000万円・傷害120万円）",
 hon:"自動車損害賠償責任保険は、対人賠償事故のみを補償の対象とし、死亡による損害の支払限度額は被害者1人につき3,000万円である。"},
{q:"任意の自動車保険の「対人賠償保険」は、自分が運転する車の事故で、自分の家族（配偶者・子・親）がけがをした場合も補償される。",a:false,
 exp:`<p>対人賠償保険は、<b>他人</b>をケガさせたり死なせたりしたときに、相手への賠償に使う保険です。</p><p>運転していた人の<mark>配偶者・親・子</mark>は「他人」ではないので、<b>対人賠償の対象外</b>です。</p><p>家族のケガには、<b>人身傷害補償保険</b>や<b>搭乗者傷害保険</b>で備えます。</p><p>なお、兄弟姉妹や友人は対人賠償の対象になります。</p>`,
 pt:"対人賠償は、運転者本人・その配偶者・父母・子のけがは対象外",
 hon:"自動車保険の対人賠償保険では、被保険自動車の運転者の配偶者や子が死傷した場合は、補償の対象とならない。"},
{q:"人身傷害補償保険は、自分や同乗者がけがをしたとき、自分の過失（自分が悪かった割合）の分も含めて、損害額が補償される。",a:true,
 exp:`<p>事故では、相手と自分の<b>悪かった割合（過失割合）</b>で賠償額が決まります。自分も悪い場合、その分は相手からもらえません。</p><p>人身傷害補償保険なら、<mark>自分の過失の分も含めて、実際の損害額を補償</mark>してもらえます。しかも、示談（話し合い）が終わるのを待たずに受け取れます。</p>`,
 pt:"人身傷害補償保険：自分の過失分も含めて損害額を補償",
 hon:"人身傷害補償保険では、被保険者が自動車事故により死傷した場合、自己の過失部分を含めた損害額が保険金額の範囲内で補償される。"},
{q:"個人賠償責任保険は、自転車で人にけがをさせた事故の賠償は補償するが、自動車の運転中の事故は補償しない。",a:true,
 exp:`<p>個人賠償責任保険は、<b>日常生活でうっかり他人にケガをさせたり、物をこわしたり</b>したときの賠償に使える保険です。</p><p>例：自転車で歩行者にぶつかった、ベランダから物を落とした、マンションで水もれさせた…など。</p><p>でも、<mark>自動車の事故は対象外</mark>（自動車保険で備える）。<b>仕事中の事故</b>や、<b>人から借りた物</b>をこわした場合も対象外です。</p><p>家族全員が補償されるタイプが多く、保険料も安いのが特ちょうです。</p>`,
 pt:"個人賠償責任保険：日常生活の賠償（自転車OK）。自動車事故・業務中・借りた物は対象外",
 hon:"個人賠償責任保険では、被保険者が自転車を運転中に歩行者に接触してけがを負わせた場合の損害賠償責任は補償の対象となるが、自動車の運転による事故は対象とならない。"},
{q:"地震保険料控除の最高額は、所得税で10万円、住民税で5万円である。",a:false,ha:true,ng:"地震保険料控除は、所得税<b>5万円</b>・住民税<b>2.5万円</b>が最高です。",
 exp:`<p>地震保険の保険料を払うと、<b>地震保険料控除</b>で税金が安くなります。</p><p>最高額は<mark>所得税5万円、住民税2.5万円</mark>。</p><p>注意：<b>火災保険の保険料は控除の対象外</b>です（地震保険の分だけ）。</p>`,
 pt:"地震保険料控除：所得税 最高5万円／住民税 最高2.5万円（火災保険料は対象外）",
 hon:"地震保険料控除の控除限度額は、所得税では5万円、住民税では2万5,000円である。"},
{q:"火事で家が焼けて受け取った火災保険の保険金には、所得税がかからない（非課税）。",a:true,fig:"hokenTax",
 exp:`<p>損害保険の保険金は、<b>なくなった物の穴うめ</b>です。もうけたわけではないので、<mark>税金はかかりません（非課税）</mark>。</p><p>火災保険の保険金、自動車保険で受け取った<b>賠償金</b>（相手からの）、ケガの保険金なども非課税です。</p><p>ただし、<b>積立型の損害保険の満期返戻金</b>は「もうけ」になるので、一時所得として所得税がかかります。</p>`,
 pt:"損害の穴うめの保険金は非課税。積立型の満期返戻金は一時所得",
 hon:"個人が自宅の火災により受け取った火災保険の保険金は、非課税となる。"},
{q:"がん保険には、契約してから一定期間（一般に90日間）は、がんと診断されても保障されない「免責期間（待ち期間）」がある。",a:true,
 exp:`<p>がん保険は、病気やケガ全般ではなく<b>がんに特化</b>した保険です。</p><p>多くのがん保険には、<mark>契約してから約3か月（90日）、保障が始まらない期間</mark>があります。体調に不安がある人が、駆けこみで入るのをふせぐためです。</p><p>また、がん保険の<b>入院給付金は日数無制限</b>のものが多いのも特ちょうです。</p>`,
 pt:"がん保険：90日程度の免責期間あり。入院給付金の日数は無制限が多い",
 hon:"がん保険では、一般に、責任開始日前に90日程度の免責期間が設けられている。"},
{q:"ケガや病気にそなえる「第三分野の保険」には、医療保険・がん保険・介護保険などがある。",a:true,
 exp:`<p>保険は3つのグループに分かれます。</p><p>・<b>第一分野</b>：人の生死（生命保険会社）＝ 終身保険・定期保険など<br>・<b>第二分野</b>：物の損害（損害保険会社）＝ 火災保険・自動車保険など<br>・<mark>第三分野</mark>：その中間 ＝ <b>医療保険・がん保険・介護保険・傷害保険</b>など</p><p>第三分野は、<b>生命保険会社も損害保険会社も</b>売ることができます。</p>`,
 pt:"第三分野＝医療・がん・介護・傷害保険など（生保も損保も扱える）",
 hon:"医療保険やがん保険などの第三分野の保険は、生命保険会社と損害保険会社のいずれも引き受けることができる。"},
{q:"普通傷害保険（ふつうしょうがいほけん）では、細菌性食中毒やウイルス性食中毒は、原則として補償の対象外である。",a:true,
 exp:`<p>傷害保険は、<b>「急に・たまたま・外から」</b>起きたケガを補償する保険です（急激・偶然・外来）。</p><p>食中毒は「外からの事故によるケガ」ではないので、<mark>普通傷害保険では対象外</mark>です。また、<b>地震・噴火・津波</b>によるケガも対象外です。</p><p>ただし、旅行中のケガを補償する<b>国内旅行傷害保険</b>では、細菌性食中毒も補償されます。</p>`,
 pt:"普通傷害保険：食中毒・地震によるケガは対象外（国内旅行傷害保険なら食中毒OK）",
 hon:"普通傷害保険では、細菌性食中毒は補償の対象とならない。",
 w:[["急激・偶然・外来","きゅうげき・ぐうぜん・がいらい","急に、たまたま、体の外からの原因で起きること。傷害保険の3つの条件"]]},
{q:"銀行の窓口で入った生命保険は、銀行の預金と同じく、預金保険制度で1,000万円まで守られる。",a:false,ha:true,ng:"銀行窓口で入っても、契約の相手は保険会社。守るのは<b>生命保険契約者保護機構</b>で、預金保険制度ではありません。",
 exp:`<p>銀行で保険に入っても、契約の相手は<b>保険会社</b>です。銀行は窓口になっているだけです。</p><p>だから補償は、銀行の預金保険（1,000万円まで）ではなく、<mark>生命保険契約者保護機構</mark>が受け持ちます。</p><p>同じように、少額短期保険業者（ミニ保険）や共済は、保険契約者保護機構の対象外なので注意しましょう。</p>`,
 pt:"銀行窓口で入った保険も、補償するのは保険契約者保護機構（預金保険ではない）",
 hon:"銀行の窓口で加入した生命保険契約は、預金保険制度ではなく、生命保険契約者保護機構の補償の対象となる。"},
{q:"必要保障額（もしものときに必要な死亡保障の額）は、「遺族に必要なお金の合計」から「遺族が受け取れるお金や貯金の合計」を引いて求める。",a:true,
 exp:`<p>生命保険にいくら入ればいいかは、<b>必要保障額</b>で考えます。</p><p><mark>必要保障額 ＝ 遺族の支出の合計 － 遺族の収入（遺族年金・貯金など）の合計</mark></p><p>子どもが小さいほど、これから必要なお金が多いので、必要保障額は大きくなります。子どもが大きくなるにつれ、<b>必要保障額は少しずつ減って</b>いきます。</p><p>住宅ローンを団体信用生命保険（団信）つきで借りている場合、亡くなるとローンがなくなるので、その分は支出に入れません。</p>`,
 pt:"必要保障額 ＝ 遺族の支出総額 － 遺族の収入総額（子が成長するほど減る）",
 hon:"必要保障額は、遺族に必要な生活資金等の総額から、遺族の収入見込額の総額を差し引いて算出する。",
 w:[["団体信用生命保険","だんたいしんようせいめいほけん","住宅ローンを借りた人が亡くなったら、残りのローンを保険で返してくれるしくみ。略して団信"]]}
].map(o=>Object.assign({g:3,c:"risk"},o)));

Q.push(...[
{q:"GDP（国内総生産）は、日本銀行が調べて発表している。",a:false,ha:true,ng:"GDPを発表しているのは<b>内閣府</b>です。",
 exp:`<p>GDPは、<b>国の経済の大きさ</b>を表す数字です。</p><p>日本の中で、1年（または3か月）の間に<mark>新しく生み出されたもうけ（付加価値）の合計</mark>です。発表しているのは<b>内閣府</b>です。</p><p>GDPが前の期よりどれだけ増えたかの割合を<b>経済成長率</b>といいます。物価の影響を取り除いたものを「実質」、取り除かないものを「名目」といいます。</p>`,
 pt:"GDP＝国内で生み出された付加価値の合計（内閣府が発表）",
 hon:"国内総生産（GDP）は、一定期間内に国内で生産された財やサービスの付加価値の合計額であり、内閣府が公表している。",
 w:[["付加価値","ふかかち","新しく生まれた価値。売った値段から材料代などを引いたもうけ"]]},
{q:"景気動向指数のCI（コンポジット・インデックス）の一致指数が上がっているときは、景気が良くなっている（拡張している）と考える。",a:true,
 exp:`<p>景気動向指数は、景気の様子を数字で表すもので、<b>内閣府</b>が発表しています。</p><p>指標は3種類：<b>先行指数</b>（景気より先に動く）、<mark>一致指数（景気と同時に動く）</mark>、<b>遅行指数</b>（あとから動く）。</p><p>CIは景気の<b>強さ・勢い</b>を見るもの。<mark>一致指数が上がっていれば景気は拡張中</mark>です。</p><p>DI（ディフュージョン・インデックス）は景気の<b>方向</b>を見るもので、一致指数が<b>50%を上回る</b>と景気拡張とみます。</p>`,
 pt:"CI一致指数が上昇 → 景気拡張。DIは50%超で拡張",
 hon:"景気動向指数のコンポジット・インデックス（CI）は、主に景気変動の大きさやテンポを把握することを目的としており、一致指数の上昇は景気の拡張局面を示す。"},
{q:"日銀短観（全国企業短期経済観測調査）は、日本銀行が企業に景気の感じ方などをアンケートした調査である。",a:true,
 exp:`<p>日銀短観は、<b>日本銀行</b>が<mark>約1万社の企業にアンケート</mark>して、景気をどう感じているかなどを調べたものです。年に4回発表されます。</p><p>いちばん注目されるのは<b>業況判断DI</b>。「景気が良い」と答えた会社の割合 －「悪い」と答えた割合 で計算します。</p>`,
 pt:"日銀短観＝日本銀行が企業にアンケート（年4回）。業況判断DIに注目",
 hon:"全国企業短期経済観測調査（日銀短観）は、日本銀行が企業を対象に四半期ごとに実施するアンケート調査である。"},
{q:"消費者物価指数（CPI）は、日本銀行が発表している。",a:false,ha:true,ng:"消費者物価指数は<b>総務省</b>。日本銀行が発表するのは「<b>企業物価指数</b>」です。",
 exp:`<p>物価を表す指数は2つ覚えましょう。</p><p>・<mark>消費者物価指数（CPI）</mark>：私たち<b>消費者が買う</b>モノやサービスの値段の動き → <b>総務省</b>が発表<br>・<b>企業物価指数</b>：<b>企業どうし</b>で取引するモノの値段の動き → <b>日本銀行</b>が発表</p><p>企業物価指数は、原油などの影響を受けやすく、消費者物価指数より<b>動きが大きい</b>のが特ちょうです。</p>`,
 pt:"消費者物価指数＝総務省／企業物価指数＝日本銀行",
 hon:"消費者物価指数は、全国の世帯が購入する財およびサービスの価格等を総合した物価の変動を時系列的に測定したものであり、総務省が公表している。"},
{q:"日本銀行が「売りオペレーション（売りオペ）」を行うと、世の中に出回るお金が増え、金利は下がりやすくなる。",a:false,ha:true,ng:"売りオペはお金を<b>吸い上げる</b>ので、お金が減り、金利は<b>上がり</b>やすくなります。お金を増やすのは「買いオペ」です。",
 exp:`<p>日本銀行は、世の中に出回るお金の量を調整して、景気や物価を安定させます（<b>金融政策</b>）。</p><p>・<mark>買いオペ</mark>：日銀が銀行から国債などを<b>買う</b> → 代金のお金が世の中に出る → お金が増える → <b>金利が下がる</b>（景気を良くしたいとき）<br>・<b>売りオペ</b>：日銀が国債などを<b>売る</b> → お金を吸い上げる → <b>金利が上がる</b>（景気の過熱をおさえたいとき）</p>`,
 pt:"買いオペ → お金が増える → 金利低下／売りオペ → お金が減る → 金利上昇",
 hon:"日本銀行が買いオペレーションを行うと、市中の資金量が増加し、市場金利は低下しやすくなる。"},
{q:"一般に、金利が上がると、すでに発行されている債券の値段（価格）も上がる。",a:false,ha:true,ng:"金利と債券価格は<b>逆</b>に動きます。金利が上がると債券価格は<b>下がり</b>ます。",
 exp:`<p>債券（さいけん）は、国や会社にお金を貸して、<b>利息（利子）</b>をもらう「借用証書」のようなものです。</p><p>たとえば、利率1%の債券を持っているとき、世の中の金利が3%に上がったら…あとから出る債券は3%もらえます。<b>1%の古い債券は人気がなくなり、値段が下がります</b>。</p><p>つまり<mark>金利↑なら債券価格↓、金利↓なら債券価格↑</mark>。シーソーのような関係です。</p>`,
 pt:"金利と債券価格は逆に動く（シーソー）",
 hon:"一般に、市場金利が上昇すると、既発債券の価格は下落する。",
 w:[["債券","さいけん","国や会社がお金を借りるときに発行する証書。決まった利息がもらえ、満期にお金が返る"]]},
{q:"債券の格付けで「BB（ダブルB）」以上のものは「投資適格債」と呼ばれる。",a:false,ha:true,ng:"投資適格債は「<b>BBB（トリプルB）以上</b>」。BB以下は投機的格付債（ハイ・イールド債）です。",
 exp:`<p>格付けは、お金を貸した相手が<b>ちゃんと返してくれるか</b>（信用度）を、専門の会社がA・B・Cなどの記号で表したものです。</p><p><mark>BBB以上 → 投資適格債</mark>（返してもらえる可能性が高い）<br><b>BB以下 → 投機的格付債</b>（ハイ・イールド債・ジャンク債とも）</p><p>格付けが低い債券は、返してもらえない危険（<b>信用リスク</b>）が高いぶん、<b>利回りが高く</b>なります。</p>`,
 pt:"BBB以上＝投資適格債／BB以下＝投機的（利回りは高い）",
 hon:"一般に、BBB（トリプルB）格相当以上の格付けが付された債券は、投資適格債とされる。"},
{q:"債券の発行時の利回り計算で、額面100円、利率2%、購入価格98円、期間5年の債券を満期まで持つと、利回りは約2.45%である。",a:true,
 exp:`<p>利回りは、<b>1年あたり、払ったお金に対して何%もうかるか</b>です。</p><p>計算の手順：<br>① 1年の利息：100円×2%＝<b>2円</b><br>② 1年あたりの差益：(100円−98円)÷5年＝<b>0.4円</b><br>③ 1年のもうけ合計：2＋0.4＝<b>2.4円</b><br>④ 買った値段で割る：2.4÷98×100＝<mark>約2.45%</mark></p><p>式でまとめると：<b>｛利率＋(額面−買値)÷年数｝÷買値×100</b></p>`,
 pt:"利回り（%）＝｛利率＋(額面−買値)÷年数｝÷買値×100",
 hon:"表面利率2%、残存期間5年の固定利付債券を額面100円当たり98円で購入した場合の最終利回り（単利・年率）は、約2.45%である。"},
{q:"株式のPER（株価収益率）は、「株価 ÷ 1株あたり純資産」で計算する。",a:false,ha:true,ng:"「株価÷1株あたり純資産」は<b>PBR</b>。PERは「株価÷<b>1株あたり純利益</b>」です。",fig:"kabu",
 exp:`<p>PERは、<b>株価が「会社のもうけ」の何倍か</b>を表します。</p><p><mark>PER ＝ 株価 ÷ 1株あたり純利益（EPS）</mark></p><p>たとえば株価1,000円、1株のもうけが50円なら、1,000÷50＝<b>20倍</b>。</p><p>同じ業種の会社とくらべて、<b>PERが低いほど「もうけのわりに株価が安い（割安）」</b>と考えます。</p>`,
 pt:"PER＝株価÷1株あたり純利益（低いほど割安）",
 hon:"株価収益率（PER）は、株価を1株当たり純利益で除して算出し、一般に、PERが低いほど株価は割安と判断される。"},
{q:"PBR（株価純資産倍率）は「株価 ÷ 1株あたり純資産（BPS）」で計算し、1倍を下回ると、株価が会社の解散価値より安いといえる。",a:true,fig:"kabu",
 exp:`<p>純資産とは、会社の財産から借金を引いた、<b>会社が本当に持っている財産</b>です。会社をたたんで分けたときの価値（解散価値）とも考えられます。</p><p><mark>PBR ＝ 株価 ÷ 1株あたり純資産（BPS）</mark></p><p>PBRが<b>1倍より低い</b>と、株価が解散価値より安い＝<b>割安</b>と考えます。</p>`,
 pt:"PBR＝株価÷1株あたり純資産（1倍割れは割安）",
 hon:"株価純資産倍率（PBR）は、株価を1株当たり純資産で除して算出し、PBRが1倍を下回る場合、株価は解散価値を下回っているとされる。"},
{q:"ROE（自己資本利益率）は「当期純利益 ÷ 自己資本 × 100」で計算し、株主のお金を使ってどれだけ効率よくもうけたかを表す。",a:true,fig:"kabu",
 exp:`<p>自己資本は、株主が出したお金などの、<b>会社が返さなくてよいお金</b>です。</p><p><mark>ROE ＝ 当期純利益 ÷ 自己資本 × 100（%）</mark></p><p>ROEが<b>高いほど</b>、株主のお金で上手にかせいでいる会社、といえます。</p>`,
 pt:"ROE（%）＝当期純利益÷自己資本×100（高いほど効率よくもうけている）",
 hon:"自己資本利益率（ROE）は、当期純利益を自己資本で除して求められ、株主の資本を使って効率的に利益を上げているかを示す指標である。"},
{q:"配当利回り（%）は「1株あたりの年間配当金 ÷ 株価 × 100」で計算する。",a:true,fig:"kabu",
 exp:`<p>配当（はいとう）は、会社がもうけの一部を株主に配るお金です。</p><p><mark>配当利回り ＝ 1株配当 ÷ 株価 × 100</mark><br>例：株価2,000円で配当が年50円なら、50÷2,000×100＝<b>2.5%</b>。</p><p>似た言葉の<b>配当性向（はいとうせいこう）</b>は、もうけのうちどれだけを配当に回したか（配当÷純利益×100）。区別しましょう。</p>`,
 pt:"配当利回り＝1株配当÷株価×100／配当性向＝配当÷純利益×100",
 hon:"配当利回りは、1株当たり年間配当金を株価で除して算出する。"},
{q:"日経平均株価は、東京証券取引所プライム市場に上場している銘柄のうち、代表的な225銘柄から計算する株価指数である。",a:true,
 exp:`<p>株価指数は、株式市場全体の調子を表す数字です。</p><p>・<mark>日経平均株価</mark>：プライム市場の<b>代表的な225銘柄</b>の株価をもとに計算。株価が高い（値がさ株）銘柄の影響を受けやすい。<br>・<b>TOPIX（東証株価指数）</b>：東京証券取引所に上場している<b>幅広い銘柄の時価総額</b>をもとに計算。時価総額が大きい会社の影響を受けやすい。</p>`,
 pt:"日経平均＝225銘柄の株価から計算／TOPIX＝時価総額の加重平均",
 hon:"日経平均株価は、東京証券取引所プライム市場に上場している銘柄のうち、代表的な225銘柄を対象とした株価指数である。"},
{q:"国内の上場株式を売買したとき、代金を受け渡しするのは、売買が成立した日（約定日）から数えて5営業日目である。",a:false,ha:true,ng:"受渡日は、約定日を含めて<b>3営業日目</b>です。",
 exp:`<p>株を買う注文が成立した日を<b>約定日（やくじょうび）</b>といいます。</p><p>お金と株を実際にやりとりする<b>受渡日（うけわたしび）</b>は、<mark>約定日を含めて3営業日目</mark>です（土日・祝日は数えない）。</p><p>例：月曜日に買ったら、受渡しは水曜日。</p><p>配当や株主優待をもらうには、<b>権利確定日に受渡しが済んでいる</b>必要があるので、その2営業日前（権利付き最終日）までに買う必要があります。</p>`,
 pt:"上場株式の受渡日＝約定日を含めて3営業日目",
 hon:"国内上場株式の普通取引の受渡しは、約定日から起算して3営業日目に行われる。"},
{q:"株の注文方法で、「指値注文（さしねちゅうもん）」は、値段を指定せずに買う（売る）注文のことである。",a:false,
 exp:`<p>株の注文は2種類です。</p><p>・<mark>指値注文</mark>：「1,000円以下なら買う」のように<b>値段を指定</b>する注文<br>・<b>成行注文（なりゆきちゅうもん）</b>：値段を<b>指定しない</b>注文。すぐに売買が成立しやすい</p><p>成行注文は指値注文より<b>優先</b>して売買が成立します（成行優先の原則）。</p>`,
 pt:"指値＝値段を指定／成行＝値段を指定しない（成行が優先）",
 hon:"成行注文は、指値注文に優先して売買が成立する。"},
{q:"投資信託（とうししんたく）は、たくさんの投資家から集めたお金を、運用の専門家がまとめて株や債券などに投資する商品である。",a:true,
 exp:`<p>投資信託は、<b>「みんなのお金を集めて、プロが運用する」</b>しくみです。ファンドともいいます。</p><p>少ないお金から始められ、たくさんの銘柄に<b>分散投資</b>できるのが良いところ。</p><p>ただし、<mark>元本は保証されません</mark>。値下がりして損をすることもあります。</p><p>かかる費用は主に、買うときの<b>購入時手数料</b>、持っている間ずっとかかる<b>運用管理費用（信託報酬）</b>、売るときの<b>信託財産留保額</b>です。</p>`,
 pt:"投資信託＝集めたお金をプロが運用。元本保証なし。保有中は信託報酬がかかる",
 hon:"投資信託の運用管理費用（信託報酬）は、投資信託を保有している期間中、信託財産から継続的に差し引かれる。"},
{q:"「インデックス型（パッシブ型）」の投資信託は、日経平均株価などの指数（ベンチマーク）を上回る成績をめざして運用する。",a:false,
 exp:`<p>投資信託の運用方法は2種類です。</p><p>・<mark>パッシブ型（インデックス型）</mark>：日経平均などの指数と<b>同じような動き</b>をめざす。手数料が安め。<br>・<b>アクティブ型</b>：指数を<b>上回る</b>成績をめざす。プロが銘柄を選ぶので手数料は高め。</p><p>アクティブ型の銘柄の選び方には、<b>トップダウン</b>（景気など大きな流れから考える）と<b>ボトムアップ</b>（1社ずつ調べて選ぶ）があります。</p>`,
 pt:"パッシブ＝指数と同じ動き／アクティブ＝指数を上回るのが目標",
 hon:"パッシブ運用は、日経平均株価などのベンチマークに連動する運用成果を目指す運用手法である。"},
{q:"ETF（上場投資信託）は、証券取引所に上場していて、株式と同じように、取引時間中いつでもその時の値段で売買できる。",a:true,
 exp:`<p>ふつうの投資信託は、1日1回決まる値段（<b>基準価額</b>）でしか買えません。</p><p>ETFは<mark>取引所に上場</mark>しているので、株と同じく<b>リアルタイムの値段で、指値・成行注文</b>もできます。信用取引も可能です。</p><p>不動産に投資する投資信託で上場しているものは<b>REIT（不動産投資信託）</b>といいます。</p>`,
 pt:"ETF＝上場している投資信託。株と同じように売買（指値・成行OK）",
 hon:"上場投資信託（ETF）は、証券取引所に上場しており、上場株式と同様に指値注文や成行注文により売買することができる。"},
{q:"外貨預金で、円をドルに替えて預けるときの為替レートは、TTB（対顧客電信買相場）である。",a:false,ha:true,ng:"円→外貨（預けるとき）は<b>TTS</b>。TTBは外貨→円（もどすとき）に使います。",fig:"gaika",
 exp:`<p>為替（かわせ）レートには3つあります。</p><p>・<b>TTM</b>：真ん中の基準のレート<br>・<mark>TTS</mark>：円 → 外貨 にするとき（銀行が外貨を<b>売る</b>＝Selling）<br>・<b>TTB</b>：外貨 → 円 にもどすとき（銀行が外貨を<b>買う</b>＝Buying）</p><p>レートは<b>銀行から見た言い方</b>なので、お客さんは「預けるときTTS、もどすときTTB」と覚えます。TTSはTTMより高く、TTBは低く、その差が手数料になります。</p>`,
 pt:"円→外貨はTTS（高い）／外貨→円はTTB（安い）",
 hon:"円貨を外貨に換えて外貨預金に預け入れる際に適用される為替レートは、TTSである。"},
{q:"外貨預金は、預金保険制度で守られる対象である。",a:false,
 exp:`<p>預金保険制度は、銀行がつぶれたときに預金を守るしくみです（<b>1人1つの銀行につき元本1,000万円とその利息</b>まで）。</p><p>でも、<mark>外貨預金は預金保険の対象外</mark>です。銀行がつぶれると、戻ってこない可能性があります。</p><p>また、利息がつかない・いつでも引き出せる・決済に使える<b>決済用預金</b>（当座預金など）は、<b>全額</b>守られます。</p>`,
 pt:"預金保険：元本1,000万円＋利息まで。外貨預金は対象外。決済用預金は全額",
 hon:"外貨預金は、預金保険制度の保護の対象とならない。"},
{q:"円をドルに替えて外貨預金をしたあと、円安（1ドル100円 → 120円など）になると、円にもどしたときに為替差益（もうけ）が出る。",a:true,fig:"gaika",
 exp:`<p>円安とは、<b>円の価値が下がり、外貨の価値が上がる</b>ことです。</p><p>1ドル100円のとき100万円をドルに替えると1万ドル。1ドル120円の円安になってから円にもどすと、1万ドル×120円＝<b>120万円</b>。<mark>20万円の為替差益</mark>です。</p><p>反対に<b>円高</b>（1ドル100円 → 80円）になると、損（<b>為替差損</b>）が出ます。</p>`,
 pt:"外貨預金：円安 → 為替差益／円高 → 為替差損",
 hon:"外貨預金の預入時に比べて満期時の為替レートが円安になれば、円換算の投資利回りは向上する。"},
{q:"NISA（少額投資非課税制度）の「つみたて投資枠」は年間120万円、「成長投資枠」は年間240万円まで投資できる。",a:true,fig:"nisa",
 exp:`<p>ふつうは、投資でもうけると約20%の税金がかかります。NISAの口座で投資すれば、<mark>もうけに税金がかかりません</mark>。</p><p>2024年から始まった今のNISAは：<br>・<b>つみたて投資枠</b>：年<mark>120万円</mark>（国が選んだ長期向けの投資信託など）<br>・<b>成長投資枠</b>：年<mark>240万円</mark>（株や投資信託など）<br>・2つを合わせて年<b>360万円</b>まで、両方同時に使える</p><p>使えるのは<b>18歳以上</b>で、非課税の期間は<b>無期限</b>です。</p>`,
 pt:"NISA：つみたて枠 年120万円＋成長枠 年240万円（合計年360万円）・非課税期間は無期限",
 hon:"NISAのつみたて投資枠の年間投資枠は120万円、成長投資枠の年間投資枠は240万円であり、両者は併用することができる。"},
{q:"NISAでは、一生のうちに非課税で持てる金額（生涯非課税限度額）は1,800万円で、そのうち成長投資枠は1,200万円までである。",a:true,fig:"nisa",
 exp:`<p>NISAには、一生で使える上限があります。</p><p><mark>生涯の上限＝1,800万円</mark>（買ったときの金額で数える）。そのうち<b>成長投資枠で使えるのは1,200万円まで</b>です。</p><p>売ると、その<b>買った金額分の枠が翌年に復活</b>し、また使えるようになります。</p>`,
 pt:"NISAの生涯上限1,800万円（うち成長投資枠1,200万円）。売ったら枠は翌年復活",
 hon:"NISAの非課税保有限度額（総枠）は1,800万円であり、そのうち成長投資枠は1,200万円である。"},
{q:"NISA口座で値下がりした株を売って出た損は、ほかの一般の口座（課税口座）で出たもうけと相殺（損益通算）できる。",a:false,fig:"nisa",
 exp:`<p>NISAは、もうけに税金がかからない代わりに、<mark>損が出ても「なかったこと」</mark>として扱われます。</p><p>そのため、ほかの口座のもうけとの差し引き（<b>損益通算</b>）や、損を翌年以降に持ち越す<b>繰越控除</b>はできません。</p><p>これはNISAのデメリットとしてよく出題されます。</p>`,
 pt:"NISAの損は、損益通算も繰越控除もできない",
 hon:"NISA口座内で生じた譲渡損失は、特定口座や一般口座で生じた譲渡益や配当等と損益通算することができない。"},
{q:"分散投資で、2つの資産の値動きの関係を表す「相関係数」が＋1（プラス1）のとき、リスクを減らす効果がもっとも大きい。",a:false,ha:true,ng:"＋1は「まったく同じ動き」で、分散の効果は<b>ありません</b>。効果が最大なのは<b>−1</b>のときです。",
 exp:`<p>「卵を1つのカゴに盛るな」という言葉があります。いろいろな資産に分けて持つと、損をする危険（リスク）を小さくできます。</p><p>相関係数は、2つの資産が<b>同じ動きをするか</b>を−1〜＋1で表します。<br>・<b>＋1</b>：まったく同じ動き → 分散の効果<b>なし</b><br>・<mark>−1</mark>：まったく逆の動き → 分散の効果が<mark>最大</mark></p><p>片方が下がるときにもう片方が上がるので、全体のゆれが小さくなります。</p>`,
 pt:"相関係数−1でリスク低減効果が最大／＋1で効果なし",
 hon:"2資産で構成されるポートフォリオにおいて、2資産間の相関係数が−1である場合、ポートフォリオのリスク低減効果は最大となる。"},
{q:"「ドルコスト平均法」とは、値段が上がっても下がっても、毎月同じ「数量（口数）」ずつ買い続ける方法である。",a:false,ha:true,ng:"ドルコスト平均法は、毎回同じ「<b>金額</b>」で買う方法です。だから安いときに多く買えます。",
 exp:`<p>ドルコスト平均法は、<mark>毎回同じ「金額」</mark>で買い続ける方法です（同じ「数」ではありません）。</p><p>1万円ずつ買う場合、1個1,000円なら10個、500円なら20個買えます。<b>安いときにたくさん、高いときに少し</b>買うことになり、平均の買値を下げやすくなります。</p><p>つみたてNISAやiDeCoは、この方法と相性がいいです。</p>`,
 pt:"ドルコスト平均法＝定額で買い続ける → 安いときに多く買える",
 hon:"ドルコスト平均法は、価格が変動する商品を定期的に一定金額ずつ購入する方法であり、価格が低いときに多くの口数を購入することができる。"},
{q:"72の法則では、年利6%で複利運用すると、お金が2倍になるのにおよそ6年かかる。",a:false,ha:true,ng:"72÷6＝<b>12年</b>です。",
 exp:`<p>複利（ふくり）は、<b>利息にもまた利息がつく</b>ふやし方です。雪だるまのように増えていきます。</p><p>お金が2倍になる年数は、<mark>72 ÷ 金利（%）</mark>でだいたいわかります。これを72の法則といいます。</p><p>72÷6＝<b>12年</b>。年利3%なら72÷3＝24年です。</p>`,
 pt:"72の法則：72÷利率（%）≒ 2倍になる年数",
 hon:"年利6%の1年複利で運用した場合、元本が2倍になるまでの期間は、72の法則によればおよそ12年である。",
 w:[["複利","ふくり","元本だけでなく、ついた利息にも利息がつくこと"],["単利","たんり","最初の元本にだけ利息がつくこと"]]},
{q:"金融サービス提供法では、金融商品を売る業者が大事なこと（重要事項）の説明をしなかったためにお客さんが損をした場合、業者は損害賠償の責任を負う。",a:true,
 exp:`<p>金融サービス提供法（正式名：金融サービスの提供及び利用環境の整備等に関する法律）は、<b>金融商品を買うお客さんを守る</b>法律です。</p><p>業者が「元本割れするかもしれない」などの<b>重要事項を説明しなかった</b>り、「絶対もうかる」と<b>断定的に言った</b>りしてお客さんが損をしたら、<mark>業者は損害賠償しなければなりません</mark>。</p><p>似た法律の<b>消費者契約法</b>は、だまされたりして結んだ契約を<b>取り消せる</b>法律です。</p>`,
 pt:"金融サービス提供法＝説明義務違反・断定的判断の提供 → 業者に損害賠償責任",
 hon:"金融サービス提供法では、金融サービス提供業者が顧客に対して重要事項の説明をしなかったことにより顧客に損害が生じた場合、当該業者は損害賠償責任を負う。"},
{q:"金融商品取引法の「適合性の原則」とは、お客さんの知識・経験・財産・目的に合わない金融商品をすすめてはいけない、というルールである。",a:true,
 exp:`<p>投資の経験がない人や、生活費しか持っていない人に、危険の大きい商品をすすめるのはよくありませんよね。</p><p><mark>適合性の原則</mark>は、お客さんの<b>知識・経験・財産の状況・投資の目的</b>に照らして、ふさわしくない勧誘をしてはいけない、というルールです。金融商品取引法に定められています。</p>`,
 pt:"適合性の原則＝顧客の知識・経験・財産・目的に合わない勧誘はダメ",
 hon:"金融商品取引法に定める適合性の原則とは、顧客の知識、経験、財産の状況および契約締結の目的に照らして不適当な勧誘を行ってはならないというものである。"}
].map(o=>Object.assign({g:3,c:"kin"},o)));
/* 3級・tax */
Q.push(...[
{q:"所得税は、個人が1月1日から12月31日までの1年間に得た「所得（もうけ）」にかかる税金である。",a:true,fig:"taxFlow",
 exp:`<p>所得税は、<b>1年間（1月1日〜12月31日）</b>の個人のもうけにかかる国の税金です。</p><p>ここで大事なのが「収入」と「所得」のちがい。<br>・<b>収入</b>：入ってきたお金の全部<br>・<mark>所得</mark>：収入から、かせぐためにかかった費用（必要経費など）を<b>引いた残り</b></p><p>税金は「所得」をもとに計算します。</p>`,
 pt:"所得税は1/1〜12/31の個人の所得（収入−必要経費など）にかかる",
 hon:"所得税は、原則として、個人が1月1日から12月31日までの1年間に得た所得に対して課される。"},
{q:"所得税では、所得をその性質によって10種類に分けて計算する。",a:true,fig:"shotoku10",
 exp:`<p>同じ「もうけ」でも、給料、家賃、株のもうけ…と性質がちがいます。そこで所得税では<mark>10種類</mark>に分けます。</p><p><b>利子・配当・不動産・事業・給与・退職・山林・譲渡・一時・雑</b>の10種類です。</p><p>覚え方の例：「<b>リハ（利・配）ビリ、不動（不）の事業（事）、給（給）料で隊（退）長、三（山）上（譲）で一（一）雑（雑）</b>」など、自分なりのゴロで覚えるのもおすすめです。</p>`,
 pt:"所得は10種類：利子・配当・不動産・事業・給与・退職・山林・譲渡・一時・雑",
 hon:"所得税法では、所得をその源泉や性質に応じて10種類に区分している。"},
{q:"所得税の税率は、所得が多くなるほど税率が高くなる「超過累進税率」で、5%から40%までの5段階である。",a:false,ha:true,ng:"所得税の税率は<b>5%〜45%の7段階</b>です。",fig:"taxFlow",
 exp:`<p>所得税は、<b>たくさんかせぐ人ほど高い税率</b>になるしくみです。</p><p>ただし、全部に高い税率がかかるのではなく、<mark>決められた金額をこえた「部分だけ」</mark>に高い税率がかかります。これを<b>超過累進税率</b>といいます。</p><p>税率は<b>5%・10%・20%・23%・33%・40%・45%</b>の7段階です。</p><p>なお、住民税はふつう<b>一律10%</b>です。</p>`,
 pt:"所得税＝超過累進税率5〜45%（7段階）／住民税＝一律10%",
 hon:"所得税の税率は、課税総所得金額に対して5%から45%の7段階の超過累進税率となっている。"},
{q:"銀行の預金の利息は「利子所得」で、20.315%の税金が差し引かれて（源泉分離課税）、確定申告はしない。",a:true,
 exp:`<p>預金の利息は<b>利子所得</b>です。</p><p>利息を受け取るとき、銀行が<mark>20.315%</mark>（所得税15%＋復興特別所得税0.315%＋住民税5%）を先に差し引いてくれます。これで<b>税金の手続きは全部おしまい</b>（源泉分離課税）。自分で確定申告する必要はありません。</p><p>復興特別所得税は、東日本大震災の復興のための税金で、所得税額の2.1%です（15%×2.1%＝0.315%）。</p>`,
 pt:"預金の利息＝利子所得・20.315%の源泉分離課税（申告不要）",
 hon:"国内の預貯金の利子は、原則として、20.315%の税率による源泉分離課税の対象となる。",
 w:[["源泉分離課税","げんせんぶんりかぜい","お金を受け取るときに税金が差し引かれ、それで手続きが終わるしくみ"]]},
{q:"会社員の給与所得は「給与の収入金額 － 必要経費」で計算する。",a:false,
 exp:`<p>会社員は、スーツ代や通勤の費用などを一つひとつ「必要経費」として計算するのは大変ですよね。</p><p>そこで給与所得は、<mark>給与の収入金額 － 給与所得控除額</mark>で計算します。給与所得控除は、<b>収入に応じて決まっている「みなし経費」</b>のようなものです。</p><p>必要経費を引くのは、事業所得や不動産所得などです。</p>`,
 pt:"給与所得＝給与収入 － 給与所得控除額（必要経費ではない）",
 hon:"給与所得の金額は、その年中の給与等の収入金額から給与所得控除額を控除した残額である。"},
{q:"退職所得は「（退職金 － 退職所得控除額）× 1/2」で計算し、ほかの所得と分けて税金を計算する（分離課税）。",a:true,fig:"taikin",
 exp:`<p>退職金は、長く働いたごほうび。老後の生活の大事なお金なので、<b>税金がとても安くなる</b>ようにできています。</p><p>① 退職金から<b>退職所得控除額</b>を引く<br>② さらに<mark>2分の1</mark>にする<br>③ ほかの所得と合わせずに税金を計算する（<b>分離課税</b>）</p><p>会社に「退職所得の受給に関する申告書」を出しておけば、正しい税金が差し引かれるので、<b>確定申告は不要</b>です。出さないと20.42%が差し引かれます（確定申告で精算できます）。</p>`,
 pt:"退職所得＝（退職金−退職所得控除）×1/2・分離課税",
 hon:"退職所得の金額は、原則として、その年中の退職手当等の収入金額から退職所得控除額を控除した残額の2分の1に相当する金額である。"},
{q:"勤続年数が30年の人の退職所得控除額は、「40万円×30年＝1,200万円」である。",a:false,ha:true,ng:"20年をこえる部分は1年70万円。「800万円＋70万円×（30年−20年）＝<b>1,500万円</b>」です。",fig:"taikin",
 exp:`<p>退職所得控除額は、<b>働いた年数（勤続年数）</b>で決まります。</p><p>・<b>20年以下</b>：40万円 × 勤続年数（最低80万円）<br>・<mark>20年超</mark>：800万円 ＋ 70万円 ×（勤続年数 − 20年）</p><p>30年なら 800万＋70万×10＝<b>1,500万円</b>。退職金が1,500万円以下なら、税金はかかりません。</p><p>勤続年数に<b>1年未満の端数があるときは切り上げ</b>ます（20年3か月→21年）。</p>`,
 pt:"退職所得控除：20年以下40万円×年数／20年超800万円＋70万円×(年数−20)。端数は切り上げ",
 hon:"勤続年数30年で退職した場合の退職所得控除額は、800万円＋70万円×（30年−20年）＝1,500万円となる。"},
{q:"一時所得は「（収入 － 収入を得るために使ったお金 － 特別控除100万円）」で計算し、その2分の1を他の所得と合計する。",a:false,ha:true,ng:"一時所得の特別控除は<b>50万円</b>です。",
 exp:`<p>一時所得は、<b>たまたま得た一時的なもうけ</b>です。例：懸賞や福引の賞金、競馬の払戻金、生命保険の満期保険金や解約返戻金（自分で保険料を払った場合）。</p><p>計算は：<br>① 収入 － 使ったお金 － <mark>50万円（特別控除）</mark><br>② その<mark>2分の1</mark>をほかの所得と合計（総合課税）</p><p>例：満期保険金600万円、払った保険料500万円なら、600−500−50＝50万円。その1/2の<b>25万円</b>が合計されます。</p>`,
 pt:"一時所得＝（収入−支出−50万円）、合計するのはその1/2",
 hon:"一時所得の金額は、総収入金額からその収入を得るために支出した金額の合計額を控除し、その残額から一時所得の特別控除額（最高50万円）を控除した金額であり、総所得金額にはその2分の1が算入される。"},
{q:"会社員が副業でアパートを貸して得た家賃収入は、「事業所得」になる。",a:false,fig:"shotoku10",
 exp:`<p>土地や建物を<b>貸して得たお金</b>は、<mark>不動産所得</mark>です。アパートの家賃、駐車場（月ぎめ）の料金、土地の地代などです。</p><p>ちなみに、たくさん貸しているかどうか（規模）にかかわらず、貸してもらうお金は不動産所得です。</p><p>一方で、<b>不動産屋さんが土地を売買して得たもうけ</b>は、商売なので<b>事業所得</b>になります。</p>`,
 pt:"アパートの家賃・地代・月ぎめ駐車場代 ＝ 不動産所得",
 hon:"アパートの貸付けによる賃貸収入は、その規模にかかわらず、不動産所得となる。"},
{q:"国からもらう老齢年金だけでなく、遺族年金や障害年金にも、雑所得として所得税がかかる。",a:false,ha:true,ng:"老齢年金は雑所得ですが、<b>遺族年金・障害年金は非課税</b>です。",
 exp:`<p>老後にもらう年金（老齢年金）は<mark>雑所得</mark>です。「公的年金等控除額」を引いて計算します。</p><p>一方、家族が亡くなってもらう<b>遺族年金</b>や、障害のある人がもらう<b>障害年金</b>は、<mark>非課税</mark>（税金なし）です。</p>`,
 pt:"老齢年金＝雑所得（公的年金等控除あり）／遺族年金・障害年金＝非課税",
 hon:"公的年金制度から支給される老齢給付は雑所得として課税されるが、遺族給付や障害給付は非課税である。"},
{q:"損益通算（そんえきつうさん）で、ほかの所得のもうけと差し引きできる損失は、「不動産所得・事業所得・雑所得・譲渡所得」の4つの損失である。",a:false,ha:true,ng:"雑所得の損失は損益通算<b>できません</b>。できるのは「不動産・事業・<b>山林</b>・譲渡（富士山上）」です。",fig:"tsusan",
 exp:`<p>損益通算とは、ある所得で出た<b>損（赤字）</b>を、ほかの所得の<b>もうけ</b>と差し引きすることです。そのぶん税金が安くなります。</p><p>差し引きできる損は<mark>不動産・事業・山林・譲渡</mark>の4つだけ。<br>覚え方：<b>「ふ・じ・さん・じょう（富士山上）」</b></p><p>雑所得や一時所得の損は、差し引きできません。</p>`,
 pt:"損益通算できる損失は「不・事・山・譲（富士山上）」",
 hon:"損益通算の対象となる損失は、不動産所得、事業所得、山林所得、譲渡所得の金額の計算上生じた損失である。"},
{q:"不動産所得の赤字のうち、「土地を買うために借りたお金の利息」に相当する部分は、損益通算できない。",a:true,fig:"tsusan",
 exp:`<p>富士山上（不・事・山・譲）の赤字でも、<b>損益通算できない例外</b>があります。</p><p>・不動産所得の赤字のうち、<mark>土地を買うための借入金の利息</mark>の部分<br>・<b>ゴルフ会員権や別荘</b>など、生活に必要でない資産を売った損<br>・<b>土地や建物を売った損</b>（マイホームの一定の特例を除く）<br>・<b>株を売った損</b>（上場株式は、配当などとだけ通算できる）</p>`,
 pt:"不動産所得の赤字のうち「土地取得の借入金利子」は損益通算できない",
 hon:"不動産所得の金額の計算上生じた損失のうち、土地の取得に要した負債の利子に相当する部分の金額は、損益通算の対象とならない。"},
{q:"医療費控除は、1年間に払った医療費（保険金などで補てんされた分を除く）が10万円（総所得金額等が200万円未満の人はその5%）をこえた分を、最高200万円まで所得から差し引ける。",a:true,
 exp:`<p>病院代がたくさんかかった年は、<b>医療費控除</b>で税金が安くなります。</p><p>計算：<mark>医療費 － 保険金などでもらった分 － 10万円</mark>（所得が200万円未満の人は所得の5%）。上限は<b>200万円</b>です。</p><p>自分の分だけでなく、<b>生計を一にする家族の分</b>もまとめられます。</p><p>対象になる例：治療のための薬、通院の電車・バス代。<br>対象外の例：健康診断（病気が見つからなかった場合）、美容整形、ビタミン剤など。</p>`,
 pt:"医療費控除＝（医療費−保険金等−10万円）、上限200万円",
 hon:"医療費控除の金額は、その年中に支払った医療費の額から保険金等で補塡される金額を控除し、さらに10万円（総所得金額等が200万円未満の場合はその5%）を控除した金額で、最高200万円である。",
 w:[["生計を一にする","せいけいをいつにする","同じお財布で生活していること。同居していなくても、仕送りなどで生活費が同じならOK"]]},
{q:"「セルフメディケーション税制」と「通常の医療費控除」は、同じ年に両方使うことができる。",a:false,
 exp:`<p>セルフメディケーション税制は、ドラッグストアで買う<b>特定の市販薬（スイッチOTC医薬品など）</b>の購入費が<b>1万2,000円</b>をこえた分を、<b>最高8万8,000円</b>まで差し引ける制度です。健康診断などを受けていることが条件です。</p><p>ただし、<mark>通常の医療費控除とはどちらか一方しか選べません</mark>。</p>`,
 pt:"セルフメディケーション税制（1.2万円超・上限8.8万円）は通常の医療費控除と選択",
 hon:"セルフメディケーション税制による医療費控除の特例は、通常の医療費控除と選択適用であり、両方を同時に適用することはできない。"},
{q:"会社員が、生計を一にする家族の国民年金や国民健康保険の保険料を代わりに払っても、自分の社会保険料控除にはできない。",a:false,ha:true,ng:"生計を一にする家族の分を<b>自分が払えば</b>、自分の社会保険料控除に<b>できます</b>（全額）。",
 exp:`<p>健康保険・年金・介護保険・雇用保険などの<b>社会保険料</b>は、<mark>払った金額の全額</mark>を所得から差し引けます（社会保険料控除）。</p><p>自分の分だけでなく、<b>生計を一にする家族の分を自分が払った</b>場合も、自分の控除にできます。</p><p>生命保険料控除のように上限はありません。</p>`,
 pt:"社会保険料控除＝払った額の全額（家族の分を払ってもOK）",
 hon:"納税者が生計を一にする配偶者その他の親族の負担すべき社会保険料を支払った場合、その金額も社会保険料控除の対象となる。"},
{q:"配偶者控除は、本人の合計所得金額が1,000万円をこえている場合でも受けられる。",a:false,
 exp:`<p>配偶者控除は、所得が少ない妻（夫）を養っている人が受けられる控除で、最高<b>38万円</b>（配偶者が70歳以上なら48万円）です。</p><p>ただし、<mark>本人の合計所得金額が1,000万円をこえると受けられません</mark>（給与だけなら年収約1,195万円超）。また、本人の所得が900万円をこえると、控除額が段階的に減ります。</p><p>配偶者の合計所得金額が<b>58万円以下</b>（2025年分から）であることも条件です。</p>`,
 pt:"配偶者控除：最高38万円。本人の合計所得1,000万円超は不可。配偶者の合計所得58万円以下",
 hon:"納税者本人の合計所得金額が1,000万円を超える場合、配偶者控除の適用を受けることはできない。"},
{q:"19歳以上23歳未満の子ども（特定扶養親族）を養っている場合の扶養控除は38万円である。",a:false,ha:true,ng:"特定扶養親族（19〜22歳）は<b>63万円</b>。38万円は一般の扶養親族です。",fig:"fuyo",
 exp:`<p>扶養控除は、家族（配偶者以外）を養っているときに受けられる控除です。年齢で金額が変わります。</p><p>・<b>16歳未満</b>：なし（児童手当があるため）<br>・<b>16〜18歳</b>：38万円<br>・<mark>19〜22歳（特定扶養親族）：63万円</mark>（大学生のころはお金がかかるので多め）<br>・<b>23〜69歳</b>：38万円<br>・<b>70歳以上</b>：48万円（同居している親などは58万円）</p><p>年齢は<b>その年の12月31日</b>の時点で判断します。</p>`,
 pt:"扶養控除：16歳未満なし／一般38万円／特定(19〜22歳)63万円／老人48万円(同居老親58万円)",
 hon:"特定扶養親族（その年の12月31日現在の年齢が19歳以上23歳未満の扶養親族）に係る扶養控除の額は、63万円である。"},
{q:"住宅ローン控除（住宅借入金等特別控除）は、所得から差し引く「所得控除」である。",a:false,fig:"taxFlow",
 exp:`<p>税金を安くする「控除」には2種類あります。</p><p>・<b>所得控除</b>：税金を計算する<b>前</b>に、所得から引く（医療費控除、扶養控除など）<br>・<mark>税額控除</mark>：計算した<b>税金そのもの</b>から引く</p><p>住宅ローン控除は<mark>税額控除</mark>。税金から直接引けるので、効果が大きいです。</p><p>今の制度では、年末のローン残高の<b>0.7%</b>を、新築なら原則<b>13年間</b>、税金から差し引けます。</p>`,
 pt:"住宅ローン控除は「税額控除」（年末残高×0.7%）",
 hon:"住宅借入金等特別控除は税額控除であり、算出された所得税額から直接控除する。"},
{q:"住宅ローン控除を受けるには、原則として、返済期間が10年以上の住宅ローンであることが必要である。",a:true,
 exp:`<p>住宅ローン控除を受けるための主な条件：</p><p>・<mark>返済期間10年以上</mark>のローン<br>・家の床面積が<b>50㎡以上</b>（合計所得1,000万円以下の人は40㎡以上でもOKな特例あり）<br>・その年の合計所得金額が<b>2,000万円以下</b><br>・家を手に入れてから<b>6か月以内に住む</b></p><p>注意：繰上げ返済をして、最初から数えて返済期間が<b>10年未満</b>になると、その年から控除は受けられません。</p>`,
 pt:"住宅ローン控除：返済期間10年以上・床面積50㎡以上・合計所得2,000万円以下",
 hon:"住宅借入金等特別控除の適用を受けるためには、住宅ローンの返済期間が10年以上であることが必要であり、繰上げ返済により当初からの返済期間が10年未満となった場合は、以後適用を受けることができない。"},
{q:"所得税の確定申告は、原則として、所得があった年の翌年1月1日から1月31日までに行う。",a:false,ha:true,ng:"確定申告は<b>翌年2月16日〜3月15日</b>です。",
 exp:`<p>確定申告は、<b>1年間のもうけと税金を自分で計算して、税務署に届け出る</b>手続きです。</p><p>期間は<mark>翌年2月16日〜3月15日</mark>。e-Tax（国税電子申告・納税システム）を使えば、パソコンやスマホからもできます。</p><p>税金を返してもらうだけの申告（<b>還付申告</b>）は、翌年1月1日から5年間できます。</p>`,
 pt:"確定申告は翌年2/16〜3/15。還付申告は5年間OK",
 hon:"所得税の確定申告書は、原則として、その年の翌年2月16日から3月15日までの間に、納税者の住所地の所轄税務署長に提出しなければならない。"},
{q:"会社員は年末調整があるので、給与の収入が2,000万円をこえていても、確定申告をする必要はない。",a:false,
 exp:`<p>会社員は、会社が1年分の税金を最後に計算し直してくれる<b>年末調整</b>があるので、ふつうは確定申告はいりません。</p><p>でも、次のような人は<mark>確定申告が必要</mark>です。<br>・給与の収入が<mark>2,000万円をこえる</mark><br>・給与以外の所得（副業など）が<b>20万円をこえる</b><br>・2か所以上から給与をもらっている（一定の場合）</p><p>また、<b>医療費控除・寄附金控除（ふるさと納税）・住宅ローン控除の1年目</b>は、年末調整では受けられないので、確定申告をします。</p>`,
 pt:"給与2,000万円超・給与以外の所得20万円超 → 確定申告が必要",
 hon:"給与所得者であっても、その年中の給与等の金額が2,000万円を超える者は、確定申告をしなければならない。"},
{q:"青色申告をしている個人事業主が、e-Taxで申告するなどの条件を満たすと、最高65万円の青色申告特別控除が受けられる。",a:true,
 exp:`<p>青色申告は、帳簿をきちんとつける代わりに、税金で<b>いろいろな特典</b>がもらえる申告方法です。対象は<b>不動産所得・事業所得・山林所得</b>のある人です。</p><p>いちばんの特典が<b>青色申告特別控除</b>：<br>・<mark>65万円</mark>：複式簿記＋貸借対照表などを出し＋<b>e-Taxで申告（または電子帳簿保存）</b><br>・<b>55万円</b>：上の条件のうち電子の要件がない<br>・<b>10万円</b>：それ以外</p><p>ほかに、家族への給料を経費にできる、赤字を<b>3年間</b>くり越せる、などの特典もあります。</p>`,
 pt:"青色申告特別控除：65万円（e-Tax等）／55万円／10万円。純損失は3年繰越し",
 hon:"青色申告特別控除の控除額は、所定の要件を満たし、e-Taxにより申告すること等の要件を満たした場合、最高65万円である。"},
{q:"新しく青色申告を始めたい人は、原則として、青色申告をしようとする年の3月15日までに「青色申告承認申請書」を税務署に出す。",a:true,
 exp:`<p>青色申告は、<b>前もって税務署に申し込む</b>必要があります。</p><p>締め切りは<mark>その年の3月15日まで</mark>。<br>ただし、<b>1月16日以後に新しく仕事を始めた</b>場合は、<b>始めた日から2か月以内</b>です。</p>`,
 pt:"青色申告承認申請：原則その年の3/15まで（1/16以後の開業は2か月以内）",
 hon:"新たに青色申告の承認を受けようとする者は、原則として、青色申告をしようとする年の3月15日までに青色申告承認申請書を提出しなければならない。"},
{q:"ふるさと納税をした会社員が「ワンストップ特例制度」を使うには、1年間の寄附先が5つの自治体以内である必要がある。",a:true,
 exp:`<p>ふるさと納税は、好きな自治体に<b>寄附</b>すると、2,000円をこえる部分が所得税・住民税から差し引かれる制度です（寄附金控除）。</p><p>本来は確定申告が必要ですが、会社員など確定申告がいらない人は、<b>ワンストップ特例</b>を使えば申告なしでOK。</p><p>条件は<mark>1年の寄附先が5自治体以内</mark>であること。6つ以上なら確定申告が必要です。</p>`,
 pt:"ワンストップ特例：確定申告不要の人・寄附先5自治体以内",
 hon:"寄附金税額控除に係る申告特例（ワンストップ特例）の適用を受けるためには、その年の寄附先が5自治体以内であることが必要である。"},
{q:"上場株式の配当は、確定申告をしないで、受け取るときに税金（20.315%）を差し引かれて終わりにする「申告不要」を選ぶことができる。",a:true,
 exp:`<p>上場株式の配当（配当所得）の税金は、受け取るときに<b>20.315%</b>が差し引かれます。</p><p>そのあとは3つから選べます。<br>・<mark>申告不要</mark>：そのまま終わり<br>・<b>総合課税</b>で確定申告：<b>配当控除</b>が受けられる（所得が少ない人に有利）<br>・<b>申告分離課税</b>で確定申告：株の売却損と<b>損益通算</b>できる</p>`,
 pt:"上場株式の配当：申告不要／総合課税（配当控除）／申告分離（損益通算）を選べる",
 hon:"上場株式等の配当等については、確定申告不要制度を選択することができる。"},
{q:"上場株式を売ったもうけ（譲渡所得）は、ほかの所得と合計せず、20.315%の税率で税金を計算する（申告分離課税）。",a:true,
 exp:`<p>株を売ったもうけは<b>譲渡所得</b>で、<mark>20.315%（所得税15%＋復興特別所得税0.315%＋住民税5%）</mark>の<b>申告分離課税</b>です。</p><p>証券会社の<b>特定口座（源泉徴収あり）</b>を使えば、証券会社が税金を差し引いてくれるので、<b>確定申告をしなくてもOK</b>です。</p><p>売って損が出た場合は、確定申告をすれば翌年から<b>3年間くり越せます</b>（繰越控除）。</p>`,
 pt:"上場株式の譲渡益＝20.315%の申告分離課税。損は3年繰越し可",
 hon:"上場株式等の譲渡損失の金額は、確定申告により、翌年以後3年間にわたって繰り越すことができる。"}
].map(o=>Object.assign({g:3,c:"tax"},o)));
